<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion 2.0 — Matrices</title><style>body{margin:0;background:#0b0f14;color:#edf2f6;font-family:system-ui}#loading{padding:40px;font-size:22px}.matrix{background:#151b22;border:1px solid #303b48;border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px}.mut{color:#99a6b3;font-size:13px}button{font:inherit;padding:10px 14px;border-radius:9px;border:1px solid #303b48;background:#151b22;color:#edf2f6}.danger{background:#3b2020}.primary{background:#263b55}</style></head><body><div id="loading">Cargando KT Companion…</div><script>
fetch("ktcompanion-v16-estable-armas.html",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("No se pudo cargar la base");return r.text()}).then(html=>{
 const i=html.lastIndexOf("</body>"); const patch=`<script>
 (function(){
  function esc(x){return String(x??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
  window.showSaved=function(){
   document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
   let p=document.getElementById("saved");
   if(!p){p=document.createElement("section");p.id="saved";p.className="page active";p.innerHTML="<div class=matrix><h2>📚 Matrices guardadas</h2><div id=savedList></div><p><button onclick=location.reload()>➕ Crear nueva matriz</button></p></div>";document.querySelector("main").appendChild(p);}
   p.classList.add("active");renderSaved();
  };
  window.renderSaved=function(){
   const box=document.getElementById("savedList"),all=JSON.parse(localStorage.getItem("ktc2")||"[]");
   if(!all.length){box.innerHTML="<p class=mut>No hay matrices guardadas.</p>";return;}
   box.innerHTML=all.map(m=>"<div class=matrix data-id="+esc(m.id)+"><div class=row><div><b>"+esc(m.friend)+(m.enemy?" vs "+esc(m.enemy):" — sin rival")+"</b><div class=mut>"+esc(m.date)+"</div></div><button class=danger onclick=deleteMatrix("+esc(m.id)+")>🗑️ Borrar</button></div><p class=mut>🗺️ "+esc(m.map)+" · 🎯 "+esc(m.operation)+"</p><details><summary>Ver resumen del combate</summary><p><b>🟢 Amigo</b><br>Operativos: "+esc((m.friendOperatives||[]).map(o=>o.name+" ×"+(o.count||1)).join(", ")||"Ninguno")+"<br>Tácticas: "+esc((m.chapter?.friend||[]).join(", ")||"Ninguna")+"</p><p><b>🔴 Rival</b><br>Operativos: "+esc((m.enemyOperatives||[]).map(o=>o.name+" ×"+(o.count||1)).join(", ")||"Ninguno")+"<br>Tácticas: "+esc((m.chapter?.enemy||[]).join(", ")||"Ninguna")+"</p>"+[1,2,3,4].map(t=>"<p><b>T"+t+"</b><br>🟢 Estrategia: "+esc((m.turns?.friend?.[t]?.strategy||[]).join(", ")||"—")+" · Tiroteo: "+esc((m.turns?.friend?.[t]?.firefight||[]).join(", ")||"—")+" · Facción: "+esc((m.turns?.friend?.[t]?.faction||[]).join(", ")||"—")+" · Universal: "+esc((m.turns?.friend?.[t]?.universal||[]).join(", ")||"—")+"<br>🔴 Estrategia: "+esc((m.turns?.enemy?.[t]?.strategy||[]).join(", ")||"—")+" · Tiroteo: "+esc((m.turns?.enemy?.[t]?.firefight||[]).join(", ")||"—")+" · Facción: "+esc((m.turns?.enemy?.[t]?.faction||[]).join(", ")||"—")+" · Universal: "+esc((m.turns?.enemy?.[t]?.universal||[]).join(", ")||"—")+"</p>").join("")+"</details></div>").join("");
  };
  window.deleteMatrix=function(id){if(!confirm("¿Borrar esta matriz?"))return;let a=JSON.parse(localStorage.getItem("ktc2")||"[]").filter(m=>String(m.id)!==String(id));localStorage.setItem("ktc2",JSON.stringify(a));renderSaved();};
  const nav=document.querySelector(".nav")||document.querySelector("main>div");
  if(nav){const b=document.createElement("button");b.textContent="📚 Matrices guardadas";b.onclick=showSaved;nav.appendChild(b);}
  const oldPage2=window.page;window.page=function(x){if(x==="saved"){showSaved();return}oldPage2(x);};
 })();
<\/script>`;
 const patched=html.slice(0,i)+patch+html.slice(i);document.open();document.write(patched);document.close();
}).catch(e=>{document.getElementById("loading").textContent="Error al cargar KT Companion";console.error(e)});
</script></body></html>
