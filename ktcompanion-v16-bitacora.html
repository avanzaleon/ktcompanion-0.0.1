<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101216"><title>KT Companion — Matrices y bitácora</title><style>body{margin:0;background:#080c11;color:#eef2f6;font:15px system-ui,sans-serif}#bar{position:sticky;top:0;z-index:20;background:#10151b;border-bottom:1px solid #303a45;padding:10px;display:flex;gap:8px;flex-wrap:wrap}button{background:#151a20;color:#eef2f6;border:1px solid #303a45;border-radius:9px;padding:10px 13px;font:inherit}.primary{background:#263b55;border-color:#6d9dcc}iframe{display:block;width:100%;height:calc(100vh - 66px);border:0}.hidden{display:none}#saved{padding:14px;max-width:1050px;margin:auto}.card{background:#151a20;border:1px solid #303a45;border-radius:14px;padding:15px;margin-bottom:13px}.mut{color:#9aa7b4;font-size:13px}.danger{background:#3b2020;border-color:#633838}.turn{border:1px solid #303a45;border-radius:12px;padding:12px;margin:10px 0}.opline{margin:4px 0}.weaponline{margin-left:12px;color:#b8c3cd}.pick{margin:4px 0}</style></head><body><div id="bar"><button class="primary" onclick="showApp()">⚔️ Matriz</button><button onclick="saveMatrix()">💾 Guardar matriz</button><button onclick="showSaved()">📚 Matrices guardadas</button></div><iframe id="app" src="ktcompanion-v16-estable-armas.html"></iframe><section id="saved" class="hidden"><div class="card"><h2>📚 Matrices guardadas</h2><div class="mut">Pulsa una matriz para consultar su cuaderno de bitácora.</div></div><div id="list"></div></section><script>const app=document.getElementById('app'),saved=document.getElementById('saved'),list=document.getElementById('list');function w(){return app.contentWindow}function showApp(){saved.classList.add('hidden');app.classList.remove('hidden')}function showSaved(){saved.classList.remove('hidden');app.classList.add('hidden');renderSaved()}function txt(el){return(el?.textContent||'').replace(/\s+/g,' ').trim()}function ev(expr,fb){try{return w().eval(expr)}catch(e){console.warn(e);return fb}}function army(side){return w().document.getElementById(side)?.value||''}function readOps(side){try{w().switchSide(side)}catch(e){}const out=[];w().document.querySelectorAll('#ops .op').forEach(op=>{const name=txt(op.querySelector('.opname')?.childNodes[0]);const q=parseInt(txt(op.querySelector('.qty b')))||0;if(!name||!q)return;const weapons=[...op.querySelectorAll('.weapon button.on')].map(b=>txt(b.parentElement?.querySelector('.wname'))).filter(Boolean);out.push({name,count:q,weapons:[...new Set(weapons)]})});return out}function readState(){const raw=ev('JSON.stringify({turns:turns,counts:counts,map:selectedMap,operation:selectedOperation})','');if(!raw)return null;try{return JSON.parse(raw)}catch(e){return null}}function snapshot(){const st=readState()||{};const friend=army('friend'),enemy=army('enemy');const friendOps=readOps('friend'),enemyOps=enemy?readOps('enemy'):[];let turnsData=st.turns||{friend:{},enemy:{}};return{id:Date.now(),date:new Date().toLocaleString('es-ES'),friend,enemy,map:st.map||txt(w().document.querySelector('.mapchoice.selected')),operation:st.operation||txt(w().document.querySelector('.opchoice.selected')).replace(/^\d+\.\s*/,''),friendOperatives:friendOps,enemyOperatives:enemyOps,turns:turnsData}}function saveMatrix(){try{const m=snapshot();if(!m.friend)return alert('Selecciona el ejército amigo antes de guardar.');if(!m.map||!m.operation)return alert('Selecciona mapa y operación antes de guardar.');const all=JSON.parse(localStorage.getItem('ktc2')||'[]');all.unshift(m);localStorage.setItem('ktc2',JSON.stringify(all));alert('Matriz guardada correctamente.');showSaved()}catch(e){alert('No se pudo guardar: '+e.message)}}function arr(a){return Array.isArray(a)&&a.length?a.join(', '):'—'}function opsHtml(ops){if(!ops?.length)return'Ninguno';return ops.map(o=>'<div class="opline">'+o.name+(o.count>1?' ×'+o.count:'')+'</div>'+((o.weapons||[]).map(x=>'<div class="weaponline">🔫 '+x+'</div>').join(''))).join('')}function timeline(m){return[1,2,3,4].map(t=>{const f=m.turns?.friend?.[t]||{},e=m.turns?.enemy?.[t]||{};return'<div class="turn"><h3>T'+t+'</h3><b>🟢 Amigo</b><div class="mut">Estrategia: '+arr(f.strategy)+'<br>Tiroteo: '+arr(f.firefight)+'<br>Equipo de facción: '+arr(f.faction)+'<br>Equipo universal: '+arr(f.universal)+'</div><br><b>🔴 Rival</b><div class="mut">Estrategia: '+arr(e.strategy)+'<br>Tiroteo: '+arr(e.firefight)+'<br>Equipo de facción: '+arr(e.faction)+'<br>Equipo universal: '+arr(e.universal)+'</div></div>'}).join('')}function del(id){if(!confirm('¿Borrar esta matriz?'))return;const a=JSON.parse(localStorage.getItem('ktc2')||'[]').filter(x=>String(x.id)!==String(id));localStorage.setItem('ktc2',JSON.stringify(a));renderSaved()}function renderSaved(){const all=JSON.parse(localStorage.getItem('ktc2')||'[]');list.innerHTML=all.length?all.map(m=>'<article class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div><h2 style="margin:0">'+(m.friend||'Sin amigo')+(m.enemy?' vs '+m.enemy:' — sin rival')+'</h2><div class="mut">'+(m.date||'')+'</div></div><button class="danger" onclick="del('+m.id+')">🗑️ Borrar</button></div><p>🗺️ '+(m.map||'—')+' · 🎯 '+(m.operation||'—')+'</p><details open><summary><b>📓 Cuaderno de bitácora</b></summary><div class="card"><h3>🟢 Amigo</h3><div class="mut">Operativos:</div>'+opsHtml(m.friendOperatives)+'</div><div class="card"><h3>🔴 Rival</h3><div class="mut">Operativos:</div>'+opsHtml(m.enemyOperatives)+'</div>'+timeline(m)+'</details></article>').join(''):'<div class="card">No hay matrices guardadas.</div>'}</script></body></html>
