<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101216"><title>KT Companion — Matrices y bitácora</title><style>body{margin:0;background:#080c11;color:#eef2f6;font:15px system-ui,sans-serif}#bar{position:sticky;top:0;z-index:20;background:#10151b;border-bottom:1px solid #303a45;padding:10px;display:flex;gap:8px;flex-wrap:wrap}button{background:#151a20;color:#eef2f6;border:1px solid #303a45;border-radius:9px;padding:10px 13px;font:inherit}.primary{background:#263b55;border-color:#6d9dcc}iframe{display:block;width:100%;height:calc(100vh - 66px);border:0}.hidden{display:none}#saved{padding:14px;max-width:1050px;margin:auto}.card{background:#151a20;border:1px solid #303a45;border-radius:14px;padding:15px;margin-bottom:13px}.mut{color:#9aa7b4;font-size:13px}.danger{background:#3b2020;border-color:#633838}.turn{border:1px solid #303a45;border-radius:12px;padding:12px;margin:10px 0}</style></head><body><div id="bar"><button class="primary" onclick="showApp()">⚔️ Matriz</button><button onclick="saveMatrix()">💾 Guardar matriz</button><button onclick="showSaved()">📚 Matrices guardadas</button></div><iframe id="app" src="ktcompanion-v16-estable-armas.html"></iframe><section id="saved" class="hidden"><div class="card"><h2>📚 Matrices guardadas</h2><div class="mut">Pulsa una matriz para consultar su cuaderno de bitácora. No se puede editar desde aquí.</div></div><div id="list"></div></section><script>const app=document.getElementById('app');const $=id=>document.getElementById(id);function win(){return app.contentWindow}function showApp(){$('saved').classList.add('hidden');app.classList.remove('hidden')}function showSaved(){$('saved').classList.remove('hidden');app.classList.add('hidden');renderSaved()}function safe(fn,fallback){try{return fn()}catch(e){return fallback}}function clean(v){return Array.isArray(v)?v.filter(Boolean):[]}function internal(w,expr,fallback){return safe(()=>w.eval(expr),fallback)}function getSelectedWeapons(w){return safe(()=>{const out={};const ops=w.document.querySelectorAll('#ops .op');ops.forEach(op=>{const name=op.querySelector('.opname')?.childNodes[0]?.textContent?.trim();if(!name)return;const picked=[...op.querySelectorAll('.weapon button.on')].map(b=>b.parentElement?.querySelector('.wname')?.textContent?.trim()).filter(Boolean);if(picked.length)out[name]=[...new Set(picked)]});return out},{})}function snapshot(){const w=win();const enemy=w.document.getElementById('enemy')?.value||'';const friend=w.document.getElementById('friend')?.value||'';const counts=internal(w,'JSON.parse(JSON.stringify(counts))',{friend:{},enemy:{}});const turns=internal(w,'JSON.parse(JSON.stringify(turns))',{friend:{},enemy:{}});const map=internal(w,'selectedMap','');const operation=internal(w,'selectedOperation','');const weapons=getSelectedWeapons(w);function sideOps(side){return Object.entries(counts[side]||{}).filter(([n,c])=>c>0).map(([n,c])=>({name:n,count:c,weapons:weapons[n]||[]}))}return{id:Date.now(),date:new Date().toLocaleString('es-ES'),friend,enemy,map,operation,friendOperatives:sideOps('friend'),enemyOperatives:sideOps('enemy'),turns}}function saveMatrix(){const m=snapshot();if(!m.friend)return alert('Selecciona el ejército amigo antes de guardar.');if(!m.map||!m.operation)return alert('Selecciona mapa y operación antes de guardar.');const all=JSON.parse(localStorage.getItem('ktc2')||'[]');all.unshift(m);localStorage.setItem('ktc2',JSON.stringify(all));alert('Matriz guardada correctamente.');showSaved()}function del(id){if(!confirm('¿Borrar esta matriz?'))return;const all=JSON.parse(localStorage.getItem('ktc2')||'[]').filter(x=>String(x.id)!==String(id));localStorage.setItem('ktc2',JSON.stringify(all));renderSaved()}function arr(a){return clean(a).join(', ')||'—'}function opsText(a){return (a||[]).map(o=>o.name+(o.count>1?' ×'+o.count:'')).join(', ')||'Ninguno'}function timeline(m){return[1,2,3,4].map(t=>{const f=m.turns?.friend?.[t]||{},e=m.turns?.enemy?.[t]||{};return `<div class="turn"><h3>T${t}</h3><b>🟢 Amigo</b><div class="mut">Estrategia: ${arr(f.strategy)}<br>Tiroteo: ${arr(f.firefight)}<br>Equipo de facción: ${arr(f.faction)}<br>Equipo universal: ${arr(f.universal)}</div><br><b>🔴 Rival</b><div class="mut">Estrategia: ${arr(e.strategy)}<br>Tiroteo: ${arr(e.firefight)}<br>Equipo de facción: ${arr(e.faction)}<br>Equipo universal: ${arr(e.universal)}</div></div>`}).join('')}function renderSaved(){const all=JSON.parse(localStorage.getItem('ktc2')||'[]');$('list').innerHTML=all.length?all.map(m=>`<article class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div><h2 style="margin:0">${m.friend||'Sin amigo'} ${m.enemy?'vs '+m.enemy:'— sin rival'}</h2><div class="mut">${m.date||''}</div></div><button class="danger" onclick="del(${m.id})">🗑️ Borrar</button></div><p>🗺️ ${m.map||'—'} · 🎯 ${m.operation||'—'}</p><details open><summary><b>📓 Cuaderno de bitácora</b></summary><div class="card"><h3>🟢 Amigo</h3><div class="mut">Operativos: ${opsText(m.friendOperatives)}</div>${(m.friendOperatives||[]).map(o=>o.weapons?.length?`<div class="mut">${o.name}: ${arr(o.weapons)}</div>`:'').join('')}</div><div class="card"><h3>🔴 Rival</h3><div class="mut">Operativos: ${opsText(m.enemyOperatives)}</div>${(m.enemyOperatives||[]).map(o=>o.weapons?.length?`<div class="mut">${o.name}: ${arr(o.weapons)}</div>`:'').join('')}</div>${timeline(m)}</details></article>`).join(''):'<div class="card">No hay matrices guardadas.</div>'}</script></body></html>
