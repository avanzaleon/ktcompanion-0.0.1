<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151b"><title>KT Companion 2.0</title><style>body{margin:0;background:#0b0f14;color:#edf2f6;font:15px system-ui,sans-serif}#tools{position:sticky;top:0;z-index:10;background:#10151b;border-bottom:1px solid #303a45;padding:8px;display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;color:#edf2f6;background:#151a20;border:1px solid #303a45;border-radius:10px;padding:10px 13px}.primary{background:#263b55;border-color:#6d9dcc}#game{display:block}#saved{display:none;padding:14px;max-width:1050px;margin:auto}.card{background:#151a20;border:1px solid #303a45;border-radius:14px;padding:14px;margin:10px 0}.mut{color:#9aa7b4}.turn{border:1px solid #303a45;border-radius:12px;padding:12px;margin:8px 0}.danger{background:#3b2020;border-color:#633838}iframe{display:block;width:100%;height:calc(100vh - 61px);border:0}</style></head><body><div id="tools"><button class="primary" onclick="backToGame()">⚔️ Matriz</button><button onclick="saveGame()">💾 Guardar matriz</button><button onclick="showSaved()">📚 Matrices guardadas</button></div><div id="game"><iframe id="frame" src="./ktcompanion-v17-ejercitos2.html?v=20260818"></iframe></div><main id="saved"><div class="card"><h2>📚 Matrices guardadas</h2><div class="mut">Pulsa «Abrir cuaderno» para consultar el resumen.</div></div><div id="savedList"></div></main><script>const KEY='kt_companion_matrices_v3';const frame=document.getElementById('frame');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function w(){return frame.contentWindow}function arr(x){return Array.isArray(x)?x:[]}function snap(){const x=w();try{if(typeof x.snapshotTurns==='function')x.snapshotTurns();if(typeof x.snapshotChapter==='function')x.snapshotChapter()}catch(e){}const friend=x.document.getElementById('friend')?.value||'',enemy=x.document.getElementById('enemy')?.value||'';return{id:Date.now(),date:new Date().toLocaleString('es-ES'),friend,enemy,map:x.selectedMap||'',operation:x.selectedOperation||'',counts:JSON.parse(JSON.stringify(x.counts||{friend:{},enemy:{}})),turns:JSON.parse(JSON.stringify(x.turns||{friend:{},enemy:{}})),chapterSelections:JSON.parse(JSON.stringify(x.chapterSelections||{friend:[],enemy:[]})),weapons:JSON.parse(JSON.stringify(x.weaponSelections||{friend:{},enemy:{}}))}}function saveGame(){try{const s=snap();if(!s.friend)return alert('Selecciona primero el ejército amigo.');if(!s.map||!s.operation)return alert('Selecciona mapa y operación antes de guardar.');const a=JSON.parse(localStorage.getItem(KEY)||'[]');a.unshift(s);localStorage.setItem(KEY,JSON.stringify(a));alert('✅ Matriz guardada correctamente.')}catch(e){alert('No se pudo guardar: '+e.message)}}function backToGame(){document.getElementById('saved').style.display='none';document.getElementById('game').style.display='block'}function showSaved(){const a=JSON.parse(localStorage.getItem(KEY)||'[]');document.getElementById('savedList').innerHTML=a.length?a.map((s,i)=>'<article class="card"><h3>⚔️ '+esc(s.friend)+(s.enemy?' vs '+esc(s.enemy):'')+'</h3><div class="mut">🗺️ '+esc(s.map)+' · 🎯 '+esc(s.operation)+' · 🕒 '+esc(s.date)+'</div><p>🟢 Operativos: '+esc(ops(s.counts?.friend))+'</p><p>🔴 Operativos: '+esc(ops(s.counts?.enemy))+'</p><button onclick="openMatrix('+i+')">📖 Abrir cuaderno</button> <button class="danger" onclick="deleteMatrix('+i+')">🗑️ Borrar</button><details><summary>Resumen por turnos</summary>'+turns(s)+'</details></article>').join(''):'<div class="card">No hay matrices guardadas.</div>';document.getElementById('game').style.display='none';document.getElementById('saved').style.display='block'}function ops(c){return Object.entries(c||{}).filter(([k,v])=>v>0).map(([k,v])=>k+(v>1?' ×'+v:'')).join(', ')||'Ninguno'}function turns(s){return[1,2,3,4].map(t=>{const f=s.turns?.friend?.[t]||{},e=s.turns?.enemy?.[t]||{};return'<div class="turn"><b>T'+t+'</b><br>🟢 Estrategia: '+esc(arr(f.strategy).join(', ')||'—')+'<br>🟢 Tiroteo: '+esc(arr(f.firefight).join(', ')||'—')+'<br>🟢 Facción: '+esc(arr(f.faction).join(', ')||'—')+'<br>🟢 Universal: '+esc(arr(f.universal).join(', ')||'—')+'<br>🔴 Estrategia: '+esc(arr(e.strategy).join(', ')||'—')+'<br>🔴 Tiroteo: '+esc(arr(e.firefight).join(', ')||'—')+'<br>🔴 Facción: '+esc(arr(e.faction).join(', ')||'—')+'<br>🔴 Universal: '+esc(arr(e.universal).join(', ')||'—')+'</div>'}).join('')}function deleteMatrix(i){const a=JSON.parse(localStorage.getItem(KEY)||'[]');a.splice(i,1);localStorage.setItem(KEY,JSON.stringify(a));showSaved()}function openMatrix(i){const s=JSON.parse(localStorage.getItem(KEY)||'[]')[i];backToGame();frame.addEventListener('load',()=>restore(s),{once:true});frame.src='./ktcompanion-v17-ejercitos2.html?restore='+Date.now()}function restore(s){const x=w();const f=x.document.getElementById('friend'),e=x.document.getElementById('enemy');if(!f)return;f.value=s.friend;e.value=s.enemy||'';x.selectedMap=s.map;x.selectedOperation=s.operation;x.counts=s.counts||{friend:{},enemy:{}};x.turns=s.turns||{friend:{},enemy:{}};x.chapterSelections=s.chapterSelections||{friend:[],enemy:[]};if(typeof x.next==='function'){x.next(2);setTimeout(()=>x.next(3),150);setTimeout(()=>x.next(4),300)}}</script></body></html>
