<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151b"><title>KT Companion 2.0</title><style>body{margin:0;background:#0b0f14;color:#edf2f6;font:15px system-ui,sans-serif}#tools{position:sticky;top:0;z-index:999;background:#10151b;border-bottom:1px solid #303a45;padding:8px;display:flex;gap:8px;flex-wrap:wrap}#tools button{font:inherit;color:#edf2f6;background:#151a20;border:1px solid #303a45;border-radius:10px;padding:10px 13px}.primary{background:#263b55!important;border-color:#6d9dcc!important}#saved{display:none;padding:14px;max-width:1050px;margin:auto}.card{background:#151a20;border:1px solid #303a45;border-radius:14px;padding:14px;margin:10px 0}.mut{color:#9aa7b4}.turn{border:1px solid #303a45;border-radius:12px;padding:12px;margin:8px 0}.danger{background:#3b2020!important;border-color:#633838!important}</style></head><body><div id="tools"><button class="primary" onclick="backToGame()">⚔️ Matriz</button><button onclick="saveGame()">💾 Guardar matriz</button><button onclick="showSaved()">📚 Matrices guardadas</button></div><div id="game"></div><main id="saved"><div class="card"><h2>📚 Matrices guardadas</h2><div class="mut">Pulsa «Abrir» para recuperar una matriz.</div></div><div id="savedList"></div></main><script>let gameDoc=null,weaponSelections={friend:{},enemy:{}};const KEY='kt_companion_matrices_v2';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){try{const r=await fetch('./ktcompanion-v17-ejercitos2.html?v=20260818');let html=await r.text();const inject=`<script>(function(){document.addEventListener('click',function(e){const b=e.target.closest('.weapon button');if(!b)return;const op=b.closest('.copy');const name=op?.querySelector('b')?.textContent||'';const side=window.currentSide||'friend';window.parent.postMessage({kt:'weapon',side:side,name:name,weapon:b.previousElementSibling?.querySelector('.wname')?.textContent||'',on:b.classList.contains('on')},'*')});})();<\\/script>`;html=html.replace('</body>',inject+'</body>');document.open();document.write(html);document.close();gameDoc=document;setTimeout(()=>{gameDoc=document;window.addEventListener('message',onMsg);},500)}catch(e){document.getElementById('game').innerHTML='<div class="card">No se pudo cargar KT Companion: '+esc(e.message)+'</div>'}}function onMsg(e){const d=e.data;if(!d||d.kt!=='weapon')return;const k=d.name+'|'+d.weapon;weaponSelections[d.side][k]=d.on}function game(){return document}function arr(x){return Array.isArray(x)?x:[]}function snap(){const w=window;try{if(typeof w.snapshotTurns==='function')w.snapshotTurns();if(typeof w.snapshotChapter==='function')w.snapshotChapter()}catch(e){}const friend=document.getElementById('friend')?.value||'',enemy=document.getElementById('enemy')?.value||'';return{id:Date.now(),date:new Date().toLocaleString('es-ES'),friend,enemy,map:w.selectedMap||'',operation:w.selectedOperation||'',counts:JSON.parse(JSON.stringify(w.counts||{friend:{},enemy:{}})),turns:JSON.parse(JSON.stringify(w.turns||{friend:{},enemy:{}})),chapterSelections:JSON.parse(JSON.stringify(w.chapterSelections||{friend:[],enemy:[]})),weapons:JSON.parse(JSON.stringify(weaponSelections))}}function saveGame(){try{const s=snap();if(!s.friend)return alert('Selecciona primero el ejército amigo.');if(!s.map||!s.operation)return alert('Selecciona mapa y operación antes de guardar.');const a=JSON.parse(localStorage.getItem(KEY)||'[]');a.unshift(s);localStorage.setItem(KEY,JSON.stringify(a));alert('✅ Matriz guardada correctamente.')}catch(e){alert('No se pudo guardar: '+e.message)}}function backToGame(){document.getElementById('saved').style.display='none';document.getElementById('game').style.display='block'}function showSaved(){const a=JSON.parse(localStorage.getItem(KEY)||'[]'),box=document.getElementById('savedList');box.innerHTML=a.length?a.map((s,i)=>`<article class="card"><h3>⚔️ ${esc(s.friend)}${s.enemy?' vs '+esc(s.enemy):''}</h3><div class="mut">🗺️ ${esc(s.map)} · 🎯 ${esc(s.operation)} · 🕒 ${esc(s.date)}</div><p>🟢 Operativos: ${esc(opsSummary(s.counts?.friend))}</p><p>🔴 Operativos: ${esc(opsSummary(s.counts?.enemy))}</p><button onclick="openMatrix(${i})">📖 Abrir cuaderno</button> <button class="danger" onclick="deleteMatrix(${i})">🗑️ Borrar</button><details><summary>Ver resumen por turnos</summary>${turnSummary(s)}</details></article>`).join(''):'<div class="card">No hay matrices guardadas.</div>';document.getElementById('game').style.display='none';document.getElementById('saved').style.display='block'}function opsSummary(c){return Object.entries(c||{}).filter(x=>x[1]>0).map(x=>x[0]+(x[1]>1?' ×'+x[1]:'' )).join(', ')||'Ninguno'}function turnSummary(s){return[1,2,3,4].map(t=>{const f=s.turns?.friend?.[t]||{},e=s.turns?.enemy?.[t]||{};return`<div class="turn"><b>T${t}</b><br>🟢 Estrategia: ${esc(arr(f.strategy).join(', ')||'—')}<br>🟢 Tiroteo: ${esc(arr(f.firefight).join(', ')||'—')}<br>🟢 Facción: ${esc(arr(f.faction).join(', ')||'—')}<br>🟢 Universal: ${esc(arr(f.universal).join(', ')||'—')}<br>🔴 Estrategia: ${esc(arr(e.strategy).join(', ')||'—')}<br>🔴 Tiroteo: ${esc(arr(e.firefight).join(', ')||'—')}<br>🔴 Facción: ${esc(arr(e.faction).join(', ')||'—')}<br>🔴 Universal: ${esc(arr(e.universal).join(', ')||'—')}</div>`}).join('')}function deleteMatrix(i){const a=JSON.parse(localStorage.getItem(KEY)||'[]');a.splice(i,1);localStorage.setItem(KEY,JSON.stringify(a));showSaved()}function openMatrix(i){const s=JSON.parse(localStorage.getItem(KEY)||'[]')[i];backToGame();const f=document.getElementById('friend'),en=document.getElementById('enemy');if(!f)return;f.value=s.friend;en.value=s.enemy||'';window.selectedMap=s.map;window.selectedOperation=s.operation;window.counts=s.counts||{friend:{},enemy:{}};window.turns=s.turns||{friend:{},enemy:{}};window.chapterSelections=s.chapterSelections||{friend:[],enemy:[]};weaponSelections=s.weapons||{friend:{},enemy:{}};setTimeout(()=>{if(typeof window.next==='function')window.next(2);setTimeout(()=>{if(typeof window.next==='function')window.next(3);setTimeout(()=>{if(typeof window.next==='function')window.next(4)},150)},150)},150)}boot();</script></body></html>
