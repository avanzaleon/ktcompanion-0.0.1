<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion v17</title><style>body{margin:0;background:#080c11;color:#eef2f6;font:15px system-ui}#bar{position:sticky;top:0;background:#10151b;padding:10px;z-index:2}button{background:#151a20;color:#fff;border:1px solid #405060;border-radius:9px;padding:10px;margin-right:6px}.p{background:#263b55}.hidden{display:none}iframe{width:100%;height:calc(100vh - 64px);border:0}.card{background:#151a20;border:1px solid #303a45;border-radius:14px;padding:14px;margin:10px 0}.mut{color:#9aa7b4}.danger{background:#3b2020}.turn{border:1px solid #303a45;border-radius:12px;padding:12px;margin:8px 0}</style></head><body><div id="bar"><button class="p" onclick="app.classList.remove('hidden');saved.classList.add('hidden')">⚔️ Matriz</button><button onclick="save()">💾 Guardar matriz</button><button onclick="show()">📚 Matrices guardadas</button></div><iframe id="app" src="ktcompanion-v17-ejercitos2.html"></iframe><main id="saved" class="hidden"><div class="card"><h2>📚 Matrices guardadas</h2><div id="list"></div></div></main><script>const app=document.getElementById('app'),saved=document.getElementById('saved'),list=document.getElementById('list'),w=()=>app.contentWindow;function collect(side){const army=side==='friend'?w().document.getElementById('friend').value:w().document.getElementById('enemy').value;if(!army)return[];const data=w().ARMIES_DATA[army]||{ops:w().AOD_OPS};const selected=w().counts[side]||{};return Object.entries(selected).filter(([n,c])=>c>0).map(([name,count])=>({name,count,weapons:(data.ops?.[name]?.r||[]).map(x=>x[0]).concat((data.ops?.[name]?.m||[]).map(x=>x[0]))}))}function save(){try{w().snapshotTurns();w().snapshotChapter();const m={id:Date.now(),date:new Date().toLocaleString('es-ES'),friend:w().document.getElementById('friend').value,enemy:w().document.getElementById('enemy').value,map:w().selectedMap,operation:w().selectedOperation,friendOperatives:collect('friend'),enemyOperatives:collect('enemy'),chapter:JSON.parse(JSON.stringify(w().chapterSelections)),turns:JSON.parse(JSON.stringify(w().turns))};if(!m.friend)return alert('Selecciona el ejército amigo.');if(!m.map||!m.operation)return alert('Selecciona mapa y operación.');let a=JSON.parse(localStorage.getItem('ktc2')||'[]');a.unshift(m);localStorage.setItem('ktc2',JSON.stringify(a));show()}catch(x){alert('No se pudo guardar: '+x.message)}}function show(){app.classList.add('hidden');saved.classList.remove('hidden');let a=JSON.parse(localStorage.getItem('ktc2')||'[]');list.innerHTML=a.length?a.map(m=>'<article class="card"><button class="danger" onclick="del('+m.id+')">🗑️ Borrar</button><h3>'+m.friend+(m.enemy?' vs '+m.enemy:' — sin rival')+'</h3><div class="mut">🗺️ '+m.map+' · 🎯 '+m.operation+' · '+m.date+'</div><p>🟢 '+(m.friendOperatives||[]).map(o=>o.name+(o.count>1?' ×'+o.count:'')).join(', ')+'</p><p>🔴 '+(m.enemyOperatives||[]).map(o=>o.name+(o.count>1?' ×'+o.count:'')).join(', ')+'</p><details open><summary>📓 Cuaderno de bitácora</summary>'+[1,2,3,4].map(t=>{let f=m.turns?.friend?.[t]||{},e=m.turns?.enemy?.[t]||{};return'<div class="turn"><b>T'+t+'</b><br>🟢 Estrategia: '+(f.strategy||[]).join(', ')+'<br>🟢 Tiroteo: '+(f.firefight||[]).join(', ')+'<br>🟢 Facción: '+(f.faction||[]).join(', ')+'<br>🟢 Universal: '+(f.universal||[]).join(', ')+'<br>🔴 Estrategia: '+(e.strategy||[]).join(', ')+'<br>🔴 Tiroteo: '+(e.firefight||[]).join(', ')+'<br>🔴 Facción: '+(e.faction||[]).join(', ')+'<br>🔴 Universal: '+(e.universal||[]).join(', ')+'</div>'}).join('')+'</details></article>').join(''):'No hay matrices guardadas.'}function del(id){if(!confirm('¿Borrar esta matriz?'))return;localStorage.setItem('ktc2',JSON.stringify(JSON.parse(localStorage.getItem('ktc2')||'[]').filter(x=>x.id!==id)));show()}</script></main>
