<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151b"><title>KT Companion 2.0 — Matrices</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0f14;color:#edf2f6;font:15px system-ui,sans-serif}body{display:flex;flex-direction:column}.bar{height:auto;min-height:62px;background:#10151b;border-bottom:1px solid #303a45;display:flex;align-items:center;gap:8px;padding:8px;position:sticky;top:0;z-index:20}.bar button{font:inherit;color:#edf2f6;background:#151a20;border:1px solid #303a45;border-radius:10px;padding:10px 13px}.bar .primary{background:#263b55;border-color:#6d9dcc}.title{font-weight:800;margin-right:auto}.wrap{flex:1;min-height:0}.wrap iframe{width:100%;height:100%;border:0;display:block}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;padding:18px}.modal.show{display:block}.panel{max-width:800px;margin:5vh auto;background:#151a20;border:1px solid #303a45;border-radius:15px;padding:16px;max-height:85vh;overflow:auto}.item{border:1px solid #303a45;background:#1d242c;border-radius:11px;padding:12px;margin:8px 0}.item button{margin-top:8px;margin-right:6px}.mut{color:#9aa7b4}.close{float:right}.empty{padding:30px;text-align:center;color:#9aa7b4}</style></head><body><div class="bar"><div class="title">⚔️ KT Companion 2.0</div><button class="primary" onclick="saveMatrix()">💾 Guardar matriz</button><button onclick="showSaved()">📚 Matrices guardadas</button></div><div class="wrap"><iframe id="app" src="./ktcompanion-v17-ejercitos2.html?v=20260818"></iframe></div><div id="modal" class="modal"><div class="panel"><button class="close" onclick="closeSaved()">✕ Cerrar</button><h2>📚 Matrices guardadas</h2><div id="saved"></div></div></div><script>const KEY='kt_companion_matrices_v1';const f=()=>document.getElementById('app').contentWindow;function state(){const w=f();return{date:new Date().toLocaleString('es-ES'),friend:w.document.getElementById('friend')?.value||'',enemy:w.document.getElementById('enemy')?.value||'',map:w.selectedMap||'',operation:w.selectedOperation||'',counts:JSON.parse(JSON.stringify(w.counts||{friend:{},enemy:{}})),turns:JSON.parse(JSON.stringify(w.turns||{friend:{},enemy:{}})),chapterSelections:JSON.parse(JSON.stringify(w.chapterSelections||{friend:[],enemy:[]}))}}function getSaved(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function saveMatrix(){try{const s=state();if(!s.friend){alert('Selecciona primero el ejército amigo.');return}if(!s.map||!s.operation){alert('Selecciona mapa y operación antes de guardar.');return}const list=getSaved();list.unshift(s);localStorage.setItem(KEY,JSON.stringify(list));alert('✅ Matriz guardada correctamente.');}catch(e){alert('No se pudo guardar: '+e.message)}}function showSaved(){const list=getSaved(),box=document.getElementById('saved');if(!list.length){box.innerHTML='<div class="empty">No hay matrices guardadas todavía.</div>'}else{box.innerHTML=list.map((s,i)=>`<div class="item"><b>${s.friend}</b>${s.enemy?' vs '+s.enemy:''}<div class="mut">🗺️ ${s.map} · 🎯 ${s.operation}<br>🕒 ${s.date}</div><button onclick="loadMatrix(${i})">Abrir</button><button onclick="deleteMatrix(${i})">🗑️ Borrar</button></div>`).join('')}document.getElementById('modal').classList.add('show')}function closeSaved(){document.getElementById('modal').classList.remove('show')}function loadMatrix(i){const s=getSaved()[i];const w=f();const fr=w.document.getElementById('friend'),en=w.document.getElementById('enemy');fr.value=s.friend;en.value=s.enemy||'';w.selectedMap=s.map;w.selectedOperation=s.operation;w.counts=s.counts||{friend:{},enemy:{}};w.turns=s.turns||{friend:{},enemy:{}};w.chapterSelections=s.chapterSelections||{friend:[],enemy:[]};w.currentSide='friend';w.currentTurnSide='friend';w.currentTurn=1;w.next(2);setTimeout(()=>{w.next(3)},100);setTimeout(()=>{w.next(4)},200);closeSaved()}function deleteMatrix(i){const list=getSaved();list.splice(i,1);localStorage.setItem(KEY,JSON.stringify(list));showSaved()}</script></body></html>
