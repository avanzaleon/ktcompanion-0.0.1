<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101216"><title>KT Companion 2.0 — Angels of Death v16 + Equipo + Armas</title><style>:root{--p:#151a20;--p2:#1d242c;--t:#edf2f6;--mut:#9aa7b4;--line:#303a45}*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:var(--t);font:15px system-ui,sans-serif}header{padding:18px;background:#10151b;border-bottom:1px solid var(--line)}main{max-width:1050px;margin:auto;padding:16px}button,select,input{font:inherit}button{border:1px solid var(--line);background:var(--p);color:var(--t);padding:10px 13px;border-radius:9px;cursor:pointer}button.primary,.active{background:#263b55;border-color:#6d9dcc}.page{display:none}.page.active{display:block}.step{display:none}.step.active{display:block}.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:13px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.label,.summary,.role{color:var(--mut);font-size:12px}.teams select{width:100%;padding:11px;background:var(--p2);border:1px solid var(--line);border-radius:9px;color:var(--t)}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px}.mapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mapchoice,.opchoice{border:1px solid var(--line);background:var(--p2);border-radius:10px;padding:12px;cursor:pointer}.mapchoice.selected,.opchoice.selected{border-color:#6d9dcc;background:#263b55}.oplist{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sidetabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.turntabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.side.active,.turntab.active{background:#263b55;border-color:#6d9dcc}.op{border:1px solid var(--line);border-radius:10px;background:var(--p2);margin:8px 0;overflow:hidden}.op.has{border-color:#6d9dcc}.ophead{display:flex;align-items:center;gap:10px;padding:11px}.opname{font-weight:800;flex:1}.qty{display:flex;align-items:center;gap:7px}.qty button{width:32px;height:32px;padding:0;font-size:19px}.qty b{min-width:18px;text-align:center}.weapons{border-top:1px solid var(--line);padding:6px 12px}.copy{padding:8px 0;border-bottom:1px solid var(--line)}.weapon{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #29323c}.wname{font-size:13px}.profile{font:12px monospace;color:var(--mut)}.weapon button.on{background:#263b55;border-color:#6d9dcc}.choice{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #29323c}.choice input{accent-color:#79a9e8}.count{font-size:11px;padding:2px 7px;border-radius:99px;background:#263b55}@media(max-width:700px){.teams{grid-template-columns:1fr}.mapgrid,.oplist{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>⚔️ KT Companion 2.0</h1><div class="summary">Matriz · Angels of Death · v16 + Equipo + Armas</div></header><main><div style="display:flex;gap:8px;margin-bottom:14px"><button class="primary" onclick="page('new')">➕ Crear nueva matriz</button></div><section id="new" class="page active"><div id="s1" class="step active"><div class="card"><h2>1. Ejércitos</h2><div class="teams"><div><div class="label">🟢 AMIGO</div><select id="friend"><option value="">Seleccionar ejército…</option><option value="Angels of Death">Angels of Death</option></select></div><div><div class="label">🔴 RIVAL</div><select id="enemy"><option value="">Ningún ejército</option><option value="Angels of Death">Angels of Death</option></select></div></div><div class="actions"><span></span><button class="primary" onclick="next(2)">Continuar →</button></div></div></div><div id="s2" class="step"><div class="card"><h2>2. Mapa</h2><div id="maps" class="mapgrid"></div></div><div class="card"><h2>3. Operación</h2><div id="operations" class="oplist"></div><div class="actions"><button onclick="next(1)">← Atrás</button><button class="primary" onclick="next(3)">Continuar →</button></div></div></div><div id="s3" class="step"><div class="card"><h2>4. Operativos</h2><div id="sideTabs" class="sidetabs"><button class="side active" onclick="switchSide('friend')">🟢 AMIGO</button><button class="side" id="rivalTab" onclick="switchSide('enemy')">🔴 RIVAL</button></div><div id="sideStatus" class="summary"></div><div class="summary">Composition: 1 Líder + 5 operativos. Warriors pueden repetirse; los demás, una vez.</div><div id="counter" class="summary" style="margin:10px 0"></div><div id="ops"></div><div class="actions"><button onclick="next(2)">← Atrás</button><button class="primary" onclick="next(4)">Continuar →</button></div></div></div><div id="s4" class="step"><div class="card"><div id="turnSideTabs" class="sidetabs"><button class="side active" onclick="switchTurnSide('friend')">🟢 AMIGO</button><button class="side" id="turnRivalTab" onclick="switchTurnSide('enemy')">🔴 RIVAL</button></div><div id="turnSideStatus" class="summary"></div><div class="turntabs"><button class="turntab active" onclick="switchTurn(1)">T1</button><button class="turntab" onclick="switchTurn(2)">T2</button><button class="turntab" onclick="switchTurn(3)">T3</button><button class="turntab" onclick="switchTurn(4)">T4</button></div><div class="card"><h3>6. Estrategia</h3><div id="strategy"></div></div><div class="card"><h3>7. Tiroteo</h3><div id="firefight"></div></div><div class="card"><h3>8. Equipo de facción</h3><div id="faction"></div></div><div class="card"><h3>9. Equipo universal</h3><div id="universal"></div></div></div></div></section></main><script>
const $=id=>document.getElementById(id);
const OPS={"Space Marine Captain":{role:"Líder",max:1,r:[["Plasma Pistol — Standard","4 · 3+ · 3/5"],["Plasma Pistol — Supercharge","4 · 3+ · 4/5"]],m:[["Power Fist","5 · 3+ · 5/7"]]},"Assault Intercessor Sergeant":{role:"Líder",max:1,r:[["Heavy Bolt Pistol","4 · 3+ · 3/4"],["Plasma Pistol — Standard","4 · 3+ · 3/5"],["Plasma Pistol — Supercharge","4 · 3+ · 4/5"]],m:[["Chainsword","5 · 3+ · 4/5"],["Power Fist","5 · 4+ · 5/7"],["Power Weapon","5 · 3+ · 4/6"],["Thunder Hammer","5 · 4+ · 5/6"]]},"Intercessor Sergeant":{role:"Líder",max:1,r:[["Auto Bolt Rifle","4 · 3+ · 3/4"],["Bolt Rifle","4 · 3+ · 3/4"],["Stalker Bolt Rifle","4 · 3+ · 3/5"]],m:[["Chainsword","4 · 3+ · 4/5"],["Fists","4 · 3+ · 3/4"],["Power Fist","4 · 4+ · 5/7"],["Power Weapon","4 · 3+ · 4/6"],["Thunder Hammer","4 · 4+ · 5/6"]]},"Assault Intercessor Grenadier":{role:"Operativo",max:1,r:[["Heavy Bolt Pistol","4 · 3+ · 3/4"],["Frag Grenade","4 · 3+ · 2/4"],["Krak Grenade","4 · 3+ · 4/5"]],m:[["Chainsword","5 · 3+ · 4/5"]]},"Assault Intercessor Warrior":{role:"Operativo",max:5,r:[["Heavy Bolt Pistol","4 · 3+ · 3/4"]],m:[["Chainsword","5 · 3+ · 4/5"]]},"Eliminator Sniper":{role:"Operativo",max:1,r:[["Bolt Pistol","4 · 3+ · 3/4"],["Bolt Sniper Rifle — Executioner","4 · 2+ · 3/4"],["Bolt Sniper Rifle — Hyperfrag","4 · 2+ · 2/4"],["Bolt Sniper Rifle — Mortis","4 · 2+ · 3/3"]],m:[["Fists","4 · 3+ · 3/4"]]},"Heavy Intercessor Gunner":{role:"Operativo",max:1,r:[["Bolt Pistol","4 · 3+ · 3/4"],["Heavy Bolter — Focused","5 · 3+ · 4/5"],["Heavy Bolter — Sweeping","4 · 3+ · 4/5"]],m:[["Fists","4 · 3+ · 3/4"]]},"Intercessor Gunner":{role:"Operativo",max:1,r:[["Auto Bolt Rifle","4 · 3+ · 3/4"],["Auxiliary Grenade Launcher — Frag","4 · 3+ · 2/4"],["Auxiliary Grenade Launcher — Krak","4 · 3+ · 4/5"],["Bolt Rifle","4 · 3+ · 3/4"]],m:[["Fists","4 · 3+ · 3/4"]]},"Intercessor Warrior":{role:"Operativo",max:5,r:[["Auto Bolt Rifle","4 · 3+ · 3/4"],["Bolt Rifle","4 · 3+ · 3/4"],["Stalker Bolt Rifle","4 · 3+ · 3/5"]],m:[["Fists","4 · 3+ · 3/4"]]}};
const EXTRA={strategy:["Adaptive Tactics","And They Shall Know No Fear","Combat Doctrine","Indomitus"],firefight:["Adjust Doctrine","Shock Assault","Transhuman Physiology","Wrath of Vengeance"],faction:[["Chapter Reliquaries","1"],["Purity Seals","1"],["Tilting Shields","1"],["Auspex","1"]],universal:[["Ammo Cache","1"],["Razor Wire","1"],["Comms Device","1"],["Mines","1"],["Smoke Grenade","1"],["Stun Grenade","1"],["Frag Grenade","1"],["Krak Grenade","1"],["Breaching Charge","1"]]};
const operations=["Asegurar","Saquear","Transmisión","El Orbe","Reclamar propiedad","Células de energía","Descargar datos","Datos","Reiniciar"];let counts={friend:{},enemy:{}},currentSide='friend',selectedMap='',selectedOperation='',currentTurn=1,currentTurnSide='friend';const turns={friend:{},enemy:{}};["friend","enemy"].forEach(s=>[1,2,3,4].forEach(t=>turns[s][t]={strategy:[],firefight:[],faction:[],universal:[]}));
function page(x){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));$(x).classList.add('active')}
function next(n){if(n===2&&!$('friend').value)return alert('Selecciona el ejército amigo.');if(n===3&&(!selectedMap||!selectedOperation))return alert('Selecciona mapa y operación.');document.querySelectorAll('.step').forEach(e=>e.classList.remove('active'));$('s'+n).classList.add('active');if(n===2){renderMaps();renderOperations()}if(n===3){updateSideTabs();currentSide='friend';renderOps()}if(n===4){currentTurn=1;currentTurnSide='friend';renderTurnChoices();updateTurnButtons();updateTurnSideTabs()}scrollTo(0,0)}
function renderMaps(){$('maps').innerHTML=[1,2,3,4,5,6].map(i=>`<div class="mapchoice ${selectedMap==='Mundo Necrópolis '+i?'selected':''}" onclick="selectedMap='Mundo Necrópolis ${i}';renderMaps()"><b>Mundo Necrópolis ${i}</b></div>`).join('')}
function renderOperations(){$('operations').innerHTML=operations.map((x,i)=>`<div class="opchoice ${selectedOperation===x?'selected':''}" onclick="selectedOperation='${x}';renderOperations()">${i+1}. ${x}</div>`).join('')}
function switchSide(side){if(side==='enemy'&&!$('enemy').value)return;currentSide=side;document.querySelectorAll('#sideTabs .side').forEach((b,i)=>b.classList.toggle('active',(i===0&&side==='friend')||(i===1&&side==='enemy')));renderOps()}
function activeCounts(){return counts[currentSide]}
function totalLeaders(){return Object.entries(activeCounts()).filter(([n])=>OPS[n].role==='Líder').reduce((a,[n,c])=>a+c,0)}function totalOthers(){return Object.entries(activeCounts()).filter(([n])=>OPS[n].role!=='Líder').reduce((a,[n,c])=>a+c,0)}
function weapon(w){return `<div class="weapon"><div><div class="wname">${w[0]}</div><div class="profile">${w[1]}</div></div><button onclick="this.classList.toggle('on')">Seleccionar</button></div>`}
function copies(n,o,c){let x='<div class="weapons">';for(let k=1;k<=c;k++)x+=`<div class="copy"><b>${n}${c>1?' #'+k:''}</b><div class="section"><h3>🎯 Armas a distancia</h3>${o.r.map(weapon).join('')}</div><div class="section"><h3>⚔️ Armas CaC</h3>${o.m.map(weapon).join('')}</div></div>`;return x+'</div>'}
function renderOps(){const side=currentSide,army=$(side).value||'';$('sideStatus').textContent=(side==='friend'?'Amigo: ':'Rival: ')+(army||'Ningún ejército');let out='';Object.entries(OPS).forEach(([n,o])=>{const c=counts[side][n]||0;out+=`<div class="op ${c?'has':''}"><div class="ophead"><div class="opname">${n}<div class="role">${o.role} · máx. ${o.max}</div></div><div class="qty"><button onclick="changeQty('${n}',-1)">−</button><b>${c}</b><button onclick="changeQty('${n}',1)">+</button></div></div>${c?copies(n,o,c):''}</div>`});$('ops').innerHTML=out;$('counter').textContent=`Líder: ${totalLeaders()}/1 · Operativos: ${totalOthers()}/5`}
function changeQty(n,d){const c=counts[currentSide][n]||0,o=OPS[n];if(d>0){if(c>=o.max)return;if(o.role==='Líder'&&totalLeaders()>=1)return;if(o.role!=='Líder'&&totalOthers()>=5)return}counts[currentSide][n]=Math.max(0,c+d);renderOps()}
function choices(id,arr){$(id).innerHTML=arr.map(x=>{const n=Array.isArray(x)?x[0]:x,v=Array.isArray(x)?x[1]:'';return `<label class="choice"><span>${n}${v?` <small class="count">${v}</small>`:''}</span><input type="checkbox"></label>`}).join('')}
function renderTurnChoices(){choices('strategy',EXTRA.strategy);choices('firefight',EXTRA.firefight);choices('faction',EXTRA.faction);choices('universal',EXTRA.universal)}
function switchTurn(t){currentTurn=t;renderTurnChoices();updateTurnButtons()}function switchTurnSide(side){if(side==='enemy'&&!$('enemy').value)return;currentTurnSide=side;document.querySelectorAll('#turnSideTabs .side').forEach((b,i)=>b.classList.toggle('active',(i===0&&side==='friend')||(i===1&&side==='enemy')));updateTurnSideTabs();renderTurnChoices()}
function updateTurnSideTabs(){$('rivalTab').disabled=!$('enemy').value;$('turnRivalTab').disabled=!$('enemy').value;$('turnSideStatus').textContent=(currentTurnSide==='friend'?'Amigo: ':'Rival: ')+($(currentTurnSide).value||'Ningún ejército')}
function updateTurnButtons(){document.querySelectorAll('.turntab').forEach((b,i)=>b.classList.toggle('active',i+1===currentTurn))}
$('enemy').addEventListener('change',updateTurnSideTabs);$('friend').addEventListener('change',updateTurnSideTabs);renderMaps();renderOperations();updateTurnSideTabs();
</script></body></html>
