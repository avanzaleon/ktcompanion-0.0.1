<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101216"><title>KT Companion — Angels of Death</title><style>:root{--bg:#0b0f14;--card:#151a20;--card2:#1d242c;--text:#edf2f6;--mut:#9aa7b4;--line:#303a45;--sel:#263b55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}header{padding:18px;background:#10151b;border-bottom:1px solid var(--line)}main{max-width:900px;margin:auto;padding:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:13px}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.maps,.ops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn,.choice,.op{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:9px;padding:11px;cursor:pointer}.btn.active,.choice.active,.op.active{background:var(--sel);border-color:#6d9dcc}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.primary{background:var(--sel);border-color:#6d9dcc}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.turns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.label,.small{font-size:12px;color:var(--mut)}select{width:100%;padding:11px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:9px}.op{margin:8px 0;padding:0;overflow:hidden}.ophead{display:flex;align-items:center;gap:8px;padding:11px}.name{flex:1;font-weight:800}.qty{display:flex;align-items:center;gap:7px}.qty button{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:19px}.weapons{border-top:1px solid var(--line);padding:10px 12px}.weapon{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #29323c}.weapon button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:7px;padding:6px}.weapon button.active{background:var(--sel);border-color:#6d9dcc}.list label{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #29323c}@media(max-width:650px){.grid,.maps,.ops{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.turns{grid-template-columns:repeat(4,1fr)}}@media(max-width:420px){.maps,.ops{grid-template-columns:1fr}}</style></head><body><header><h1>⚔️ KT Companion</h1><div class="small">Matriz · Angels of Death · versión estable de prueba</div></header><main><section id="s1"><div class="card"><h2>1. Ejércitos</h2><div class="grid"><div><div class="label">🟢 AMIGO</div><select id="friend"><option value="">Seleccionar ejército…</option><option>Angels of Death</option></select></div><div><div class="label">🔴 RIVAL</div><select id="enemy"><option value="">Ningún ejército</option><option>Angels of Death</option></select></div></div><div class="actions"><span></span><button class="btn primary" onclick="go(2)">Continuar →</button></div></div></section><section id="s2" class="hidden"><div class="card"><h2>2. Zona de aniquilación</h2><div class="label">Mundo Necrópolis</div><div id="maps" class="maps"></div></div><div class="card"><h2>3. Operación</h2><div id="operations" class="ops"></div><div class="actions"><button class="btn" onclick="go(1)">← Atrás</button><button class="btn primary" onclick="go(3)">Continuar →</button></div></div></section><section id="s3" class="hidden"><div class="card"><h2>4. Operativos</h2><div class="tabs"><button id="friendTab" class="btn active" onclick="side('friend')">🟢 AMIGO</button><button id="enemyTab" class="btn" onclick="side('enemy')">🔴 RIVAL</button></div><p id="sideInfo" class="small"></p><p id="counter" class="small"></p><div id="operatives"></div><div class="actions"><button class="btn" onclick="go(2)">← Atrás</button><button class="btn primary" onclick="go(4)">Continuar →</button></div></div></section><section id="s4" class="hidden"><div class="card"><div class="tabs"><button id="turnFriend" class="btn active" onclick="turnSide('friend')">🟢 AMIGO</button><button id="turnEnemy" class="btn" onclick="turnSide('enemy')">🔴 RIVAL</button></div><p id="turnInfo" class="small"></p><div class="turns"><button class="btn active" onclick="turn(1)">T1</button><button class="btn" onclick="turn(2)">T2</button><button class="btn" onclick="turn(3)">T3</button><button class="btn" onclick="turn(4)">T4</button></div></div><div class="card"><h3>5. Tácticas de capítulo</h3><div id="chapter" class="list"></div></div><div class="card"><h3>6. Ardides de estrategia</h3><div id="strategy" class="list"></div></div><div class="card"><h3>7. Ardides de tiroteo</h3><div id="firefight" class="list"></div></div><div class="card"><h3>8. Equipo de facción</h3><div id="faction" class="list"></div></div><div class="card"><h3>9. Equipo universal</h3><div id="universal" class="list"></div></div></section></main><script>const OPS={"Space Marine Captain":{role:"Líder",max:1,r:[["Plasma Pistol — Standard","4 · 3+ · 3/5"],["Plasma Pistol — Supercharge","4 · 3+ · 4/5"]],m:[["Power Fist","5 · 3+ · 5/7"]]},"Assault Intercessor Sergeant":{role:"Líder",max:1,r:[["Heavy Bolt Pistol","4 · 3+ · 3/4"],["Plasma Pistol — Standard","4 · 3+ · 3/5"],["Plasma Pistol — Supercharge","4 · 3+ · 4/5"]],m:[["Chainsword","5 · 3+ · 4/5"],["Power Fist","5 · 4+ · 5/7"],["Power Weapon","5 · 3+ · 4/6"],["Thunder Hammer","5 · 4+ · 5/6"]]},"Intercessor Sergeant":{role:"Líder",max:1,r:[["Auto Bolt Rifle","4 · 3+ · 3/4"],["Bolt Rifle","4 · 3+ · 3/4"],["Stalker Bolt Rifle","4 · 3+ · 3/5"]],m:[["Chainsword","4 · 3+ · 4/5"],["Fists","4 · 3+ · 3/4"],["Power Fist","4 · 4+ · 5/7"],["Power Weapon","4 · 3+ · 4/6"],["Thunder Hammer","4 · 4+ · 5/6"]]},"Assault Intercessor Grenadier":{role:"Operativo",max:1,r:[["Heavy Bolt Pistol","4 · 3+ · 3/4"],["Frag Grenade","4 · 3+ · 2/4"],["Krak Grenade","4 · 3+ · 4/5"]],m:[["Chainsword","5 · 3+ · 4/5"]]},"Assault Intercessor Warrior":{role:"Operativo",max:5,r:[["Heavy Bolt Pistol","4 · 3+ · 3/4"]],m:[["Chainsword","5 · 3+ · 4/5"]]},"Eliminator Sniper":{role:"Operativo",max:1,r:[["Bolt Pistol","4 · 3+ · 3/4"],["Bolt Sniper Rifle — Executioner","4 · 2+ · 3/4"],["Bolt Sniper Rifle — Hyperfrag","4 · 2+ · 2/4"],["Bolt Sniper Rifle — Mortis","4 · 2+ · 3/3"]],m:[["Fists","4 · 3+ · 3/4"]]},"Heavy Intercessor Gunner":{role:"Operativo",max:1,r:[["Bolt Pistol","4 · 3+ · 3/4"],["Heavy Bolter — Focused","5 · 3+ · 4/5"],["Heavy Bolter — Sweeping","4 · 3+ · 4/5"]],m:[["Fists","4 · 3+ · 3/4"]]},"Intercessor Gunner":{role:"Operativo",max:1,r:[["Auto Bolt Rifle","4 · 3+ · 3/4"],["Auxiliary Grenade Launcher — Frag","4 · 3+ · 2/4"],["Auxiliary Grenade Launcher — Krak","4 · 3+ · 4/5"],["Bolt Rifle","4 · 3+ · 3/4"]],m:[["Fists","4 · 3+ · 3/4"]]},"Intercessor Warrior":{role:"Operativo",max:5,r:[["Auto Bolt Rifle","4 · 3+ · 3/4"],["Bolt Rifle","4 · 3+ · 3/4"],["Stalker Bolt Rifle","4 · 3+ · 3/5"]],m:[["Fists","4 · 3+ · 3/4"]]}};const maps=[1,2,3,4,5,6],ops=["Asegurar","Saquear","Transmisión","El Orbe","Reclamar propiedad","Células de energía","Descargar datos","Datos","Reiniciar"],chapter=["Agresivos","Duelistas","Resueltos","Sigilosos","Móviles","Robustos","Tiradores certeros","Especialistas en asedios"],strategy=["Adaptive Tactics","And They Shall Know No Fear","Combat Doctrine","Indomitus"],firefight=["Adjust Doctrine","Shock Assault","Transhuman Physiology","Wrath of Vengeance"],faction=["Chapter Reliquaries","Purity Seals","Tilting Shields","Auspex"],universal=["Ammo Cache","Razor Wire","Comms Device","Mines","Smoke Grenade","Stun Grenade","Frag Grenade","Krak Grenade","Breaching Charge"];let chosenMap='',chosenOp='',current='friend',turnNo=1,counts={friend:{},enemy:{}};const $=id=>document.getElementById(id);function go(n){if(n===2&&!$('friend').value)return alert('Selecciona el ejército amigo.');if(n===3&&(!chosenMap||!chosenOp))return alert('Selecciona mapa y operación.');for(let i=1;i<=4;i++)$('s'+i).classList.toggle('hidden',i!==n);if(n===2){renderMaps();renderOps()}if(n===3){current='friend';renderSides();renderOperatives()}if(n===4){current='friend';turnNo=1;renderTurn()};scrollTo(0,0)}function renderMaps(){$('maps').innerHTML=maps.map(n=>`<button class="btn ${chosenMap===n?'active':''}" onclick="chosenMap=${n};renderMaps()">Mundo Necrópolis ${n}</button>`).join('')}function renderOps(){$('operations').innerHTML=ops.map((x,i)=>`<button class="btn ${chosenOp===x?'active':''}" onclick="chosenOp='${x}';renderOps()">${i+1}. ${x}</button>`).join('')}function renderSides(){let has=$('enemy').value!=='';$('enemyTab').disabled=!has;$('turnEnemy').disabled=!has;$('friendTab').classList.toggle('active',current==='friend');$('enemyTab').classList.toggle('active',current==='enemy');$('sideInfo').textContent=(current==='friend'?'Amigo: ':'Rival: ')+( $(current).value||'Ningún ejército') }function side(s){if(s==='enemy'&&!$('enemy').value)return;current=s;renderSides();renderOperatives()}function total(role){return Object.entries(counts[current]).filter(([n])=>OPS[n].role===role).reduce((a,[n,c])=>a+c,0)}function renderOperatives(){let html='';for(const [n,o] of Object.entries(OPS)){const c=counts[current][n]||0;html+=`<div class="op ${c?'active':''}"><div class="ophead"><div class="name">${n}<div class="small">${o.role} · máximo ${o.max}</div></div><div class="qty"><button onclick="change('${n}',-1)">−</button><b>${c}</b><button onclick="change('${n}',1)">+</button></div></div>${c?weapons(n,o,c):''}</div>`}$('operatives').innerHTML=html;$('counter').textContent=`Líderes ${total('Líder')}/1 · Operativos ${total('Operativo')}/5`}function change(n,d){const o=OPS[n],c=counts[current][n]||0;if(d>0&&(c>=o.max||(o.role==='Líder'&&total('Líder')>=1)||(o.role==='Operativo'&&total('Operativo')>=5)))return;counts[current][n]=Math.max(0,c+d);renderOperatives()}function weapons(n,o,c){let h='<div class="weapons">';for(let i=1;i<=c;i++){h+=`<div><b>${n}${c>1?' #'+i:''}</b><h4>🎯 Armas a distancia</h4>`+o.r.map(w=>`<div class="weapon"><span>${w[0]} <span class="small">${w[1]}</span></span><button onclick="this.classList.toggle('active')">✓</button></div>`).join('')+'<h4>⚔️ Armas CaC</h4>'+o.m.map(w=>`<div class="weapon"><span>${w[0]} <span class="small">${w[1]}</span></span><button onclick="this.classList.toggle('active')">✓</button></div>`).join('')+'</div>'}return h+'</div>'}function turnSide(s){if(s==='enemy'&&!$('enemy').value)return;current=s;renderTurn()}function turn(n){turnNo=n;renderTurn()}function renderTurn(){$('turnFriend').classList.toggle('active',current==='friend');$('turnEnemy').classList.toggle('active',current==='enemy');$('turnInfo').textContent=(current==='friend'?'Amigo: ':'Rival: ')+( $(current).value||'Ningún ejército')+' · Turno T'+turnNo;document.querySelectorAll('.turns .btn').forEach((b,i)=>b.classList.toggle('active',i===turnNo-1));list('chapter',chapter);list('strategy',strategy);list('firefight',firefight);list('faction',faction);list('universal',universal)}function list(id,a){$(id).innerHTML=a.map(x=>`<label><span>${x}</span><input type="checkbox"></label>`).join('')}renderMaps();renderOps();renderSides();</script></body></html>
