<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KT Companion · Battle Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0e10;color:#eee;font-family:Arial,sans-serif}.top{padding:14px 18px;background:#151a1d;border-bottom:1px solid #333;font-weight:bold}.wrap{max-width:1300px;margin:auto;padding:14px}.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.btn{background:#20272b;color:#eee;border:1px solid #465056;border-radius:5px;padding:8px 10px;cursor:pointer}.btn:hover{background:#30383d}.btn.active,.btn.primary{background:#d85b18;border-color:#f07a38}.status{float:right;color:#aaa;font-weight:normal}.phases{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.phase{background:#20272b;color:#eee;border:1px solid #465056;border-radius:5px;padding:7px 10px;cursor:pointer}.phase.active{background:#d85b18}.board{width:100%;aspect-ratio:30/22;background:#85857d;border:4px solid #26292b;position:relative;touch-action:none}.board canvas{width:100%;height:100%;display:block}.notes{margin-top:9px;background:#151a1d;border:1px solid #333;padding:12px}.notes textarea{width:100%;min-height:90px;margin-top:8px;background:#0e1214;color:#eee;border:1px solid #465056;padding:10px;resize:vertical}.trash{margin-top:8px;border:1px dashed #a24a4a;padding:10px;text-align:center;color:#e4b0b0}.hint{color:#aaa;font-size:13px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:10}.box{background:#171d20;border:1px solid #4a5358;border-radius:8px;padding:18px;min-width:340px;max-width:92vw;max-height:90vh;overflow:auto}.box h2{margin:0 0 12px}.saved{border:1px solid #343d42;background:#101518;padding:10px;margin:7px 0;border-radius:5px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.grid .btn{font-size:20px}.row{display:flex;gap:8px;align-items:center;margin:10px 0}.row input{flex:1}.small{font-size:12px;color:#aaa}.disabled{opacity:.4;pointer-events:none}@media(max-width:700px){.status{float:none;display:block;margin-top:5px}.box{min-width:0;width:92vw}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="top">⚔ KILL TEAM COMPANION · ALPHA · BATTLE BOARD <span id="status" class="status"></span></div>
<div class="wrap">
<div class="toolbar" id="toolbar">
<button class="btn active" data-tool="select">✋ Arrastrar</button><button class="btn" data-tool="pen">✎ Lápiz</button><button class="btn" data-tool="line">╱ Línea</button><button class="btn" data-tool="arrow">➜ Flecha</button><button class="btn" data-tool="rect">□ Área</button><button class="btn" data-tool="circle">○ Círculo</button><button class="btn" data-tool="text">T Texto</button><button class="btn" id="tokenBtn">🔵 Ficha</button><button class="btn" id="iconBtn">🧩 Iconos</button><button class="btn" data-tool="temp">📏 Regla temporal</button><button class="btn" data-tool="ruler">📐 Medidor permanente</button><button class="btn" id="styleBtn">🎨 Estilo</button><button class="btn" id="undoBtn">↶</button><button class="btn" id="redoBtn">↷</button><button class="btn" id="deleteBtn">🗑 Eliminar</button><button class="btn primary" id="savePhaseBtn">📸 Guardar fase</button><button class="btn primary" id="saveMatrixBtn">💾 Guardar matriz</button><button class="btn" id="matricesBtn">📂 Matrices guardadas</button>
</div>
<div class="phases" id="phases"></div>
<div class="board" id="board"><canvas id="canvas"></canvas></div>
<div class="notes"><b>📝 NOTAS · <span id="phaseTitle"></span></b><span class="hint"> · se guardan con la fase</span><textarea id="notes" placeholder="Notas a pie de página..."></textarea><div class="trash" id="trash">🗑️ ZONA DE ELIMINACIÓN · arrastra aquí el objeto seleccionado</div></div>
<p class="small">Guardar una fase crea una copia independiente. El tablero de trabajo no cambia. Guardar matriz reúne todas las fases guardadas.</p>
</div>
<div id="modal"></div>
<script>
'use strict';
const PHASES=['despliegue','turno1','turno2','turno3','turno4'];
const LABEL={despliegue:'DESPLIEGUE',turno1:'TURNO 1',turno2:'TURNO 2',turno3:'TURNO 3',turno4:'TURNO 4'};
const $=id=>document.getElementById(id);
let phase='despliegue',tool='select',objects=[],selected=null,dragging=false,start=null,last=null,preview=null;
let undoStack=[],redoStack=[],tokenSize=28,icon='🎯',iconSize=42,color='#e76627',opacity=1;
let state=read('ktPhaseTest')||{phases:{},notes:{}}; let matrices=read('ktMatrices')||[];
const canvas=$('canvas'),ctx=canvas.getContext('2d');
function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function clone(v){return JSON.parse(JSON.stringify(v))}
function status(t){$('status').textContent=t}
function resize(){const r=canvas.getBoundingClientRect(),d=Math.max(1,devicePixelRatio||1);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}
addEventListener('resize',resize);
function P(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
function snap(){undoStack.push(clone(objects));if(undoStack.length>60)undoStack.shift();redoStack=[]}
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));status(t==='select'?'Arrastrar / seleccionar':t==='temp'?'Regla temporal':t)}
function bg(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.fillStyle='#85857d';ctx.fillRect(0,0,w,h);ctx.strokeStyle='rgba(30,30,30,.15)';ctx.lineWidth=1;for(let i=1;i<30;i++){ctx.beginPath();ctx.moveTo(w*i/30,0);ctx.lineTo(w*i/30,h);ctx.stroke()}for(let i=1;i<22;i++){ctx.beginPath();ctx.moveTo(0,h*i/22);ctx.lineTo(w,h*i/22);ctx.stroke()}ctx.fillStyle='#454741';[[.08,.1,.23,.15],[.52,.16,.16,.30],[.25,.64,.19,.16],[.72,.68,.15,.23]].forEach(a=>ctx.fillRect(a[0]*w,a[1]*h,a[2]*w,a[3]*h))}
function draw(){if(!canvas.clientWidth)return;bg();const w=canvas.clientWidth,h=canvas.clientHeight;objects.forEach(o=>drawObj(o,w,h));if(preview&&start&&tool==='temp')drawObj({type:'ruler',x1:start.x,y1:start.y,x2:preview.x,y2:preview.y,col:color,a:.65},w,h);if(selected){const b=bounds(selected,w,h);ctx.save();ctx.strokeStyle='#fff';ctx.setLineDash([5,4]);ctx.lineWidth=2;ctx.strokeRect(b.x-6,b.y-6,b.w+12,b.h+12);ctx.restore()}}
function drawObj(o,w,h){ctx.save();ctx.globalAlpha=o.a??1;ctx.strokeStyle=o.col||color;ctx.fillStyle=o.col||color;ctx.lineWidth=o.lw||3;ctx.lineCap='round';
if(o.type==='line'||o.type==='arrow'||o.type==='ruler'){ctx.beginPath();ctx.moveTo(o.x1*w,o.y1*h);ctx.lineTo(o.x2*w,o.y2*h);ctx.stroke();if(o.type==='arrow'){const q=Math.atan2((o.y2-o.y1)*h,(o.x2-o.x1)*w);ctx.beginPath();ctx.moveTo(o.x2*w,o.y2*h);ctx.lineTo(o.x2*w-16*Math.cos(q-.5),o.y2*h-16*Math.sin(q-.5));ctx.lineTo(o.x2*w-16*Math.cos(q+.5),o.y2*h-16*Math.sin(q+.5));ctx.fill()}if(o.type==='ruler'){ctx.fillStyle='#111';ctx.font='bold 15px Arial';ctx.fillText(distance(o)+'"',((o.x1+o.x2)/2)*w,((o.y1+o.y2)/2)*h-7)}}
else if(o.type==='pen'){ctx.beginPath();o.pts.forEach((p,i)=>i?ctx.lineTo(p.x*w,p.y*h):ctx.moveTo(p.x*w,p.y*h));ctx.stroke()}
else if(o.type==='rect'){ctx.strokeRect(o.x*w,o.y*h,o.w*w,o.h*h)}
else if(o.type==='circle'){ctx.beginPath();ctx.ellipse(o.x*w,o.y*h,o.rx*w,o.ry*h,0,0,Math.PI*2);ctx.stroke()}
else if(o.type==='token'){ctx.beginPath();ctx.arc(o.x*w,o.y*h,o.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold '+Math.max(10,o.r*.45)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(o.mm),o.x*w,o.y*h)}
else if(o.type==='icon'){ctx.font=o.size+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.icon,o.x*w,o.y*h)}
else if(o.type==='text'){ctx.font='bold '+o.size+'px Arial';ctx.fillText(o.text,o.x*w,o.y*h)}ctx.restore()}
function distance(o){return (Math.round(Math.hypot((o.x2-o.x1)*30,(o.y2-o.y1)*22)*4)/4).toFixed(2)}
function bounds(o,w,h){if(['line','arrow','ruler'].includes(o.type))return{x:Math.min(o.x1,o.x2)*w,y:Math.min(o.y1,o.y2)*h,w:Math.max(10,Math.abs(o.x2-o.x1)*w),h:Math.max(10,Math.abs(o.y2-o.y1)*h)};if(o.type==='token')return{x:o.x*w-o.r,y:o.y*h-o.r,w:o.r*2,h:o.r*2};if(o.type==='icon')return{x:o.x*w-o.size/2,y:o.y*h-o.size/2,w:o.size,h:o.size};if(o.type==='text')return{x:o.x*w,y:o.y*h-o.size,w:Math.max(15,o.text.length*o.size*.6),h:o.size};if(o.type==='rect')return{x:o.x*w,y:o.y*h,w:o.w*w,h:o.h*h};if(o.type==='circle')return{x:(o.x-o.rx)*w,y:(o.y-o.ry)*h,w:o.rx*2*w,h:o.ry*2*h};return{x:0,y:0,w:0,h:0}}
function hit(p){const w=canvas.clientWidth,h=canvas.clientHeight;for(let i=objects.length-1;i>=0;i--){const b=bounds(objects[i],w,h);if(p.x*w>=b.x-10&&p.x*w<=b.x+b.w+10&&p.y*h>=b.y-10&&p.y*h<=b.y+b.h+10)return objects[i]}return null}
function moveObj(o,dx,dy){if(['line','arrow','ruler'].includes(o.type)){o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}else if(o.type==='pen'){o.pts.forEach(p=>{p.x+=dx;p.y+=dy})}else{o.x+=dx;o.y+=dy}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const p=P(e);if(tool==='select'){selected=hit(p);if(selected){snap();dragging=true;start=p;last=p}draw();return}if(tool==='text'){const t=prompt('Texto:');if(t){snap();objects.push({type:'text',x:p.x,y:p.y,text:t,size:20,col:color,a:opacity});draw()}return}dragging=true;start=p;last=p;preview=p;if(tool==='pen')objects.push({type:'pen',pts:[p],col:color,a:opacity})});
canvas.addEventListener('pointermove',e=>{const p=P(e);if(!dragging)return;if(tool==='select'&&selected){moveObj(selected,p.x-last.x,p.y-last.y);last=p;draw();return}if(tool==='pen'){objects[objects.length-1].pts.push(p);draw();return}preview=p;draw()});
canvas.addEventListener('pointerup',e=>{const p=P(e);if(!dragging)return;dragging=false;if(tool==='select'){if(selected){const r=canvas.getBoundingClientRect(),tr=$('trash').getBoundingClientRect();if(e.clientX>=tr.left&&e.clientX<=tr.right&&e.clientY>=tr.top&&e.clientY<=tr.bottom){objects.splice(objects.indexOf(selected),1);status('Objeto eliminado')} }selected=null;draw();return}if(tool==='pen'){preview=null;draw();return}if(tool==='temp'){preview=null;draw();return}if(tool==='line'||tool==='arrow'||tool==='ruler')objects.push({type:tool==='line'?'line':tool,x1:start.x,y1:start.y,x2:p.x,y2:p.y,col:color,a:opacity});else if(tool==='rect')objects.push({type:'rect',x:start.x,y:start.y,w:p.x-start.x,h:p.y-start.y,col:color,a:opacity});else if(tool==='circle')objects.push({type:'circle',x:start.x,y:start.y,rx:Math.abs(p.x-start.x),ry:Math.abs(p.y-start.y),col:color,a:opacity});else if(tool==='token')objects.push({type:'token',x:p.x,y:p.y,r:Math.max(8,tokenSize*0.65),mm:tokenSize,col:color,a:opacity});else if(tool==='icon')objects.push({type:'icon',x:p.x,y:p.y,size:iconSize,icon,col:color,a:opacity});preview=null;draw()});
function saveNotes(){state.notes[phase]=$('notes').value;write('ktPhaseTest',state)}
function renderPhases(){$('phaseTitle').textContent=LABEL[phase];$('phases').innerHTML='';PHASES.forEach(p=>{const b=document.createElement('button');b.className='phase'+(p===phase?' active':'');b.textContent=LABEL[p]+(state.phases[p]?' ✓':'');b.onclick=()=>loadPhase(p);$('phases').appendChild(b)})}
function loadPhase(p){saveNotes();phase=p;objects=state.phases[p]?clone(state.phases[p].objects):[];$('notes').value=state.notes[p]||'';selected=null;undoStack=[];redoStack=[];renderPhases();setTool('select');draw();status('Editando '+LABEL[p])}
function savePhase(){saveNotes();state.phases[phase]={objects:clone(objects),savedAt:new Date().toISOString()};write('ktPhaseTest',state);renderPhases();closeModal();status(LABEL[phase]+' guardado · puedes seguir trabajando')}
function modal(html){$('modal').innerHTML='<div class="modal"><div class="box">'+html+'</div></div>'}
function closeModal(){$('modal').innerHTML=''}
$('savePhaseBtn').onclick=()=>{modal('<h2>📸 Guardar fase</h2><p>Elige qué fase quieres guardar o sobrescribir.</p><div class="phases" id="phaseChoices"></div><button class="btn primary" id="confirmPhase">GUARDAR / SOBRESCRIBIR</button> <button class="btn" onclick="closeModal()">CANCELAR</button>');const q=$('phaseChoices');PHASES.forEach(p=>{const b=document.createElement('button');b.className='phase'+(p===phase?' active':'');b.textContent=LABEL[p];b.onclick=()=>{phase=p;q.querySelectorAll('button').forEach(z=>z.classList.remove('active'));b.classList.add('active')};q.appendChild(b)});$('confirmPhase').onclick=savePhase};
$('saveMatrixBtn').onclick=()=>{saveNotes();const name=prompt('Nombre de la matriz:','Matriz '+new Date().toLocaleDateString('es-ES'));if(!name)return;const m={id:Date.now(),name:name.trim(),createdAt:new Date().toISOString(),phases:clone(state.phases),notes:clone(state.notes)};matrices.push(m);write('ktMatrices',matrices);status('Matriz guardada: '+m.name)};
$('matricesBtn').onclick=()=>{let html='<h2>📂 MATRICES GUARDADAS</h2>';if(!matrices.length)html+='<p>No hay matrices guardadas.</p>';matrices.forEach(m=>{html+='<div class="saved"><b>'+safe(m.name)+'</b><div class="small">'+new Date(m.createdAt).toLocaleString('es-ES')+' · '+Object.keys(m.phases).length+' fases</div><br><button class="btn primary" data-open="'+m.id+'">ABRIR Y EDITAR</button> <button class="btn" data-view="'+m.id+'">👁 Ver PDF</button> <button class="btn" data-download="'+m.id+'">⬇ Descargar PDF</button></div>'});html+='<button class="btn" onclick="closeModal()">CERRAR</button>';modal(html);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openMatrix(Number(b.dataset.open)));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>makePDF(Number(b.dataset.view),false));document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>makePDF(Number(b.dataset.download),true))};
function safe(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function openMatrix(id){const m=matrices.find(x=>x.id===id);if(!m)return;state={phases:clone(m.phases),notes:clone(m.notes||{})};write('ktPhaseTest',state);const first=PHASES.find(p=>state.phases[p]);closeModal();loadPhase(first||'despliegue');status('Matriz abierta: '+m.name)}
async function makePDF(id,download){const m=matrices.find(x=>x.id===id);if(!m)return;if(!window.jspdf){alert('El generador PDF no está disponible. Recarga la página e inténtalo de nuevo.');return}const old={phase,objects:clone(objects),note:$('notes').value};const jsPDF=window.jspdf.jsPDF;const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});const saved=PHASES.filter(p=>m.phases[p]);if(!saved.length){alert('La matriz no tiene fases guardadas.');return}for(let i=0;i<saved.length;i++){const p=saved[i];phase=p;objects=clone(m.phases[p].objects||[]);draw();if(i)pdf.addPage();pdf.setFontSize(18);pdf.text(m.name,12,12);pdf.setFontSize(12);pdf.text(LABEL[p],12,19);const img=canvas.toDataURL('image/jpeg',.9);pdf.addImage(img,'JPEG',12,24,273,200);const note=m.notes[p]||'';if(note){pdf.setFontSize(9);const lines=pdf.splitTextToSize(note,273);pdf.text(lines.slice(0,4),12,231)}}phase=old.phase;objects=old.objects;$('notes').value=old.note;draw();if(download){pdf.save(m.name.replace(/[\\/:*?\"<>|]/g,'_')+'.pdf');closeModal()}else{const blob=pdf.output('blob');const url=URL.createObjectURL(blob);window.open(url,'_blank');closeModal()}}
$('tokenBtn').onclick=()=>modal('<h2>🔵 Ficha</h2><p>Tamaño por defecto: 28 mm</p><div class="grid">'+[25,28,32,40].map(n=>'<button class="btn" data-token="'+n+'">'+n+' mm</button>').join('')+'<button class="btn" id="customToken">Personalizado</button></div>');
$('iconBtn').onclick=()=>modal('<h2>🧩 Iconos</h2><div class="grid">'+['🪜','〰️','💨','💣','🧱','🔥','☠️','☢️','⚡','🔫','✝️','⚠️','🎯','🛡️','👣','💥'].map(i=>'<button class="btn" data-icon="'+i+'">'+i+'</button>').join('')+'</div><div class="row">Tamaño <input id="iconRange" type="range" min="18" max="120" value="42"></div>');
$('toolbar').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(b)setTool(b.dataset.tool)});
$('modal').addEventListener('click',e=>{const t=e.target.closest('[data-token]');if(t){tokenSize=Number(t.dataset.token);closeModal();setTool('token')}const ic=e.target.closest('[data-icon]');if(ic){icon=ic.dataset.icon;iconSize=Number($('iconRange')?.value||42);closeModal();setTool('icon')}if(e.target.id==='customToken'){const n=Number(prompt('Tamaño de peana en mm',28));if(n>0){tokenSize=n;closeModal();setTool('token')}}});
$('styleBtn').onclick=()=>{if(!selected){status('Selecciona primero un objeto');return}modal('<h2>🎨 Estilo</h2><div class="row">Color <input id="colorPick" type="color" value="'+(selected.col||color)+'"></div><div class="row">Opacidad <input id="opacityPick" type="range" min="0" max="100" value="'+Math.round((selected.a??1)*100)+'"></div><button class="btn primary" id="applyStyle">APLICAR</button>');$('applyStyle').onclick=()=>{selected.col=$('colorPick').value;selected.a=Number($('opacityPick').value)/100;closeModal();draw()}};
$('undoBtn').onclick=()=>{if(!undoStack.length)return;redoStack.push(clone(objects));objects=undoStack.pop();selected=null;draw()};$('redoBtn').onclick=()=>{if(!redoStack.length)return;undoStack.push(clone(objects));objects=redoStack.pop();draw()};$('deleteBtn').onclick=()=>{if(selected){snap();objects.splice(objects.indexOf(selected),1);selected=null;draw()}};
$('notes').oninput=saveNotes;
renderPhases();resize();setTool('select');status('Listo');
</script>
</body></html>
