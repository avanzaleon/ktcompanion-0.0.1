<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion — Battle Board</title><style>body{margin:0;background:#0b0e10;color:#eee;font-family:Arial}.top{height:58px;background:#151a1d;display:flex;align-items:center;padding:0 18px}.top b{letter-spacing:1px}.wrap{max-width:1280px;margin:auto;padding:14px}.toolbar,.phases{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}.button,.phase{background:#20272b;color:#eee;border:1px solid #41494d;border-radius:5px;padding:8px 11px;cursor:pointer}.button:hover,.phase:hover{background:#30383d}.active,.primary{background:#d85b18!important;border-color:#e7773d!important}.status{margin-left:auto;color:#aaa}.board{background:#99988d;border:4px solid #25282a;aspect-ratio:30/22;position:relative;overflow:hidden;touch-action:none}.map{position:absolute;inset:0;background-image:linear-gradient(#3333 1px,transparent 1px),linear-gradient(90deg,#3333 1px,transparent 1px);background-size:3.33% 4.5%}.terrain{position:absolute;background:#51534e;border-radius:8px}.t1{left:8%;top:11%;width:22%;height:15%}.t2{left:52%;top:16%;width:16%;height:30%}.t3{left:25%;top:64%;width:19%;height:16%}.t4{left:72%;top:68%;width:15%;height:23%}canvas{position:absolute;inset:0;width:100%;height:100%}.notes{margin-top:9px;background:#151a1d;border:1px solid #333;padding:12px}.notes textarea{width:100%;box-sizing:border-box;margin-top:8px;min-height:80px;background:#0e1214;color:#eee;border:1px solid #3d4549;padding:10px}.hint,.small{color:#aaa;font-size:13px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:5}.modalbox{background:#171d20;border:1px solid #454d51;border-radius:8px;padding:20px;min-width:360px;max-width:90vw;max-height:90vh;overflow:auto}.close{float:right}.saved{background:#111619;border:1px solid #333;padding:12px;margin:8px 0;border-radius:6px}.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.palette button{font-size:24px}.row{display:flex;gap:8px;align-items:center;margin:10px 0}.row input{flex:1}.trash{margin-top:8px;border:1px dashed #8a3939;padding:10px;text-align:center}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body><div class="top"><b>⚔ KILL TEAM COMPANION — ALPHA · BATTLE BOARD</b><span id="status" class="status"></span></div><div class="wrap"><div class="toolbar"><button class="button" data-tool="select">✋ Arrastrar</button><button class="button" data-tool="pen">✎ Lápiz</button><button class="button" data-tool="line">╱ Línea</button><button class="button" data-tool="arrow">➜ Flecha</button><button class="button" data-tool="rect">□ Área</button><button class="button" data-tool="circle">○ Círculo</button><button class="button" data-tool="text">T Nota</button><button class="button" onclick="tokenMenu()">🔵 Ficha</button><button class="button" onclick="iconMenu()">🧩 Iconos</button><button class="button" data-tool="tempRuler">📏 Regla</button><button class="button" data-tool="ruler">📐 Medidor</button><button class="button" onclick="styleMenu()">🎨 Estilo</button><button class="button" onclick="undo()">↶</button><button class="button" onclick="redo()">↷</button><button class="button" onclick="removeSelected()">🗑 Eliminar</button><button class="button primary" onclick="openSavePhase()">📸 Guardar fase</button><button class="button primary" onclick="saveMatrixPrompt()">💾 Guardar matriz</button><button class="button" onclick="openMatrices()">📂 Matrices guardadas</button></div><div id="phases" class="phases"></div><div id="board" class="board"><div class="map"><i class="terrain t1"></i><i class="terrain t2"></i><i class="terrain t3"></i><i class="terrain t4"></i></div><canvas id="c"></canvas></div><div class="notes"><b>📝 NOTAS — <span id="phaseName"></span></b><span class="hint"> · se guardan con la fase</span><textarea id="notes" placeholder="Notas de la fase..."></textarea><div class="trash">🗑️ ZONA DE ELIMINACIÓN</div></div><p class="small">Guardar fase crea una copia independiente. Guardar matriz conserva todas las fases guardadas con el nombre elegido.</p></div><div id="modal"></div><script>const phases=['despliegue','turno1','turno2','turno3','turno4'],labels={despliegue:'DESPLIEGUE',turno1:'TURNO 1',turno2:'TURNO 2',turno3:'TURNO 3',turno4:'TURNO 4'};let phase='despliegue',tool='select',objects=[],history=[],future=[],selected=null,down=false,start=null,preview=null,pendingToken=28,pendingIcon='🎯',pendingIconSize=42,color='#e76627',opacity=1;let data=JSON.parse(localStorage.getItem('ktPhaseTest')||'null')||{phases:{},notes:{}},matrices=JSON.parse(localStorage.getItem('ktMatrices')||'[]');const c=document.getElementById('c'),x=c.getContext('2d');function resize(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);function norm(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}function status(s){document.getElementById('status').textContent=s}function hist(){history.push(JSON.stringify(objects));if(history.length>50)history.shift();future=[]}function draw(){let w=c.clientWidth,h=c.clientHeight;x.clearRect(0,0,w,h);objects.forEach(o=>obj(o,w,h));if(preview&&start&&tool==='tempRuler')obj({t:'ruler',x1:start.x,y1:start.y,x2:preview.x,y2:preview.y,a:.7,col:color},w,h);if(selected){x.save();x.strokeStyle='#fff';x.setLineDash([5,4]);let b=bounds(selected,w,h);x.strokeRect(b.x-6,b.y-6,b.w+12,b.h+12);x.restore()}}function obj(o,w,h){x.save();x.globalAlpha=o.a??1;x.strokeStyle=o.col||color;x.fillStyle=o.col||color;x.lineWidth=o.lw||4;x.lineCap='round';if(['line','arrow','ruler'].includes(o.t)){x.beginPath();x.moveTo(o.x1*w,o.y1*h);x.lineTo(o.x2*w,o.y2*h);x.stroke();if(o.t==='arrow'){let q=Math.atan2((o.y2-o.y1)*h,(o.x2-o.x1)*w);x.beginPath();x.moveTo(o.x2*w,o.y2*h);x.lineTo(o.x2*w-18*Math.cos(q-.5),o.y2*h-18*Math.sin(q-.5));x.lineTo(o.x2*w-18*Math.cos(q+.5),o.y2*h-18*Math.sin(q+.5));x.fill()}if(o.t==='ruler'){x.fillStyle='#111';x.font='bold 16px Arial';x.fillText((Math.round(Math.hypot((o.x2-o.x1)*30,(o.y2-o.y1)*22)*4)/4)+'"',((o.x1+o.x2)/2)*w,((o.y1+o.y2)/2)*h-8)}}else if(o.t==='free'){x.beginPath();o.pts.forEach((p,i)=>i?x.lineTo(p.x*w,p.y*h):x.moveTo(p.x*w,p.y*h));x.stroke()}else if(o.t==='rect')x.strokeRect(o.x*w,o.y*h,o.w*w,o.h*h);else if(o.t==='circle'){x.beginPath();x.ellipse(o.x*w,o.y*h,o.rx*w,o.ry*h,0,0,Math.PI*2);x.stroke()}else if(o.t==='token'){x.beginPath();x.arc(o.x*w,o.y*h,o.r,0,Math.PI*2);x.fill();x.strokeStyle='#fff';x.stroke();x.fillStyle='#fff';x.font='bold '+Math.max(10,o.r*.45)+'px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(o.mm,o.x*w,o.y*h)}else if(o.t==='icon'){x.font=o.size+'px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(o.icon,o.x*w,o.y*h)}else if(o.t==='text'){x.font='bold '+o.size+'px Arial';x.fillText(o.text,o.x*w,o.y*h)}x.restore()}function bounds(o,w,h){if(['line','arrow','ruler'].includes(o.t))return{x:Math.min(o.x1,o.x2)*w,y:Math.min(o.y1,o.y2)*h,w:Math.abs(o.x2-o.x1)*w||10,h:Math.abs(o.y2-o.y1)*h||10};if(o.t==='token')return{x:o.x*w-o.r,y:o.y*h-o.r,w:o.r*2,h:o.r*2};if(o.t==='icon')return{x:o.x*w-o.size/2,y:o.y*h-o.size/2,w:o.size,h:o.size};if(o.t==='text')return{x:o.x*w,y:o.y*h-o.size,w:o.size*o.text.length*.6,h:o.size};if(o.t==='rect')return{x:o.x*w,y:o.y*h,w:o.w*w,h:o.h*h};return{x:(o.x-o.rx)*w,y:(o.y-o.ry)*h,w:o.rx*2*w,h:o.ry*2*h}}function hit(p){let w=c.clientWidth,h=c.clientHeight;for(let i=objects.length-1;i>=0;i--){let b=bounds(objects[i],w,h);if(p.x*w>=b.x-10&&p.x*w<=b.x+b.w+10&&p.y*h>=b.y-10&&p.y*h<=b.y+b.h+10)return objects[i]}return null}function move(o,dx,dy){if(['line','arrow','ruler'].includes(o.t)){o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}else{o.x+=dx;o.y+=dy}}c.onpointerdown=e=>{let p=norm(e);if(tool==='select'){selected=hit(p);if(selected){hist();start=p;down=true}draw();return}if(tool==='text'){let t=prompt('Texto:');if(t){hist();objects.push({t:'text',x:p.x,y:p.y,text:t,size:20,col:color,a:opacity});draw()}return}down=true;start=p;preview=p};c.onpointermove=e=>{let p=norm(e);if(!down)return;if(tool==='select'&&selected){move(selected,p.x-start.x,p.y-start.y);start=p;draw();return}preview=p;draw()};c.onpointerup=e=>{let p=norm(e);if(!down)return;down=false;if(tool==='select'){selected=null;draw();return}hist();if(tool==='pen')objects.push({t:'free',pts:[start,p],col:color,a:opacity});else if(['line','arrow','ruler'].includes(tool))objects.push({t:tool,x1:start.x,y1:start.y,x2:p.x,y2:p.y,col:color,a:opacity});else if(tool==='rect')objects.push({t:'rect',x:start.x,y:start.y,w:p.x-start.x,h:p.y-start.y,col:color,a:opacity});else if(tool==='circle')objects.push({t:'circle',x:start.x,y:start.y,rx:Math.abs(p.x-start.x),ry:Math.abs(p.y-start.y),col:color,a:opacity});else if(tool==='token')objects.push({t:'token',x:p.x,y:p.y,r:Math.max(8,pendingToken/1.7),mm:pendingToken,col:color,a:opacity});else if(tool==='icon')objects.push({t:'icon',x:p.x,y:p.y,size:pendingIconSize,icon:pendingIcon,col:color,a:opacity});preview=null;draw()};function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));status(t==='select'?'ARRASTRAR / SELECCIONAR':t.toUpperCase())}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));function undo(){if(!history.length)return;future.push(JSON.stringify(objects));objects=JSON.parse(history.pop());draw()}function redo(){if(!future.length)return;history.push(JSON.stringify(objects));objects=JSON.parse(future.pop());draw()}function removeSelected(){if(!selected)return;hist();objects.splice(objects.indexOf(selected),1);selected=null;draw()}function saveNotes(){data.notes[phase]=document.getElementById('notes').value;localStorage.setItem('ktPhaseTest',JSON.stringify(data))}function renderPhase(){document.getElementById('phaseName').textContent=labels[phase];document.getElementById('phases').innerHTML=phases.map(p=>`<button class="phase ${p===phase?'active':''}" onclick="loadPhase('${p}')">${labels[p]} ${data.phases[p]?'✓':''}</button>`).join('')}function loadPhase(p){saveNotes();phase=p;objects=data.phases[p]?JSON.parse(JSON.stringify(data.phases[p].objects)):[];document.getElementById('notes').value=data.notes[p]||'';selected=null;history=[];future=[];renderPhase();setTool('select');draw()}function savePhase(){saveNotes();data.phases[phase]={objects:JSON.parse(JSON.stringify(objects)),savedAt:new Date().toISOString()};localStorage.setItem('ktPhaseTest',JSON.stringify(data));renderPhase();closeModal();status(labels[phase]+' guardado')}function openSavePhase(){openModal(`<h2>📸 Guardar fase</h2><p>Selecciona la fase a guardar o sobrescribir.</p><div class="phases">${phases.map(p=>`<button class="phase ${p===phase?'active':''}" onclick="phase='${p}';renderPhase()">${labels[p]}</button>`).join('')}</div><button class="button primary" onclick="savePhase()">GUARDAR / SOBRESCRIBIR</button> <button class="button" onclick="closeModal()">CANCELAR</button>`)}
function saveMatrixPrompt(){saveNotes();let name=prompt('Nombre de la matriz:','Matriz '+new Date().toLocaleDateString('es-ES'));if(!name)return;let m={id:Date.now(),name:name.trim(),createdAt:new Date().toISOString(),phases:{},notes:{}};phases.forEach(p=>{if(data.phases[p])m.phases[p]=JSON.parse(JSON.stringify(data.phases[p]));if(data.notes[p])m.notes[p]=data.notes[p]});matrices.push(m);localStorage.setItem('ktMatrices',JSON.stringify(matrices));status('Matriz «'+m.name+'» guardada')}function openMatrices(){openModal(`<h2>📂 MATRICES GUARDADAS</h2>${matrices.length?matrices.map(m=>`<div class="saved"><b>${esc(m.name)}</b><div class="small">${new Date(m.createdAt).toLocaleString('es-ES')} · ${Object.keys(m.phases).length} fases</div><br><button class="button primary" onclick="openMatrix(${m.id})">ABRIR Y EDITAR</button> <button class="button" onclick="viewPDF(${m.id})">👁 Ver PDF</button> <button class="button" onclick="downloadPDF(${m.id})">⬇ Descargar PDF</button></div>`).join(''):'<p>No hay matrices guardadas.</p>')}<button class="button" onclick="closeModal()">CERRAR</button>`)}function openMatrix(id){let m=matrices.find(q=>q.id===id);data={phases:JSON.parse(JSON.stringify(m.phases)),notes:JSON.parse(JSON.stringify(m.notes||{}))};localStorage.setItem('ktPhaseTest',JSON.stringify(data));let first=phases.find(p=>data.phases[p]);closeModal();loadPhase(first||'despliegue');status('Matriz «'+m.name+'» abierta y editable')}function esc(s){return String(s).replace(/[&<>]/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[a]))}async function buildPDF(m){if(!window.jspdf||!window.html2canvas){alert('No se ha cargado el generador PDF.');return null}let old={phase,objects,notes:document.getElementById('notes').value},saved=phases.filter(p=>m.phases[p]),pdf=new jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});for(let i=0;i<saved.length;i++){let p=saved[i];phase=p;objects=JSON.parse(JSON.stringify(m.phases[p].objects||[]));document.getElementById('notes').value=m.notes[p]||'';draw();let shot=await html2canvas(document.getElementById('board'),{backgroundColor:'#99988d',scale:1.5});if(i)pdf.addPage();pdf.setFontSize(18);pdf.text(m.name,14,14);pdf.setFontSize(12);pdf.text(labels[p],14,21);pdf.addImage(shot.toDataURL('image/jpeg',.92),'JPEG',14,26,268,196);if(m.notes[p])pdf.text(pdf.splitTextToSize('Notas: '+m.notes[p],268),14,230)}phase=old.phase;objects=old.objects;document.getElementById('notes').value=old.notes;draw();return pdf}async function viewPDF(id){let m=matrices.find(q=>q.id===id),pdf=await buildPDF(m);if(pdf){closeModal();window.open(pdf.output('bloburl'),'_blank')}}async function downloadPDF(id){let m=matrices.find(q=>q.id===id),pdf=await buildPDF(m);if(pdf){closeModal();pdf.save(m.name+'.pdf')}}function openModal(h){document.getElementById('modal').innerHTML=`<div class="modal"><div class="modalbox"><button class="button close" onclick="closeModal()">×</button>${h}</div></div>`}function closeModal(){document.getElementById('modal').innerHTML=''}function tokenMenu(){openModal(`<h2>🔵 FICHA</h2><p>28 mm por defecto</p><div class="palette">${[25,28,32,40].map(n=>`<button class="button" onclick="pendingToken=${n};closeModal();setTool('token')">${n} mm</button>`).join('')}<button class="button" onclick="let n=+prompt('Tamaño en mm',28);if(n>0){pendingToken=n;closeModal();setTool('token')}">Personalizado</button></div>`)}function iconMenu(){let a=['🪜','〰️','💨','💣','🧱','🔥','☠️','☢️','⚡','🔫','✝️','⚠️','🎯','🛡️','👣','💥'];openModal(`<h2>🧩 ICONOS</h2><div class="palette">${a.map(i=>`<button class="button" onclick="pendingIcon='${i}';closeModal();setTool('icon')">${i}</button>`).join('')}</div><div class="row">Tamaño <input type="range" min="18" max="120" value="42" oninput="pendingIconSize=this.value"></div>`)}function styleMenu(){if(!selected){status('Selecciona un objeto');return}openModal(`<h2>🎨 Estilo</h2><div class="row">Color <input id="col" type="color" value="${selected.col||color}"></div><div class="row">Opacidad <input id="opa" type="range" min="0" max="100" value="${Math.round((selected.a??1)*100)}"></div><button class="button primary" onclick="selected.col=col.value;selected.a=opa.value/100;closeModal();draw()">APLICAR</button>`)}document.getElementById('notes').oninput=saveNotes;renderPhase();resize();setTool('select');</script></body></html>
