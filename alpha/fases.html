<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion — Battle Board</title><style>body{margin:0;background:#0b0e10;color:#eee;font-family:Arial,sans-serif}.top{height:58px;background:#151a1d;border-bottom:1px solid #333;display:flex;align-items:center;padding:0 18px;gap:12px}.top b{letter-spacing:1px}.wrap{max-width:1280px;margin:auto;padding:14px}.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}.button,.phase{background:#20272b;color:#eee;border:1px solid #41494d;border-radius:5px;padding:8px 11px;cursor:pointer}.button:hover,.phase:hover{background:#30383d}.button.active,.phase.active{background:#d85b18;border-color:#e7773d}.primary{background:#d85b18;border-color:#e7773d}.status{margin-left:auto;color:#aaa;padding:8px}.board{background:#99988d;border:4px solid #25282a;aspect-ratio:30/22;position:relative;overflow:hidden;touch-action:none}.map{position:absolute;inset:0;background-image:linear-gradient(rgba(40,40,40,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(40,40,40,.13) 1px,transparent 1px);background-size:3.33% 4.5%}.terrain{position:absolute;background:#51534e;border-radius:8px}.t1{left:8%;top:11%;width:22%;height:15%}.t2{left:52%;top:16%;width:16%;height:30%}.t3{left:25%;top:64%;width:19%;height:16%}.t4{left:72%;top:68%;width:15%;height:23%}canvas{position:absolute;inset:0;width:100%;height:100%}.notes{margin-top:9px;background:#151a1d;border:1px solid #333;padding:12px}.notes-head{display:flex;justify-content:space-between;color:#ddd}.notes textarea{width:100%;box-sizing:border-box;margin-top:8px;min-height:90px;background:#0e1214;color:#eee;border:1px solid #3d4549;padding:10px;resize:vertical}.phases{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.hint{color:#9da3a6;font-size:13px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:5}.modalbox{background:#171d20;border:1px solid #454d51;border-radius:8px;padding:20px;min-width:340px;max-width:90vw}.modalbox h2{margin-top:0}.close{float:right}.saved{background:#111619;border:1px solid #333;padding:12px;margin:8px 0;border-radius:6px}.trash{margin-top:8px;border:1px dashed #8a3939;padding:10px;text-align:center;color:#e7a4a4}.small{font-size:12px;color:#aaa}.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.palette button{font-size:25px;padding:8px}.row{display:flex;gap:8px;align-items:center;margin:10px 0}.row input{flex:1}</style></head><body><div class="top"><b>⚔ KILL TEAM COMPANION — ALPHA · BATTLE BOARD</b><span class="status" id="status"></span></div><div class="wrap"><div class="toolbar" id="toolbar"><button class="button" data-tool="select">✋ Arrastrar</button><button class="button" data-tool="pen">✎ Lápiz</button><button class="button" data-tool="line">╱ Línea</button><button class="button" data-tool="arrow">➜ Flecha</button><button class="button" data-tool="rect">□ Área</button><button class="button" data-tool="circle">○ Círculo</button><button class="button" data-tool="text">T Nota</button><button class="button" onclick="tokenMenu()">🔵 Ficha</button><button class="button" onclick="iconMenu()">🧩 Iconos</button><button class="button" data-tool="tempRuler">📏 Regla</button><button class="button" data-tool="ruler">📐 Medidor permanente</button><button class="button" onclick="styleMenu()">🎨 Color / 👻 Opacidad</button><button class="button" onclick="undo()">↶ Deshacer</button><button class="button" onclick="redo()">↷ Rehacer</button><button class="button" onclick="removeSelected()">🗑 Eliminar seleccionado</button><button class="button primary" onclick="openSave()">📸 Guardar fase</button><button class="button" onclick="openPhases()">FASES</button></div><div class="phases" id="phases"></div><div class="board"><div class="map"><i class="terrain t1"></i><i class="terrain t2"></i><i class="terrain t3"></i><i class="terrain t4"></i></div><canvas id="c"></canvas></div><div class="notes"><div class="notes-head"><b>📝 NOTAS — <span id="phaseName"></span></b><span class="hint">Se incluyen en la captura de esta fase</span></div><textarea id="notes" placeholder="Escribe aquí las notas de la fase..."></textarea><div class="trash">🗑️ ZONA DE ELIMINACIÓN — arrastra un objeto seleccionado aquí para eliminarlo</div></div><p class="small">Cada fase es una copia editable independiente. Guardar una fase no cambia el tablero actual.</p></div><div id="modal"></div><script>const phases=['despliegue','turno1','turno2','turno3','turno4'],labels={despliegue:'DESPLIEGUE',turno1:'TURNO 1',turno2:'TURNO 2',turno3:'TURNO 3',turno4:'TURNO 4'};let phase='despliegue',tool='select',objects=[],history=[],future=[],selected=null,down=false,start=null,preview=null,pendingToken=28,pendingIcon='🎯',color='#e76627',opacity=1;let data=JSON.parse(localStorage.getItem('ktPhaseTest')||'null')||{phases:{},notes:{}};const c=document.getElementById('c'),x=c.getContext('2d');function resize(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);draw()}window.addEventListener('resize',resize);function norm(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}function saveHistory(){history.push(JSON.stringify(objects));if(history.length>50)history.shift();future=[]}function draw(){const w=c.clientWidth,h=c.clientHeight;x.clearRect(0,0,w,h);objects.forEach(o=>drawObj(o,w,h));if(preview&&start&&(tool==='tempRuler'))drawObj({t:'ruler',x1:start.x,y1:start.y,x2:preview.x,y2:preview.y,a:.75,col:color},w,h);if(selected){x.save();x.strokeStyle='#fff';x.setLineDash([5,4]);x.lineWidth=2;const b=bounds(selected,w,h);x.strokeRect(b.x-6,b.y-6,b.w+12,b.h+12);x.restore()}}function drawObj(o,w,h){x.save();x.globalAlpha=o.a??1;x.strokeStyle=o.col||color;x.fillStyle=o.col||color;x.lineWidth=o.lw||4;x.lineCap='round';if(o.t==='line'||o.t==='arrow'||o.t==='ruler'){x.beginPath();x.moveTo(o.x1*w,o.y1*h);x.lineTo(o.x2*w,o.y2*h);x.stroke();if(o.t==='arrow'){const q=Math.atan2((o.y2-o.y1)*h,(o.x2-o.x1)*w);x.beginPath();x.moveTo(o.x2*w,o.y2*h);x.lineTo(o.x2*w-18*Math.cos(q-.5),o.y2*h-18*Math.sin(q-.5));x.lineTo(o.x2*w-18*Math.cos(q+.5),o.y2*h-18*Math.sin(q+.5));x.fill()}if(o.t==='ruler'){x.font='bold 16px Arial';x.fillStyle='#111';x.fillText((Math.round(Math.hypot((o.x2-o.x1)*30,(o.y2-o.y1)*22)*4)/4)+'"',((o.x1+o.x2)/2)*w,((o.y1+o.y2)/2)*h-8)}}else if(o.t==='free'){x.beginPath();o.pts.forEach((p,i)=>i?x.lineTo(p.x*w,p.y*h):x.moveTo(p.x*w,p.y*h));x.stroke()}else if(o.t==='rect')x.strokeRect(o.x*w,o.y*h,o.w*w,o.h*h);else if(o.t==='circle'){x.beginPath();x.ellipse(o.x*w,o.y*h,o.rx*w,o.ry*h,0,0,Math.PI*2);x.stroke()}else if(o.t==='token'){x.beginPath();x.arc(o.x*w,o.y*h,o.r,0,Math.PI*2);x.fill();x.strokeStyle='#fff';x.stroke();x.fillStyle='#fff';x.font='bold '+Math.max(10,o.r*.45)+'px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(o.mm,o.x*w,o.y*h)}else if(o.t==='icon'){x.font=o.size+'px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(o.icon,o.x*w,o.y*h)}else if(o.t==='text'){x.font='bold '+o.size+'px Arial';x.fillText(o.text,o.x*w,o.y*h)}x.restore()}function bounds(o,w,h){if(['line','arrow','ruler'].includes(o.t))return{x:Math.min(o.x1,o.x2)*w,y:Math.min(o.y1,o.y2)*h,w:Math.abs(o.x2-o.x1)*w||10,h:Math.abs(o.y2-o.y1)*h||10};if(o.t==='token')return{x:o.x*w-o.r,y:o.y*h-o.r,w:o.r*2,h:o.r*2};if(o.t==='icon')return{x:o.x*w-o.size/2,y:o.y*h-o.size/2,w:o.size,h:o.size};if(o.t==='text')return{x:o.x*w,y:o.y*h-o.size,w:o.size*o.text.length*.6,h:o.size};if(o.t==='rect')return{x:o.x*w,y:o.y*h,w:o.w*w,h:o.h*h};return{x:(o.x-o.rx)*w,y:(o.y-o.ry)*h,w:o.rx*2*w,h:o.ry*2*h}}function hit(p){const w=c.clientWidth,h=c.clientHeight;for(let i=objects.length-1;i>=0;i--){const b=bounds(objects[i],w,h);if(p.x*w>=b.x-10&&p.x*w<=b.x+b.w+10&&p.y*h>=b.y-10&&p.y*h<=b.y+b.h+10)return objects[i]}return null}function move(o,dx,dy){if(['line','arrow','ruler'].includes(o.t)){o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}else{o.x+=dx;o.y+=dy}}c.onpointerdown=e=>{const p=norm(e);if(tool==='select'){selected=hit(p);if(selected){saveHistory();start=p;down=true}draw();return}if(tool==='text'){const txt=prompt('Texto:');if(txt){saveHistory();objects.push({t:'text',x:p.x,y:p.y,text:txt,size:20,col:color,a:opacity});draw()}return}down=true;start=p;preview=p};c.onpointermove=e=>{const p=norm(e);if(!down)return;if(tool==='select'&&selected){move(selected,p.x-start.x,p.y-start.y);start=p;draw();return}preview=p;draw()};c.onpointerup=e=>{const p=norm(e);if(!down)return;down=false;if(tool==='select'){selected=null;draw();return}saveHistory();if(tool==='pen'){objects.push({t:'free',pts:[start,p],col:color,lw:4,a:opacity})}else if(['line','arrow','ruler','tempRuler'].includes(tool)){if(tool!=='tempRuler')objects.push({t:tool==='tempRuler'?'ruler':tool,x1:start.x,y1:start.y,x2:p.x,y2:p.y,col:color,lw:3,a:opacity});}else if(tool==='rect')objects.push({t:'rect',x:start.x,y:start.y,w:p.x-start.x,h:p.y-start.y,col:color,lw:3,a:opacity});else if(tool==='circle')objects.push({t:'circle',x:start.x,y:start.y,rx:Math.abs(p.x-start.x),ry:Math.abs(p.y-start.y),col:color,lw:3,a:opacity});else if(tool==='token')objects.push({t:'token',x:p.x,y:p.y,r:Math.max(8,pendingToken/1.7),mm:pendingToken,col:color,a:opacity});else if(tool==='icon')objects.push({t:'icon',x:p.x,y:p.y,size:pendingIconSize,icon:pendingIcon,col:color,a:opacity});preview=null;draw()};function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));status(t==='select'?'ARRASTRAR / SELECCIONAR':t.toUpperCase())}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));function undo(){if(!history.length)return;future.push(JSON.stringify(objects));objects=JSON.parse(history.pop());selected=null;draw()}function redo(){if(!future.length)return;history.push(JSON.stringify(objects));objects=JSON.parse(future.pop());draw()}function removeSelected(){if(!selected)return;saveHistory();objects.splice(objects.indexOf(selected),1);selected=null;draw()}function saveNotes(){data.notes[phase]=document.getElementById('notes').value;localStorage.setItem('ktPhaseTest',JSON.stringify(data))}function snapshot(){return JSON.parse(JSON.stringify(objects))}function loadPhase(p){saveNotes();phase=p;objects=data.phases[p]?JSON.parse(JSON.stringify(data.phases[p].objects)):[];selected=null;history=[];future=[];document.getElementById('notes').value=data.notes[p]||'';renderPhase();setTool('select');draw();status('Editando '+labels[p])}function savePhase(){saveNotes();data.phases[phase]={objects:snapshot(),savedAt:new Date().toISOString()};localStorage.setItem('ktPhaseTest',JSON.stringify(data));renderPhase();closeModal();status(labels[phase]+' guardado — puedes seguir trabajando') }function renderPhase(){document.getElementById('phaseName').textContent=labels[phase];document.getElementById('phases').innerHTML=phases.map(p=>`<button class="phase ${p===phase?'active':''}" onclick="loadPhase('${p}')">${labels[p]} ${data.phases[p]?'✓':''}</button>`).join('')}function openSave(){openModal(`<h2>📸 Guardar fase</h2><p>Se guarda una copia editable independiente. El tablero actual no cambia.</p><div class="phases">${phases.map(p=>`<button class="phase ${p===phase?'active':''}" onclick="phase='${p}';renderPhase()">${labels[p]}</button>`).join('')}</div><button class="button primary" onclick="savePhase()">GUARDAR / SOBRESCRIBIR</button> <button class="button" onclick="closeModal()">CANCELAR</button>`)}function openPhases(){openModal(`<h2>FASES GUARDADAS</h2>${phases.map(p=>`<div class="saved"><b>${labels[p]}</b> — ${data.phases[p]?'guardada':'sin guardar'} <button class="button" ${data.phases[p]?'':'disabled'} onclick="closeModal();loadPhase('${p}')">ABRIR Y EDITAR</button></div>`).join('')}<button class="button" onclick="closeModal()">CERRAR</button>`)}function openModal(html){document.getElementById('modal').innerHTML=`<div class="modal"><div class="modalbox"><button class="button close" onclick="closeModal()">×</button>${html}</div></div>`}function closeModal(){document.getElementById('modal').innerHTML=''}function tokenMenu(){openModal(`<h2>🔵 FICHA</h2><p>28 mm por defecto.</p><div class="palette">${[25,28,32,40].map(n=>`<button class="button" onclick="pendingToken=${n};closeModal();setTool('token')">${n} mm</button>`).join('')}<button class="button" onclick="customToken()">Personalizado</button></div>`)}function customToken(){const n=parseFloat(prompt('Tamaño de peana en mm',28));if(n>0){pendingToken=n;closeModal();setTool('token')}}let pendingIconSize=42;function iconMenu(){const icons=['🪜','〰️','💨','💣','🧱','🔥','☠️','☢️','⚡','🔫','✝️','⚠️','🎯','🛡️','👣','💥'];openModal(`<h2>🧩 ICONOS</h2><div class="palette">${icons.map(i=>`<button class="button" onclick="pendingIcon='${i}';closeModal();setTool('icon')">${i}</button>`).join('')}</div><div class="row">Tamaño <input id="isize" type="range" min="18" max="120" value="42" oninput="pendingIconSize=this.value"></div>`)}function styleMenu(){if(!selected){status('Selecciona primero un objeto con ✋');return}openModal(`<h2>🎨 Estilo</h2><div class="row">Color <input id="col" type="color" value="${selected.col||color}"></div><div class="row">Opacidad <input id="opa" type="range" min="0" max="100" value="${Math.round((selected.a??1)*100)}"></div><button class="button primary" onclick="selected.col=document.getElementById('col').value;selected.a=document.getElementById('opa').value/100;closeModal();draw()">APLICAR</button>`)}document.getElementById('notes').addEventListener('input',saveNotes);renderPhase();resize();setTool('select');status('Listo — ahora sí: arrastra objetos y prueba todas las herramientas');</script></body></html>
