<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion · Battle Board</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0e10;color:#eee;font:14px Arial,sans-serif}.top{padding:14px 18px;background:#151a1d;border-bottom:1px solid #333;font-weight:bold}.wrap{max-width:1300px;margin:auto;padding:14px}.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.btn,.phase{background:#20272b;color:#eee;border:1px solid #465056;border-radius:5px;padding:8px 10px;cursor:pointer}.btn:hover,.phase:hover{background:#30383d}.active,.primary{background:#d85b18!important;border-color:#f07a38!important}.status{float:right;color:#aaa;font-weight:normal}.phases{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.board{width:100%;aspect-ratio:30/22;background:#85857d;border:4px solid #26292b;touch-action:none}.board canvas{width:100%;height:100%;display:block}.notes{margin-top:9px;background:#151a1d;border:1px solid #333;padding:12px}.notes textarea{width:100%;min-height:90px;margin-top:8px;background:#0e1214;color:#eee;border:1px solid #465056;padding:10px;resize:vertical}.trash{margin-top:8px;border:1px dashed #a24a4a;padding:10px;text-align:center;color:#e4b0b0}.hint,.small{color:#aaa;font-size:12px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20}.box{background:#171d20;border:1px solid #4a5358;border-radius:8px;padding:18px;min-width:360px;max-width:94vw;max-height:90vh;overflow:auto}.box h2{margin:0 0 12px}.saved{border:1px solid #343d42;background:#101518;padding:10px;margin:7px 0;border-radius:5px}.row{display:flex;align-items:center;gap:10px;margin:12px 0}.row label{min-width:100px}.row input[type=range]{flex:1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.grid .btn{font-size:20px}.swatches{display:flex;gap:7px;flex-wrap:wrap}.swatch{width:32px;height:32px;border-radius:50%;border:2px solid #fff;cursor:pointer}.close{float:right}@media(max-width:700px){.status{float:none;display:block;margin-top:5px}.box{min-width:0;width:94vw}}
</style></head><body>
<div class="top">⚔ KILL TEAM COMPANION · ALPHA · BATTLE BOARD <span id="status" class="status"></span></div>
<div class="wrap"><div class="toolbar">
<button class="btn active" data-tool="select">✋ Arrastrar</button><button class="btn" data-tool="pen">✎ Lápiz</button><button class="btn" data-tool="line">╱ Línea</button><button class="btn" data-tool="arrow">➜ Flecha</button><button class="btn" data-tool="rect">□ Área</button><button class="btn" data-tool="circle">○ Círculo</button><button class="btn" data-tool="text">T Texto</button><button class="btn" id="tokenBtn">🔵 Ficha</button><button class="btn" id="iconBtn">🧩 Iconos</button><button class="btn" data-tool="temp">📏 Regla</button><button class="btn" data-tool="ruler">📐 Medidor</button><button class="btn" id="styleBtn">🎨 Estilo</button><button class="btn" id="undoBtn">↶</button><button class="btn" id="redoBtn">↷</button><button class="btn" id="deleteBtn">🗑 Eliminar</button><button class="btn primary" id="savePhaseBtn">📸 Guardar fase</button><button class="btn primary" id="saveMatrixBtn">💾 Guardar matriz</button><button class="btn" id="matricesBtn">📂 Matrices guardadas</button>
</div><div class="phases" id="phases"></div><div class="board"><canvas id="canvas"></canvas></div><div class="notes"><b>📝 NOTAS · <span id="phaseTitle"></span></b><span class="hint"> · se guardan con la fase</span><textarea id="notes" placeholder="Notas a pie de página..."></textarea><div class="trash" id="trash">🗑️ ZONA DE ELIMINACIÓN · arrastra aquí el objeto seleccionado</div></div><p class="small">Guardar una fase crea una copia independiente. Guardar matriz reúne las fases guardadas.</p></div><div id="modal"></div>
<script>
'use strict';
const PH=['despliegue','turno1','turno2','turno3','turno4'],LAB={despliegue:'DESPLIEGUE',turno1:'TURNO 1',turno2:'TURNO 2',turno3:'TURNO 3',turno4:'TURNO 4'};const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
let phase='despliegue',tool='select',objects=[],selected=null,drag=false,start=null,last=null,preview=null,undo=[],redo=[];let tokenSize=28,icon='🎯',iconSize=42,color='#e76627',opacity=1;let state=read('ktPhaseTest',{phases:{},notes:{}}),matrices=read('ktMatrices',[]),currentMatrixId=null;const c=$('canvas'),ctx=c.getContext('2d');
function status(s){$('status').textContent=s}function resize(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}function push(){undo.push(clone(objects));if(undo.length>60)undo.shift();redo=[]}function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));status(t==='select'?'Arrastrar / seleccionar':t==='temp'?'Regla temporal':t)}
function draw(){let w=c.clientWidth,h=c.clientHeight;if(!w)return;ctx.clearRect(0,0,w,h);ctx.fillStyle='#85857d';ctx.fillRect(0,0,w,h);ctx.strokeStyle='rgba(30,30,30,.15)';ctx.lineWidth=1;for(let i=1;i<30;i++){ctx.beginPath();ctx.moveTo(w*i/30,0);ctx.lineTo(w*i/30,h);ctx.stroke()}for(let i=1;i<22;i++){ctx.beginPath();ctx.moveTo(0,h*i/22);ctx.lineTo(w,h*i/22);ctx.stroke()}ctx.fillStyle='#454741';[[.08,.1,.23,.15],[.52,.16,.16,.3],[.25,.64,.19,.16],[.72,.68,.15,.23]].forEach(a=>ctx.fillRect(a[0]*w,a[1]*h,a[2]*w,a[3]*h));objects.forEach(o=>paint(o,w,h));if(preview&&start&&tool==='temp')paint({type:'ruler',x1:start.x,y1:start.y,x2:preview.x,y2:preview.y,col:color,a:.65},w,h);if(selected){let b=bounds(selected,w,h);ctx.save();ctx.strokeStyle='#fff';ctx.setLineDash([5,4]);ctx.strokeRect(b.x-6,b.y-6,b.w+12,b.h+12);ctx.restore()}}
function paint(o,w,h){ctx.save();ctx.globalAlpha=o.a??1;ctx.strokeStyle=o.col||color;ctx.fillStyle=o.col||color;ctx.lineWidth=o.lw||3;ctx.lineCap='round';if(['line','arrow','ruler'].includes(o.type)){ctx.beginPath();ctx.moveTo(o.x1*w,o.y1*h);ctx.lineTo(o.x2*w,o.y2*h);ctx.stroke();if(o.type==='arrow'){let q=Math.atan2((o.y2-o.y1)*h,(o.x2-o.x1)*w);ctx.beginPath();ctx.moveTo(o.x2*w,o.y2*h);ctx.lineTo(o.x2*w-16*Math.cos(q-.5),o.y2*h-16*Math.sin(q-.5));ctx.lineTo(o.x2*w-16*Math.cos(q+.5),o.y2*h-16*Math.sin(q+.5));ctx.fill()}if(o.type==='ruler'){ctx.fillStyle='#111';ctx.font='bold 15px Arial';ctx.fillText(dist(o)+'"',((o.x1+o.x2)/2)*w,((o.y1+o.y2)/2)*h-7)}}else if(o.type==='pen'){ctx.beginPath();o.pts.forEach((p,i)=>i?ctx.lineTo(p.x*w,p.y*h):ctx.moveTo(p.x*w,p.y*h));ctx.stroke()}else if(o.type==='rect'){ctx.strokeRect(o.x*w,o.y*h,o.w*w,o.h*h)}else if(o.type==='circle'){ctx.beginPath();ctx.ellipse(o.x*w,o.y*h,o.rx*w,o.ry*h,0,0,Math.PI*2);ctx.stroke()}else if(o.type==='token'){ctx.beginPath();ctx.arc(o.x*w,o.y*h,o.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold '+Math.max(10,o.r*.45)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.mm,o.x*w,o.y*h)}else if(o.type==='icon'){ctx.font=o.size+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.icon,o.x*w,o.y*h)}else if(o.type==='text'){ctx.font='bold '+o.size+'px Arial';ctx.fillText(o.text,o.x*w,o.y*h)}ctx.restore()}function dist(o){return(Math.round(Math.hypot((o.x2-o.x1)*30,(o.y2-o.y1)*22)*4)/4).toFixed(2)}function bounds(o,w,h){if(['line','arrow','ruler'].includes(o.type))return{x:Math.min(o.x1,o.x2)*w,y:Math.min(o.y1,o.y2)*h,w:Math.max(10,Math.abs(o.x2-o.x1)*w),h:Math.max(10,Math.abs(o.y2-o.y1)*h)};if(o.type==='token')return{x:o.x*w-o.r,y:o.y*h-o.r,w:o.r*2,h:o.r*2};if(o.type==='icon')return{x:o.x*w-o.size/2,y:o.y*h-o.size/2,w:o.size,h:o.size};if(o.type==='text')return{x:o.x*w,y:o.y*h-o.size,w:Math.max(15,o.text.length*o.size*.6),h:o.size};if(o.type==='rect')return{x:o.x*w,y:o.y*h,w:o.w*w,h:o.h*h};if(o.type==='circle')return{x:(o.x-o.rx)*w,y:(o.y-o.ry)*h,w:o.rx*2*w,h:o.ry*2*h};return{x:0,y:0,w:0,h:0}}function hit(p){let w=c.clientWidth,h=c.clientHeight;for(let i=objects.length-1;i>=0;i--){let b=bounds(objects[i],w,h);if(p.x*w>=b.x-10&&p.x*w<=b.x+b.w+10&&p.y*h>=b.y-10&&p.y*h<=b.y+b.h+10)return objects[i]}return null}function move(o,dx,dy){if(['line','arrow','ruler'].includes(o.type)){o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}else if(o.type==='pen')o.pts.forEach(p=>{p.x+=dx;p.y+=dy});else{o.x+=dx;o.y+=dy}}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);let p=pos(e);if(tool==='select'){selected=hit(p);if(selected){push();drag=true;last=p}draw();return}if(tool==='text'){let t=prompt('Texto:');if(t){push();objects.push({type:'text',x:p.x,y:p.y,text:t,size:20,col:color,a:opacity});draw()}return}drag=true;start=p;last=p;preview=p;if(tool==='pen'){push();objects.push({type:'pen',pts:[p],col:color,a:opacity})}});c.addEventListener('pointermove',e=>{if(!drag)return;let p=pos(e);if(tool==='select'&&selected){move(selected,p.x-last.x,p.y-last.y);last=p;draw();return}if(tool==='pen'){objects.at(-1).pts.push(p);draw();return}preview=p;draw()});c.addEventListener('pointerup',e=>{if(!drag)return;let p=pos(e);drag=false;if(tool==='select'){if(selected){let r=$('trash').getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){objects.splice(objects.indexOf(selected),1);selected=null;status('Objeto eliminado')}}draw();return}if(tool==='pen'||tool==='temp'){preview=null;draw();return}if(['line','arrow','ruler'].includes(tool))objects.push({type:tool,x1:start.x,y1:start.y,x2:p.x,y2:p.y,col:color,a:opacity});else if(tool==='rect')objects.push({type:'rect',x:start.x,y:start.y,w:p.x-start.x,h:p.y-start.y,col:color,a:opacity});else if(tool==='circle')objects.push({type:'circle',x:start.x,y:start.y,rx:Math.abs(p.x-start.x),ry:Math.abs(p.y-start.y),col:color,a:opacity});else if(tool==='token')objects.push({type:'token',x:p.x,y:p.y,r:Math.max(8,tokenSize*.65),mm:tokenSize,col:color,a:opacity});else if(tool==='icon')objects.push({type:'icon',x:p.x,y:p.y,size:iconSize,icon,col:color,a:opacity});preview=null;draw()});
function saveNotes(){state.notes[phase]=$('notes').value;write('ktPhaseTest',state)}function renderPhases(){$('phaseTitle').textContent=LAB[phase];$('phases').innerHTML='';PH.forEach(p=>{let b=document.createElement('button');b.className='phase'+(p===phase?' active':'');b.textContent=LAB[p]+(state.phases[p]?' ✓':'');b.onclick=()=>loadPhase(p);$('phases').appendChild(b)})}function loadPhase(p){saveNotes();phase=p;objects=state.phases[p]?clone(state.phases[p].objects):[];$('notes').value=state.notes[p]||'';selected=null;undo=[];redo=[];renderPhases();setTool('select');draw();status('Editando '+LAB[p])}function savePhase(){saveNotes();state.phases[phase]={objects:clone(objects),savedAt:new Date().toISOString()};write('ktPhaseTest',state);renderPhases();closeModal();status(LAB[phase]+' guardado')}
function openModal(html){$('modal').innerHTML='<div class="modal"><div class="box"><button class="btn close" onclick="closeModal()">✕</button>'+html+'</div></div>'}function closeModal(){$('modal').innerHTML=''}
$('savePhaseBtn').onclick=()=>openModal('<h2>📸 Guardar fase</h2><p>Se guarda una copia independiente y el tablero actual no cambia.</p><div class="phases">'+PH.map(p=>'<button class="phase '+(p===phase?'active':'')+'" onclick="phase=\''+p+'\';renderPhases()">'+LAB[p]+'</button>').join('')+'</div><button class="btn primary" onclick="savePhase()">GUARDAR / SOBRESCRIBIR</button> <button class="btn" onclick="closeModal()">CANCELAR</button>');
$('styleBtn').onclick=()=>{if(!selected){openModal('<h2>🎨 Estilo</h2><p>Selecciona un objeto con ✋ y después pulsa Estilo.</p><button class="btn" onclick="closeModal()">OK</button>');return}openModal('<h2>🎨 Estilo del objeto</h2><div class="row"><label>Color</label><input id="styleColor" type="color" value="'+(selected.col||color)+'"></div><div class="swatches">'+['#e76627','#ffffff','#39a0ff','#36c96f','#e84b4b','#ffd23f','#b36cff','#000000'].map(cc=>'<button class="swatch" style="background:'+cc+'" onclick="$(\'styleColor\').value=\''+cc+'\'"></button>').join('')+'</div><div class="row"><label>Opacidad <span id="opVal">'+Math.round((selected.a??1)*100)+'%</span></label><input id="styleOpacity" type="range" min="0" max="100" value="'+Math.round((selected.a??1)*100)+'" oninput="$(\'opVal\').textContent=this.value+\'%\'"></div><div class="row"><label>Grosor</label><input id="styleWidth" type="range" min="1" max="15" value="'+(selected.lw||3)+'"></div><button class="btn primary" onclick="applyStyle()">APLICAR</button> <button class="btn" onclick="closeModal()">CANCELAR</button>')};function applyStyle(){push();selected.col=$('styleColor').value;selected.a=+$('styleOpacity').value/100;selected.lw=+$('styleWidth').value;closeModal();draw();status('Estilo aplicado')}
$('tokenBtn').onclick=()=>openModal('<h2>🔵 Ficha</h2><p>Tamaño por defecto: 28 mm. El tamaño aparece en el centro.</p><div class="grid">'+[25,28,32,40].map(n=>'<button class="btn" onclick="tokenSize='+n+';closeModal();setTool(\'token\')">'+n+' mm</button>').join('')+'</div><div class="row"><label>Personalizado</label><input id="customToken" type="number" min="1" value="28"><button class="btn" onclick="tokenSize=Number($(\'customToken\').value);closeModal();setTool(\'token\')">Usar</button></div>');
$('iconBtn').onclick=()=>{let arr=['🪜','〰️','💨','💣','🧱','🔥','☠️','☢️','⚡','🔫','✝️','⚠️','🎯','🛡️','👣','💥'];openModal('<h2>🧩 Iconos</h2><div class="grid">'+arr.map(i=>'<button class="btn" onclick="icon=\''+i+'\';closeModal();setTool(\'icon\')">'+i+'</button>').join('')+'</div><div class="row"><label>Tamaño</label><input id="iconSize" type="range" min="18" max="120" value="42" oninput="iconSize=+this.value"></div>')};
$('undoBtn').onclick=()=>{if(!undo.length)return;redo.push(clone(objects));objects=undo.pop();selected=null;draw()};$('redoBtn').onclick=()=>{if(!redo.length)return;undo.push(clone(objects));objects=redo.pop();draw()};$('deleteBtn').onclick=()=>{if(!selected)return status('Selecciona primero un objeto');push();objects.splice(objects.indexOf(selected),1);selected=null;draw()};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));$('notes').addEventListener('input',saveNotes);
$('saveMatrixBtn').onclick=()=>{saveNotes();let name=prompt('Nombre de la matriz:','Matriz sin nombre');if(!name)return;let m={id:Date.now(),name,createdAt:new Date().toISOString(),phases:clone(state.phases),notes:clone(state.notes)};matrices.push(m);write('ktMatrices',matrices);currentMatrixId=m.id;status('Matriz guardada: '+name);alert('Matriz guardada correctamente: '+name)};
$('matricesBtn').onclick=()=>openMatrices();function openMatrices(){let html='<h2>📂 Matrices guardadas</h2>';if(!matrices.length)html+='<p>No hay matrices guardadas todavía.</p>';else matrices.slice().reverse().forEach(m=>{let n=Object.keys(m.phases||{}).length;html+='<div class="saved"><b>'+esc(m.name)+'</b><div class="small">'+n+' fase(s) guardada(s)</div><br><button class="btn primary" onclick="openMatrix('+m.id+')">ABRIR Y EDITAR</button> <button class="btn" onclick="deleteMatrix('+m.id+')">🗑 Borrar</button></div>'});html+='<button class="btn" onclick="closeModal()">CERRAR</button>';openModal(html)}function openMatrix(id){let m=matrices.find(x=>x.id===id);if(!m)return;currentMatrixId=id;state={phases:clone(m.phases||{}),notes:clone(m.notes||{})};write('ktPhaseTest',state);phase=Object.keys(state.phases)[0]||'despliegue';objects=state.phases[phase]?clone(state.phases[phase].objects):[];$('notes').value=state.notes[phase]||'';renderPhases();setTool('select');closeModal();draw();status('Matriz abierta: '+m.name)}function deleteMatrix(id){if(!confirm('¿Borrar esta matriz guardada?'))return;matrices=matrices.filter(m=>m.id!==id);write('ktMatrices',matrices);openMatrices()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
renderPhases();$('notes').value=state.notes[phase]||'';resize();setTool('select');status('Listo');
</script></body></html>
