<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion Battle Board</title><style>body{margin:0;background:#0b0e10;color:#eee;font:14px Arial}.top{padding:14px 18px;background:#151a1d;font-weight:bold}.top span{float:right;color:#aaa;font-weight:normal}.wrap{max-width:1300px;margin:auto;padding:12px}.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.btn{background:#20272b;color:#eee;border:1px solid #465056;border-radius:5px;padding:8px 10px;cursor:pointer}.btn.active,.primary{background:#d85b18;border-color:#f07a38}.phases{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.board{aspect-ratio:30/22;background:#88877e;border:4px solid #25282a;position:relative;touch-action:none}.board canvas{width:100%;height:100%;display:block}.notes{margin-top:8px;padding:10px;background:#151a1d;border:1px solid #333}.notes textarea{width:100%;min-height:80px;box-sizing:border-box;background:#0e1214;color:#eee;border:1px solid #465056;padding:8px}.trash{margin-top:8px;border:1px dashed #a44;padding:9px;text-align:center;color:#e7b0b0}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:10}.box{background:#171d20;border:1px solid #4a5358;border-radius:8px;padding:18px;min-width:340px;max-width:92vw;max-height:88vh;overflow:auto}.saved{background:#101518;border:1px solid #343d42;border-radius:5px;padding:10px;margin:7px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.row{display:flex;gap:8px;align-items:center;margin:10px 0}.row input{flex:1}.swatch{width:30px;height:30px;border:2px solid #fff;border-radius:50%;cursor:pointer}.small{color:#aaa;font-size:12px}</style></head><body><div class="top">⚔ KILL TEAM COMPANION · ALPHA · BATTLE BOARD <span id="status">Listo</span></div><div class="wrap"><div class="tools"><button class="btn active" data-tool="select">✋ Arrastrar</button><button class="btn" data-tool="pen">✎ Lápiz</button><button class="btn" data-tool="line">╱ Línea</button><button class="btn" data-tool="arrow">➜ Flecha</button><button class="btn" data-tool="rect">□ Área</button><button class="btn" data-tool="circle">○ Círculo</button><button class="btn" data-tool="text">T Texto</button><button class="btn" id="token">🔵 Ficha</button><button class="btn" id="icons">🧩 Iconos</button><button class="btn" data-tool="temp">📏 Regla</button><button class="btn" data-tool="ruler">📐 Medidor</button><button class="btn" id="style">🎨 Estilo</button><button class="btn" id="undo">↶</button><button class="btn" id="redo">↷</button><button class="btn" id="del">🗑 Eliminar</button><button class="btn primary" id="savePhase">📸 Guardar fase</button><button class="btn primary" id="saveMatrix">💾 Guardar matriz</button><button class="btn" id="openMatrices">📂 Matrices guardadas</button></div><div class="phases" id="phases"></div><div class="board"><canvas id="c"></canvas></div><div class="notes"><b>📝 NOTAS · <span id="phaseName"></span></b><textarea id="notes" placeholder="Notas a pie de página..."></textarea><div class="trash" id="trash">🗑️ ZONA DE ELIMINACIÓN · arrastra aquí el objeto</div></div></div><div id="modal"></div><script>
const P=['despliegue','turno1','turno2','turno3','turno4'],L={despliegue:'DESPLIEGUE',turno1:'TURNO 1',turno2:'TURNO 2',turno3:'TURNO 3',turno4:'TURNO 4'};const $=x=>document.getElementById(x),cp=x=>JSON.parse(JSON.stringify(x));function rd(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function wr(k,v){localStorage.setItem(k,JSON.stringify(v))}let state=rd('ktPhaseTest',{phases:{},notes:{}}),matrices=rd('ktMatrices',[]),phase='despliegue',tool='select',objs=[],sel=null,down=false,st=null,last=null,preview=null,hist=[],redoStack=[],tokenSize=28,icon='🎯',iconSize=42,color='#e76627',alpha=1;const c=$('c'),x=c.getContext('2d');
function msg(t){$('status').textContent=t}function resize(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}function saveHist(){hist.push(cp(objs));if(hist.length>50)hist.shift();redoStack=[]}function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));msg(t==='select'?'Arrastrar / seleccionar':t)}
function draw(){let w=c.clientWidth,h=c.clientHeight;x.clearRect(0,0,w,h);x.fillStyle='#88877e';x.fillRect(0,0,w,h);x.strokeStyle='rgba(0,0,0,.14)';for(let i=1;i<30;i++){x.beginPath();x.moveTo(i*w/30,0);x.lineTo(i*w/30,h);x.stroke()}for(let i=1;i<22;i++){x.beginPath();x.moveTo(0,i*h/22);x.lineTo(w,i*h/22);x.stroke()}x.fillStyle='#454741';[[.08,.1,.23,.15],[.52,.16,.16,.3],[.25,.64,.19,.16],[.72,.68,.15,.23]].forEach(a=>x.fillRect(a[0]*w,a[1]*h,a[2]*w,a[3]*h));objs.forEach(o=>paint(o,w,h));if(preview&&st&&tool==='temp')paint({t:'ruler',x1:st.x,y1:st.y,x2:preview.x,y2:preview.y,col:color,a:.6},w,h);if(sel){let b=box(sel,w,h);x.save();x.strokeStyle='#fff';x.setLineDash([5,4]);x.strokeRect(b.x-5,b.y-5,b.w+10,b.h+10);x.restore()}}
function paint(o,w,h){x.save();x.globalAlpha=o.a==null?1:o.a;x.strokeStyle=o.col||color;x.fillStyle=o.col||color;x.lineWidth=o.lw||3;x.lineCap='round';if(['line','arrow','ruler'].includes(o.t)){x.beginPath();x.moveTo(o.x1*w,o.y1*h);x.lineTo(o.x2*w,o.y2*h);x.stroke();if(o.t==='arrow'){let q=Math.atan2((o.y2-o.y1)*h,(o.x2-o.x1)*w);x.beginPath();x.moveTo(o.x2*w,o.y2*h);x.lineTo(o.x2*w-16*Math.cos(q-.5),o.y2*h-16*Math.sin(q-.5));x.lineTo(o.x2*w-16*Math.cos(q+.5),o.y2*h-16*Math.sin(q+.5));x.fill()}if(o.t==='ruler'){x.fillStyle='#111';x.font='bold 14px Arial';x.fillText(measure(o)+'"',((o.x1+o.x2)/2)*w,((o.y1+o.y2)/2)*h-7)}}else if(o.t==='pen'){x.beginPath();o.p.forEach((q,i)=>i?x.lineTo(q.x*w,q.y*h):x.moveTo(q.x*w,q.y*h));x.stroke()}else if(o.t==='rect')x.strokeRect(o.x*w,o.y*h,o.w*w,o.h*h);else if(o.t==='circle'){x.beginPath();x.ellipse(o.x*w,o.y*h,o.rx*w,o.ry*h,0,0,Math.PI*2);x.stroke()}else if(o.t==='token'){x.beginPath();x.arc(o.x*w,o.y*h,o.r,0,Math.PI*2);x.fill();x.strokeStyle='#fff';x.stroke();x.fillStyle='#fff';x.font='bold '+Math.max(10,o.r*.45)+'px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(o.mm,o.x*w,o.y*h)}else if(o.t==='icon'){x.font=o.size+'px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(o.i,o.x*w,o.y*h)}else if(o.t==='text'){x.font='bold '+o.size+'px Arial';x.fillText(o.s,o.x*w,o.y*h)}x.restore()}function measure(o){return(Math.round(Math.hypot((o.x2-o.x1)*30,(o.y2-o.y1)*22)*4)/4).toFixed(2)}function box(o,w,h){if(['line','arrow','ruler'].includes(o.t))return{x:Math.min(o.x1,o.x2)*w,y:Math.min(o.y1,o.y2)*h,w:Math.max(10,Math.abs(o.x2-o.x1)*w),h:Math.max(10,Math.abs(o.y2-o.y1)*h)};if(o.t==='token')return{x:o.x*w-o.r,y:o.y*h-o.r,w:o.r*2,h:o.r*2};if(o.t==='icon')return{x:o.x*w-o.size/2,y:o.y*h-o.size/2,w:o.size,h:o.size};if(o.t==='text')return{x:o.x*w,y:o.y*h-o.size,w:o.s.length*o.size*.6,h:o.size};if(o.t==='rect')return{x:o.x*w,y:o.y*h,w:o.w*w,h:o.h*h};if(o.t==='circle')return{x:(o.x-o.rx)*w,y:(o.y-o.ry)*h,w:o.rx*2*w,h:o.ry*2*h};return{x:0,y:0,w:0,h:0}}function hit(p){let w=c.clientWidth,h=c.clientHeight;for(let i=objs.length-1;i>=0;i--){let b=box(objs[i],w,h);if(p.x*w>=b.x-8&&p.x*w<=b.x+b.w+8&&p.y*h>=b.y-8&&p.y*h<=b.y+b.h+8)return objs[i]}return null}function move(o,dx,dy){if(['line','arrow','ruler'].includes(o.t)){o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}else if(o.t==='pen')o.p.forEach(q=>{q.x+=dx;q.y+=dy});else{o.x+=dx;o.y+=dy}}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);let p=point(e);if(tool==='select'){sel=hit(p);if(sel){saveHist();down=true;last=p}draw();return}if(tool==='text'){let s=prompt('Texto:');if(s){saveHist();objs.push({t:'text',x:p.x,y:p.y,s,size:20,col:color,a:alpha});draw()}return}down=true;st=p;last=p;preview=p;if(tool==='pen'){saveHist();objs.push({t:'pen',p:[p],col:color,a:alpha})}});c.addEventListener('pointermove',e=>{if(!down)return;let p=point(e);if(tool==='select'&&sel){move(sel,p.x-last.x,p.y-last.y);last=p;draw();return}if(tool==='pen'){objs[objs.length-1].p.push(p);draw();return}preview=p;draw()});c.addEventListener('pointerup',e=>{if(!down)return;let p=point(e);down=false;if(tool==='select'){if(sel){let r=$('trash').getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){objs.splice(objs.indexOf(sel),1);sel=null}}draw();return}if(tool==='pen'||tool==='temp'){preview=null;draw();return}saveHist();if(['line','arrow','ruler'].includes(tool))objs.push({t:tool,x1:st.x,y1:st.y,x2:p.x,y2:p.y,col:color,a:alpha});else if(tool==='rect')objs.push({t:'rect',x:st.x,y:st.y,w:p.x-st.x,h:p.y-st.y,col:color,a:alpha});else if(tool==='circle')objs.push({t:'circle',x:st.x,y:st.y,rx:Math.abs(p.x-st.x),ry:Math.abs(p.y-st.y),col:color,a:alpha});else if(tool==='token')objs.push({t:'token',x:p.x,y:p.y,r:Math.max(8,tokenSize*.65),mm:tokenSize,col:color,a:alpha});else if(tool==='icon')objs.push({t:'icon',x:p.x,y:p.y,size:iconSize,i:icon,col:color,a:alpha});preview=null;draw()});
function render(){ $('phaseName').textContent=L[phase];$('phases').innerHTML='';P.forEach(p=>{let b=document.createElement('button');b.className='btn'+(p===phase?' active':'');b.textContent=L[p]+(state.phases[p]?' ✓':'');b.onclick=()=>loadPhase(p);$('phases').appendChild(b)})}function saveNotes(){state.notes[phase]=$('notes').value;wr('ktPhaseTest',state)}function loadPhase(p){saveNotes();phase=p;objs=state.phases[p]?cp(state.phases[p].objects):[];$('notes').value=state.notes[p]||'';sel=null;hist=[];redoStack=[];render();setTool('select');draw()}function modal(html){$('modal').innerHTML='<div class="modal"><div class="box">'+html+'<br><button class="btn" onclick="closeModal()">CERRAR</button></div></div>'}function closeModal(){$('modal').innerHTML=''}
$('savePhase').onclick=()=>{let html='<h2>📸 Guardar fase</h2><p>La copia queda independiente y el tablero actual no cambia.</p><div class="phases">';P.forEach(p=>html+='<button class="btn'+(p===phase?' active':'')+'" data-p="'+p+'">'+L[p]+'</button>');html+='</div><button class="btn primary" id="confirmPhase">GUARDAR / SOBRESCRIBIR</button>';modal(html);document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{phase=b.dataset.p;render();document.querySelectorAll('[data-p]').forEach(q=>q.classList.toggle('active',q===b))});$('confirmPhase').onclick=()=>{saveNotes();state.phases[phase]={objects:cp(objs),savedAt:new Date().toISOString()};wr('ktPhaseTest',state);render();closeModal();msg(L[phase]+' guardado')}};
$('saveMatrix').onclick=()=>{saveNotes();let n=prompt('Nombre de la matriz:','Matriz sin nombre');if(!n)return;let m={id:Date.now(),name:n,phases:cp(state.phases),notes:cp(state.notes),savedAt:new Date().toISOString()};matrices.push(m);wr('ktMatrices',matrices);msg('Matriz guardada: '+n);alert('Matriz guardada correctamente.')};
$('openMatrices').onclick=function(){matrices=rd('ktMatrices',[]);let html='<h2>📂 MATRICES GUARDADAS</h2>';if(!matrices.length)html+='<p>No hay matrices guardadas todavía.</p>';matrices.slice().reverse().forEach(m=>{html+='<div class="saved"><b>'+safe(m.name)+'</b><div class="small">'+Object.keys(m.phases||{}).length+' fase(s)</div><br><button class="btn primary" data-open="'+m.id+'">ABRIR Y EDITAR</button> <button class="btn" data-remove="'+m.id+'">🗑 Borrar</button></div>'});modal(html);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openMatrix(Number(b.dataset.open)));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeMatrix(Number(b.dataset.remove)))};
function openMatrix(id){let m=matrices.find(q=>q.id===id);if(!m)return;state={phases:cp(m.phases||{}),notes:cp(m.notes||{})};wr('ktPhaseTest',state);phase='despliegue';objs=state.phases[phase]?cp(state.phases[phase].objects):[];$('notes').value=state.notes[phase]||'';render();closeModal();draw();msg('Matriz abierta: '+m.name)}function removeMatrix(id){if(!confirm('¿Borrar esta matriz?'))return;matrices=matrices.filter(q=>q.id!==id);wr('ktMatrices',matrices);$('openMatrices').click()}function safe(s){return String(s).replace(/[&<>"']/g,q=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[q]))}
$('style').onclick=()=>{if(!sel){modal('<h2>🎨 Estilo</h2><p>Selecciona primero un objeto con ✋.</p>');return}let html='<h2>🎨 Estilo</h2><div class="row">Color <input id="col" type="color" value="'+(sel.col||color)+'"></div><div class="row">Opacidad <input id="opa" type="range" min="0" max="100" value="'+Math.round((sel.a==null?1:sel.a)*100)+'"></div><div class="row">Grosor <input id="lw" type="range" min="1" max="15" value="'+(sel.lw||3)+'"></div><button class="btn primary" id="apply">APLICAR</button>';modal(html);$('apply').onclick=()=>{sel.col=$('col').value;sel.a=Number($('opa').value)/100;sel.lw=Number($('lw').value);closeModal();draw()}};
$('token').onclick=()=>{let h='<h2>🔵 Ficha</h2><div class="grid">';[25,28,32,40].forEach(n=>h+='<button class="btn" data-ts="'+n+'">'+n+' mm</button>');h+='</div><div class="row">Personalizada <input id="ts" type="number" value="28"><button class="btn" id="useTs">Usar</button></div>';modal(h);document.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>{tokenSize=Number(b.dataset.ts);closeModal();setTool('token')});$('useTs').onclick=()=>{tokenSize=Number($('ts').value)||28;closeModal();setTool('token')}};
$('icons').onclick=()=>{let a=['🪜','〰️','💨','💣','🧱','🔥','☠️','☢️','⚡','🔫','✝️','⚠️','🎯','🛡️','👣','💥'];let h='<h2>🧩 Iconos</h2><div class="grid">';a.forEach(i=>h+='<button class="btn" data-i="'+i+'">'+i+'</button>');h+='</div><div class="row">Tamaño <input id="isz" type="range" min="18" max="120" value="42"></div>';modal(h);document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{icon=b.dataset.i;iconSize=Number($('isz').value);closeModal();setTool('icon')})};
$('undo').onclick=()=>{if(hist.length){redoStack.push(cp(objs));objs=hist.pop();draw()}};$('redo').onclick=()=>{if(redoStack.length){hist.push(cp(objs));objs=redoStack.pop();draw()}};$('del').onclick=()=>{if(sel){saveHist();objs.splice(objs.indexOf(sel),1);sel=null;draw()}};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));$('notes').oninput=saveNotes;render();$('notes').value=state.notes[phase]||'';resize();setTool('select');
</script></body></html>
