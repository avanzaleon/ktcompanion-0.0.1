<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion · PDF Equipos</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#18202b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.editor{max-width:900px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #d5dbe3;border-radius:16px;padding:14px;margin-bottom:12px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls div.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:800;color:#687384;margin-bottom:4px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;border:1px solid #cbd3de;border-radius:9px;padding:9px;background:#fff}textarea{min-height:65px;resize:vertical}button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#172333;color:#fff}.secondary{background:#e8edf3;color:#18202b}.sheet{background:white;width:210mm;min-height:297mm;margin:15px auto;padding:12mm;box-shadow:0 5px 25px #0002}.sheet h1{font-size:21px;margin:0}.sheet h2{font-size:13px;margin:13px 0 6px}.meta{font-size:9px;color:#687384;margin-top:3px}.intro{font-size:9px;line-height:1.4;margin-top:8px}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.role{border:1px solid #cfd6df;border-radius:7px;padding:6px;font-size:8px}.role b{font-size:10px}.option{border:1px solid #cfd6df;border-radius:7px;padding:6px;margin:5px 0;break-inside:avoid}.option.best{border:1.5px solid #172333}.oh{display:flex;justify-content:space-between;font-size:9px;font-weight:800}.pairs{display:grid;grid-template-columns:1fr 52px 1fr;gap:3px;margin-top:4px}.pair{font-size:8px;padding:3px;background:#f4f6f8;border-radius:4px}.pct{text-align:center;font-weight:900}.note{font-size:8px;line-height:1.35;margin-top:8px}.page2{break-before:page}.back{margin-bottom:10px}@media(max-width:700px){.controls{grid-template-columns:1fr}.sheet{width:100%;min-height:auto;padding:7mm;box-shadow:none}.roles{grid-template-columns:1fr}.pairs{grid-template-columns:1fr 45px 1fr}}@media print{body{background:#fff}.editor{display:none}.sheet{margin:0;width:210mm;min-height:297mm;box-shadow:none}.sheet+.sheet{break-before:page}@page{size:A4;margin:0}}</style></head><body><div class="editor"><div class="panel"><div class="back"><button class="secondary" onclick="history.back()">← Volver</button></div><h2 style="margin:0 0 8px">🖨️ Editor de hoja de emparejamientos</h2><div class="controls"><div><label>Título</label><input id="title" value="Calculadora de Equipos · Espada y Escudo"></div><div><label>Subtítulo</label><input id="subtitle" value="Plan de emparejamientos"></div><div><label>Opciones a imprimir</label><select id="count"><option value="3">3</option><option value="5" selected>5</option><option value="8">8</option></select></div><div><label>Modo</label><select id="mode"><option>Equilibrio + ventaja</option><option>Máximo equilibrio</option><option>Maximizar victorias esperadas</option><option>Evitar malos enfrentamientos</option></select></div><div class="full"><label>Notas para el torneo</label><textarea id="notes">Usar esta hoja como referencia rápida. Los porcentajes son estimaciones estadísticas y no sustituyen la valoración del jugador.</textarea></div></div><div style="display:flex;gap:8px;margin-top:10px"><button class="primary" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button><button class="secondary" onclick="loadSample()">Cargar ejemplo</button></div><div style="font-size:11px;color:#687384;margin-top:8px">En iPhone: pulsa Imprimir y, en la vista previa, amplía con dos dedos para abrir el PDF y guardarlo/compartirlo.</div></div></div><div id="pages"></div><script>
const sample={title:'Calculadora de Equipos · Espada y Escudo',subtitle:'Ejemplo de planificación',mode:'Equilibrio + ventaja',notes:'Hoja de referencia rápida para la ronda.',teamsA:['Raveners','Legionaries','Hernkyn Yaegirs','Kommandos'],teamsB:['Wolf Scouts','Fellgor Ravagers','Plague Marines','Hierotek Circle'],namesA:['1','2','3','4'],namesB:['A','B','C','D'],roles:['Escudo','Espada 1','Espada 2'],roleNames:['Jugador 3','Jugador 1','Jugador 4'],roleTeams:['Hernkyn Yaegirs','Raveners','Kommandos'],options:[[[0,3,55],[1,0,49],[2,1,54],[3,2,57]],[[0,0,52],[1,2,58],[2,3,50],[3,1,45]],[[0,1,61],[1,3,63],[2,0,51],[3,2,57]],[[0,3,55],[1,1,49],[2,2,53],[3,0,64]],[[0,2,48],[1,0,55],[2,1,54],[3,3,50]]],scores:[96,92,90,88,85],avg:[53.8,51.2,52.7,55.2,51.8]};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function get(){try{let x=JSON.parse(localStorage.getItem('ktc_equipo_pdf'));return x&&x.options?x:sample}catch(e){return sample}}function render(){let d=get();$('title').value=d.title||sample.title;$('subtitle').value=d.subtitle||sample.subtitle;$('notes').value=d.notes||sample.notes;$('mode').value=d.mode||sample.mode;let n=Math.min(+$('count').value,d.options.length);let roles=d.roles||['Escudo','Espada 1','Espada 2'];let html='<section class="sheet"><h1>'+esc($('title').value)+'</h1><div class="meta">'+esc($('subtitle').value)+' · '+esc($('mode').value)+'</div><div class="intro">'+esc($('notes').value)+'</div><h2>Roles recomendados</h2><div class="roles">'+roles.map((r,i)=>'<div class="role"><b>'+esc(r)+'</b><br>'+esc(d.roleNames?.[i]||'—')+'<br><span>'+esc(d.roleTeams?.[i]||'')+'</span></div>').join('')+'</div><h2>Mejor combinación</h2>'+opt(d,0,true);html+='<h2>Otras opciones viables</h2>'+Array.from({length:Math.min(n-1,4)},(_,k)=>opt(d,k+1,false)).join('');html+='<div class="note"><b>Lectura rápida:</b> la opción 1 es la prioritaria según el criterio seleccionado.</div></section>';if(n>5){html+='<section class="sheet page2"><h1>'+esc($('title').value)+'</h1><div class="meta">Continuación · opciones alternativas</div><h2>Opciones adicionales</h2>'+Array.from({length:n-5},(_,k)=>opt(d,k+5,false)).join('')+'</section>'}else html+='<section class="sheet page2"><h1>Notas de la ronda</h1><div class="intro">'+esc($('notes').value)+'</div><h2>Resumen</h2><div class="note">Esta segunda hoja queda reservada para anotaciones y decisiones durante la ronda.</div></section>';$('pages').innerHTML=html}function opt(d,k,best){let o=d.options[k]||d.options[0];return '<div class="option '+(best?'best':'')+'"><div class="oh"><span>#'+(k+1)+(best?' · RECOMENDADA':'')+'</span><span>'+((d.scores?.[k]??0))+'/100 · '+((d.avg?.[k]??0).toFixed?d.avg[k].toFixed(1):d.avg[k])+'% esperado</span></div><div class="pairs">'+o.map(x=>'<div class="pair"><b>'+esc(d.namesA?.[x[0]]||String(x[0]+1))+'</b><br>'+esc(d.teamsA?.[x[0]]||'')+'</div><div class="pair pct">'+x[2]+'%</div><div class="pair" style="text-align:right"><b>'+esc(d.namesB?.[x[1]]||String.fromCharCode(65+x[1]))+'</b><br>'+esc(d.teamsB?.[x[1]]||'')+'</div>').join('')+'</div></div>'}function loadSample(){localStorage.setItem('ktc_equipo_pdf',JSON.stringify(sample));render()}document.querySelectorAll('input,textarea,select').forEach(x=>x.addEventListener('input',render));render();</script></body></html>
