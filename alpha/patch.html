<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion · Alpha</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0e10}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="pilot.html?v=20260821-2"></iframe><script>const f=document.getElementById('app');function patch(){const w=f.contentWindow,d=f.contentDocument;if(!w||!d||!w.setTool)return;d.querySelectorAll('[data-tool]').forEach(b=>{if(b.dataset.patched)return;b.dataset.patched='1';b.addEventListener('click',e=>{e.preventDefault();w.setTool(b.dataset.tool);if(w.status)w.status('Herramienta: '+b.textContent.trim())})});d.querySelectorAll('.modalbox').forEach(m=>{if(m.dataset.pdfpatched)return;if(m.querySelector('h2')?.textContent.includes('Matrices guardadas')){m.dataset.pdfpatched='1';m.querySelectorAll('.saved').forEach(card=>{const b=card.querySelector('button[onclick^="loadMatrix"]');if(!b)return;const id=b.getAttribute('onclick').match(/loadMatrix\((\d+)\)/)?.[1];if(!id)return;const pdf=document.createElement('button');pdf.className='btn';pdf.textContent='📄 PDF';pdf.style.marginLeft='6px';pdf.onclick=()=>{w.open('pdf.html?matrix='+id,'_blank')};b.parentNode.appendChild(pdf)})}})}f.addEventListener('load',()=>{setInterval(patch,300);setTimeout(patch,1000)})</script></body></html>
