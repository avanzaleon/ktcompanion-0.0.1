<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion Alpha</title><style>body{margin:0;background:#0b0e10;color:#eee;font:14px Arial}*{box-sizing:border-box}.top{padding:15px 20px;background:#151a1d;border-bottom:1px solid #333;font-weight:bold}.wrap{max-width:1200px;margin:auto;padding:16px}.btn{background:#20272b;color:#eee;border:1px solid #4a555b;border-radius:6px;padding:9px 12px;cursor:pointer}.primary,.selected{background:#d85b18!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.panel,.saved{background:#151a1d;border:1px solid #394147;border-radius:7px;padding:12px;margin:8px 0}.check{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid #343c40;border-radius:5px;margin:5px 0;background:#101518}.check input{width:18px;height:18px}.phasebar,.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.board{background:#77766e;border:4px solid #25282a;aspect-ratio:30/22}.board canvas{display:block;width:100%;height:100%;touch-action:none}.notes textarea{width:100%;min-height:75px;background:#101518;color:#eee;border:1px solid #465056;padding:8px}.small{color:#aaa;font-size:12px}.pill{display:inline-block;border:1px solid #666;border-radius:12px;padding:3px 7px;margin:2px}.danger{border:1px dashed #a44;padding:8px;text-align:center;color:#e5b0b0}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>
const A=document.getElementById('app'),PH=['despliegue','turno1','turno2','turno3','turno4'],PN={despliegue:'DESPLIEGUE',turno1:'TURNO 1',turno2:'TURNO 2',turno3:'TURNO 3',turno4:'TURNO 4'};
const STR=['Adaptive Tactics','And They Shall Know No Fear','Combat Doctrine','Indomitus'],FIR=['Adjust Doctrine','Shock Assault','Transhuman Physiology','Wrath of Vengeance'],FEQ=['Chapter Reliquaries','Purity Seals','Tilting Shields','Auspex'],UEQ=['Ammo Cache','Razor Wire','Comms Device','Mines','Light Barricade','Heavy Barricade','Ladders','Portable Barricade','Smoke Grenade','Stun Grenade','Frag Grenade','Krak Grenade','Breaching Charge'];
const OPS=['Seek And Destroy: Sweep & Clear','Seek And Destroy: Dominate','Seek And Destroy: Rout','Security: Plant Banner','Security: Martyrs','Security: Envoy'];
const O={cap:{n:'Space Marine Captain',r:'Líder',m:1,w:['Plasma Pistol','Power Fist']},ais:{n:'Assault Intercessor Sergeant',r:'Líder',m:1,w:['Heavy Bolt Pistol','Chainsword','Power Fist','Power Weapon','Thunder Hammer','Plasma Pistol']},isg:{n:'Intercessor Sergeant',r:'Líder',m:1,w:['Auto Bolt Rifle','Bolt Rifle','Stalker Bolt Rifle','Chainsword','Power Fist','Power Weapon','Thunder Hammer']},gr:{n:'Assault Intercessor Grenadier',r:'Operativo',m:1,w:['Heavy Bolt Pistol','Chainsword','Frag Grenade','Krak Grenade']},as:{n:'Assault Intercessor Warrior',r:'Operativo',m:5,w:['Heavy Bolt Pistol','Chainsword']},el:{n:'Eliminator Sniper',r:'Operativo',m:1,w:['Bolt Pistol','Bolt Sniper Rifle']},he:{n:'Heavy Intercessor Gunner',r:'Operativo',m:1,w:['Bolt Pistol','Heavy Bolter','Fists']},gu:{n:'Intercessor Gunner',r:'Operativo',m:1,w:['Auto Bolt Rifle','Auxiliary Grenade Launcher','Bolt Rifle','Stalker Bolt Rifle','Fists']},wa:{n:'Intercessor Warrior',r:'Operativo',m:5,w:['Auto Bolt Rifle','Bolt Rifle','Stalker Bolt Rifle','Fists']}};
let sel={},meta=null,phase='despliegue',st={},objs=[],tool='select',drag=null,color='#e76627',opa=1;
const cp=x=>JSON.parse(JSON.stringify(x)), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function H(){return'<div class="top">⚔ KT COMPANION · ALPHA · ANGELS OF DEATH</div>'}function startScreen(){A.innerHTML='<div style="height:100vh;display:flex;align-items:center;justify-content:center;text-align:center"><div><img src="icon-512.png" width="170"><h2>KT COMPANION</h2><b style="color:#d85b18;letter-spacing:4px">ALPHA VERSION</b></div></div>';setTimeout(team,500)}function team(){A.innerHTML=H()+'<main class="wrap"><h1>NUEVA MATRIZ</h1><div class="card"><h2>⚔ Kill Team</h2><button class="btn primary">✓ Angels of Death</button></div><button class="btn primary" onclick="chooseOps()">SIGUIENTE →</button></main>'}
function chooseOps(){sel={};A.innerHTML=H()+'<main class="wrap"><h1>👥 OPERATIVOS</h1><p class="small">Elige 1 líder y 5 operativos.</p><div class="grid"><div class="card"><h3>LÍDER</h3>'+['cap','ais','isg'].map(row).join('')+'</div><div class="card"><h3>OPERATIVOS</h3>'+['gr','as','el','he','gu','wa'].map(row).join('')+'</div></div><button class="btn primary" onclick="checkOps()">SIGUIENTE →</button></main>'}function row(k){let o=O[k];return'<label class="check"><input type="checkbox" onchange="tog(\''+k+'\',this.checked)"><span><b>'+o.n+'</b><br><span class="small">'+o.r+' · máximo '+o.m+'</span></span></label>'}function tog(k,on){if(on)sel[k]={qty:1,weapons:[]};else delete sel[k]}
function checkOps(){let l=['cap','ais','isg'].filter(k=>sel[k]).length,n=Object.entries(sel).filter(([k])=>O[k].r==='Operativo').reduce((a,[k,v])=>a+v.qty,0);if(l!==1)return alert('Elige 1 líder.');if(n!==5)return alert('Elige exactamente 5 operativos.');chooseWeapons()}
function chooseWeapons(){A.innerHTML=H()+'<main class="wrap"><h1>🔫 ARMAS</h1><p class="small">Se eligen una sola vez y permanecen durante toda la partida.</p>'+Object.entries(sel).map(([k,v])=>'<div class="card"><h3>'+O[k].n+' × '+v.qty+'</h3>'+O[k].w.map(w=>'<label class="check"><input type="checkbox" onchange="wep(\''+k+'\',\''+w.replace(/'/g,"\\'")+'\')">'+w+'</label>').join('')+'</div>').join('')+'<button class="btn primary" onclick="chooseOp()">SIGUIENTE →</button></main>'}function wep(k,w){let a=sel[k].weapons,i=a.indexOf(w);i<0?a.push(w):a.splice(i,1)}function chooseOp(){A.innerHTML=H()+'<main class="wrap"><h1>🎯 OPERACIÓN CRÍTICA</h1><div class="grid">'+OPS.map((x,i)=>'<button class="card btn" onclick="newGame('+i+')">'+x+'</button>').join('')+'</div></main>'}
function newGame(i){meta={id:null,name:'',team:'Angels of Death',map:'Mapa de prueba 01',operation:OPS[i],createdAt:new Date().toISOString(),operatives:cp(sel)};st={};objs=[];phase='despliegue';board()}
function state(){return st[phase]||(st[phase]={objects:cp(objs),notes:'',strategy:[],firefight:[],factionEquipment:[],universalEquipment:[],image:''})}function saveState(){let s=state();s.objects=cp(objs);s.notes=document.getElementById('notes')?.value||s.notes;let c=document.getElementById('cv');if(c)s.image=c.toDataURL('image/png')}
function board(){A.innerHTML=H()+'<main class="wrap"><div class="phasebar">'+PH.map(p=>'<button class="btn '+(p===phase?'selected':'')+'" onclick="goPhase(\''+p+'\')">'+PN[p]+(st[p]?' ✓':'')+'</button>').join('')+'</div><div class="tools"><button class="btn selected" data-tool="select">✋ Arrastrar</button><button class="btn" data-tool="pen">✎ Lápiz</button><button class="btn" data-tool="line">╱ Línea</button><button class="btn" data-tool="arrow">➜ Flecha</button><button class="btn" data-tool="rect">□ Área</button><button class="btn" data-tool="circle">○ Círculo</button><button class="btn" data-tool="text">T Texto</button><button class="btn" onclick="token()">🔵 Ficha</button><button class="btn" onclick="emoji()">🧩 Emoji</button><button class="btn" data-tool="temp">📏 Regla</button><button class="btn" data-tool="ruler">📐 Medidor</button><button class="btn" onclick="styleIt()">🎨 Estilo</button><button class="btn" onclick="undo()">↶</button><button class="btn" onclick="redo()">↷</button><button class="btn primary" onclick="savePhase()">📸 Guardar fase</button><button class="btn primary" onclick="saveMatrix()">💾 Guardar matriz</button><button class="btn" onclick="saved()">📂 Matrices guardadas</button></div><div class="board"><canvas id="cv"></canvas></div><div class="card"><b>📝 NOTAS · '+PN[phase]+'</b><textarea id="notes"></textarea><div class="danger">🗑 ZONA DE ELIMINACIÓN</div></div><div class="panel"><b>👥 Operativos seleccionados</b>'+Object.entries(meta.operatives).map(([k,v])=>'<div class="check"><b>'+O[k].n+' × '+v.qty+'</b> '+v.weapons.map(w=>'<span class="pill">'+esc(w)+'</span>').join(' ')+'</div>').join('')+'</div>'+checks('🎯 Ardides estratégicos','strategy',STR)+checks('🔫 Ardides de tiroteo','firefight',FIR)+checks('🛡️ Equipamiento de facción','factionEquipment',FEQ)+checks('🎒 Equipamiento universal','universalEquipment',UEQ)+'</main>';document.getElementById('notes').value=st[phase]?.notes||'';bindChecks();canvasBind()}
function checks(t,k,a){return'<div class="panel"><h3>'+t+'</h3>'+a.map((x,i)=>'<label class="check"><input type="checkbox" data-k="'+k+'" data-i="'+i+'">'+x+'</label>').join('')+'</div>'}function bindChecks(){document.querySelectorAll('[data-k]').forEach(e=>{e.checked=(st[phase]?.[e.dataset.k]||[]).includes(+e.dataset.i);e.onchange=()=>{let s=state();s[e.dataset.k]=[...document.querySelectorAll('[data-k="'+e.dataset.k+'"]:checked')].map(x=>+x.dataset.i)}})}
function goPhase(p){saveState();if(st[p])objs=cp(st[p].objects||[]);else{let i=PH.indexOf(p),prev=st[PH[Math.max(0,i-1)]];objs=cp(prev?.objects||objs)}phase=p;board()}function savePhase(){saveState();st[phase].saved=true;board()}
function saveMatrix(){saveState();let n=prompt('Nombre de la matriz','Angels of Death · '+new Date().toLocaleDateString('es-ES'));if(!n)return;meta.name=n;meta.phases=cp(st);meta.id=meta.id||'m'+Date.now();let a=JSON.parse(localStorage.getItem('ktMatrices')||'[]').filter(x=>x.id!==meta.id);a.push(cp(meta));localStorage.setItem('ktMatrices',JSON.stringify(a));alert('Matriz guardada.')}
function saved(){let a=JSON.parse(localStorage.getItem('ktMatrices')||'[]');A.innerHTML=H()+'<main class="wrap"><h1>📂 MATRICES GUARDADAS</h1>'+(!a.length?'<p>No hay matrices guardadas.</p>':a.map(m=>'<div class="saved"><b>'+esc(m.name)+'</b><div class="small">'+esc(m.team)+' · '+esc(m.map)+' · '+esc(m.operation)+'</div><button class="btn primary" onclick="openM(\''+m.id+'\')">✏️ Abrir / editar</button> <button class="btn" onclick="pdf(\''+m.id+'\')">📄 Ver / imprimir PDF</button></div>').join(''))+'<button class="btn" onclick="board()">← Volver</button></main>'}function openM(id){let m=JSON.parse(localStorage.getItem('ktMatrices')||'[]').find(x=>x.id===id);if(!m)return;meta=m;sel=cp(m.operatives);st=cp(m.phases||{});phase='despliegue';objs=cp(st.despliegue?.objects||[]);board()}
function pdf(id){let m=JSON.parse(localStorage.getItem('ktMatrices')||'[]').find(x=>x.id===id);if(!m)return;let w=open('','_blank');if(!w)return alert('Permite ventanas emergentes.');let ops=Object.entries(m.operatives).map(([k,v])=>'<li>'+esc(O[k].n)+' × '+v.qty+' — '+v.weapons.map(esc).join(', ')+'</li>').join('');let pages=PH.map(p=>{let s=m.phases?.[p];if(!s)return '';return '<section><h1>'+PN[p]+'</h1>'+(s.image?'<img src="'+s.image+'">':'')+'<h3>Notas</h3><div>'+esc(s.notes||'')+'</div><h3>Ardides estratégicos</h3>'+pdfList(s.strategy,STR)+'<h3>Ardides de tiroteo</h3>'+pdfList(s.firefight,FIR)+'<h3>Equipamiento de facción</h3>'+pdfList(s.factionEquipment,FEQ)+'<h3>Equipamiento universal</h3>'+pdfList(s.universalEquipment,UEQ)+'</section>'}).join('');w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>KT Companion</title><style>@page{size:A4;margin:12mm}body{font:12px Arial;color:#111}section{page-break-after:always}img{max-width:100%;max-height:145mm}.box{border:1px solid #aaa;padding:10px}</style></head><body><section><h1>⚔ KT COMPANION</h1><div class="box"><b>'+esc(m.name)+'</b><br>Kill Team: '+esc(m.team)+'<br>Mapa: '+esc(m.map)+'<br>Operación crítica: '+esc(m.operation)+'<br>Creación: '+new Date(m.createdAt).toLocaleString('es-ES')+'</div><h2>👥 Operativos</h2><ul>'+ops+'</ul><h2>📖 Reglas de facción</h2><p>Angels of Death — regla de facción</p></section>'+pages+'</body></html>');w.document.close();setTimeout(()=>w.print(),500)}function pdfList(a,l){return a?.length?'<ul>'+a.map(i=>'<li>☑ '+esc(l[i])+'</li>').join('')+'</ul>':'<p>— Ninguno seleccionado —</p>'}
let canvas,ctx,history=[],future=[];function canvasBind(){canvas=document.getElementById('cv');let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx=canvas.getContext('2d');ctx.scale(d,d);draw();document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('selected',x===b))});canvas.onpointerdown=e=>{let p=pt(e);drag={s:p,o:tool==='select'?hit(p):null,last:p}};canvas.onpointermove=e=>{if(!drag)return;let p=pt(e);if(tool==='select'&&drag.o){drag.o.x=p.x;drag.o.y=p.y}else if(tool==='pen'){objs.push({t:'line',x1:drag.last.x,y1:drag.last.y,x2:p.x,y2:p.y,color,opa});drag.last=p}else if(['line','arrow','rect','circle','temp','ruler'].includes(tool))drag.e=p;draw()};canvas.onpointerup=e=>{if(!drag)return;let p=pt(e);if(['line','arrow','rect','circle','temp','ruler'].includes(tool))objs.push({t:tool,x1:drag.s.x,y1:drag.s.y,x2:p.x,y2:p.y,color,opa});if(tool==='text'){let t=prompt('Texto');if(t)objs.push({t:'text',x:p.x,y:p.y,text:t,color,opa})}history.push(cp(objs));future=[];drag=null;draw()}}
function pt(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function draw(){if(!ctx)return;let r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);objs.forEach(o=>{ctx.globalAlpha=o.opa??1;ctx.strokeStyle=o.color||color;ctx.fillStyle=o.color||color;ctx.lineWidth=3;if(['line','pen'].includes(o.t)){ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke()}else if(o.t==='rect')ctx.strokeRect(o.x1,o.y1,o.x2-o.x1,o.y2-o.y1);else if(o.t==='circle'){ctx.beginPath();ctx.arc(o.x1,o.y1,Math.hypot(o.x2-o.x1,o.y2-o.y1),0,Math.PI*2);ctx.stroke()}else if(o.t==='arrow'){ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke()}else if(o.t==='text'){ctx.font='16px Arial';ctx.fillText(o.text,o.x,o.y)}else if(o.t==='token'){ctx.beginPath();ctx.arc(o.x,o.y,o.size/2,0,Math.PI*2);ctx.stroke();ctx.font='9px Arial';ctx.textAlign='center';ctx.fillText(o.size+'mm',o.x,o.y+3)}else if(o.t==='icon'){ctx.font=o.size+'px Arial';ctx.textAlign='center';ctx.fillText(o.icon,o.x,o.y)}else if(['temp','ruler'].includes(o.t)){ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke();ctx.font='12px Arial';ctx.fillText((Math.hypot(o.x2-o.x1,o.y2-o.y1)/40).toFixed(2)+'"',o.x2+5,o.y2-5)}ctx.globalAlpha=1})}function token(){let n=Number(prompt('Tamaño de ficha: 25, 28, 32, 40 o personalizado','28'))||28;objs.push({t:'token',x:120,y:100,size:n,color,opa});draw()}function emoji(){let e=prompt('Emoji (🪜 🧱 💣 🔥 ☢️ ⚡ 🔫 ✝️ 🛡️ 🎯 💨 ☠️)','🎯');if(e)objs.push({t:'icon',x:150,y:120,size:42,icon:e,color,opa});draw()}function styleIt(){let c=prompt('Color #RRGGBB',color);if(c)color=c;let a=prompt('Opacidad 0-1',opa);if(a!==null)opa=Math.max(0,Math.min(1,Number(a)||1))}function undo(){if(objs.length){future.push(objs.pop());draw()}}function redo(){if(future.length){objs.push(future.pop());draw()}}function hit(p){for(let i=objs.length-1;i>=0;i--){let o=objs[i];if(o.x!=null&&Math.hypot(p.x-o.x,p.y-o.y)<40)return o}return null}startScreen();
</script></body></html>
