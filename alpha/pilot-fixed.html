function home(){A.innerHTML='<div class="home"><div class="homebox"><img class="homeLogo" src="icon-512.png"><div class="homeTitle">KT COMPANION</div><p class="homeSub">Herramienta de apoyo para Kill Team</p><div class="homeGrid"><button class="card btn homeBtn" onclick="team()"><b>⚔️ Crear nueva matriz</b><span>Selecciona ejército, operativos, mapa y prepara el Board.</span></button><button class="card btn homeBtn" onclick="saved()"><b>📂 Matrices guardadas</b><span>Ver, editar, imprimir PDF o borrar tus matrices.</span></button><button class="card btn homeBtn" onclick="shootCalc()"><b>🎯 Calculadora de disparo</b><span>Calcula las probabilidades básicas de un ataque a distancia.</span></button><button class="card btn homeBtn" onclick="combatCalc()"><b>⚔️ Calculadora de combate</b><span>Calcula las probabilidades básicas de un combate cuerpo a cuerpo.</span></button></div></div></div>'}
function shootCalc(){A.innerHTML=H()+'<main class="wrap"><button class="btn backHome" onclick="home()">← Inicio</button><h1>🎯 CALCULADORA DE DISPARO</h1><div class="card calcGrid"><div><div class="field"><label>Dados de ataque</label><input id="sa" type="number" min="1" value="4"></div><div class="field"><label>Impactar con</label><select id="sh"><option value="2">2+</option><option value="3" selected>3+</option><option value="4">4+</option><option value="5">5+</option></select></div><div class="field"><label>Críticos con</label><select id="sc"><option value="2">2+</option><option value="3">3+</option><option value="4" selected>4+</option><option value="5">5+</option><option value="6">6</option></select></div></div><div><div class="field"><label>Salvación del objetivo</label><select id="ss"><option value="2">2+</option><option value="3" selected>3+</option><option value="4">4+</option><option value="5">5+</option></select></div><div class="field"><label>Dados de defensa</label><input id="sd" type="number" min="1" value="3"></div><button class="btn primary" onclick="calcShoot()">CALCULAR</button><div id="shootResult" class="result">Introduce los valores y calcula.</div></div></div></main>'}

function probHit(n,target){return Math.max(0,(7-target)/6)*n}
function calcShoot(){let a=+document.getElementById('sa').value,h=+document.getElementById('sh').value,c=+document.getElementById('sc').value,d=+document.getElementById('sd').value,s=+document.getElementById('ss').value;let hits=probHit(a,h),crits=probHit(a,c),normal=Math.max(0,hits-crits),saved=d*Math.max(0,(7-s)/6);document.getElementById('shootResult').innerHTML='Impactos esperados: <b>'+hits.toFixed(2)+'</b><br>Críticos esperados: <b>'+crits.toFixed(2)+'</b><br>Impactos normales: <b>'+normal.toFixed(2)+'</b><br>Salvaciones esperadas: <b>'+saved.toFixed(2)+'</b>'}
function calcCombat(){let a=+document.getElementById('ca').value,h=+document.getElementById('ch').value,c=+document.getElementById('cc').value,d=+document.getElementById('cd').value,s=+document.getElementById('cs').value;let hits=probHit(a,h),crits=probHit(a,c),normal=Math.max(0,hits-crits),def=probHit(d,s);document.getElementById('combatResult').innerHTML='Impactos esperados: <b>'+hits.toFixed(2)+'</b><br>Críticos esperados: <b>'+crits.toFixed(2)+'</b><br>Impactos normales: <b>'+normal.toFixed(2)+'</b><br>Defensas esperadas: <b>'+def.toFixed(2)+'</b><br><span class="small">Esta calculadora es una estimación estadística básica; no aplica reglas especiales, cobertura, paradas, Brutal, Piercing, etc.</span>'}
function H(){return'<div class="top">⚔ KT COMPANION · ALPHA · '+(ARMIES[army]?.name||'KT COMPANION')+'</div>'}function startScreen(){A.innerHTML='<div style="height:100vh;display:flex;align-items:center;justify-content:center;text-align:center"><div><img src="icon-512.png" width="170"><h2>KT COMPANION</h2><b style="color:#d85b18;letter-spacing:4px">ALPHA VERSION</b></div></div>';setTimeout(home,900)}function selectArmy(id){army=id;O=id==='pm'?PM_DATA:id==='bok'?BOK_DATA:id==='wk'?WK_DATA:id==='sanc'?SANC_DATA:AOD_DATA;team()}function team(){A.innerHTML=H()+'<main class="wrap"><h1>NUEVA MATRIZ</h1><div class="grid">'+Object.entries(ARMIES).map(([id,a])=>'<button class="card btn '+(id===army?'selected':'')+'" onclick="selectArmy(\''+id+'\')"><h2>'+a.name+'</h2></button>').join('')+'</div><button class="btn primary" onclick="chooseOps()">SIGUIENTE →</button></main>'}
function chooseOps(){sel={};let a=ARMIES[army];if(a.fixed){a.fixed.forEach(k=>sel[k]={qty:1,weapons:[]})}A.innerHTML=H()+'<main class="wrap"><h1>👥 OPERATIVOS</h1><p class="small">Elige '+a.requiredLeaders+' líder y '+a.requiredOps+' operativos.'+(a.fixed?' El equipo incluye además '+a.fixed.map(k=>O[k].n).join(', ')+'.':'')+'</p><div class="grid"><div class="card"><h3>LÍDER</h3>'+a.leader.map(row).join('')+'</div><div class="card"><h3>OPERATIVOS</h3>'+a.ops.map(row).join('')+'</div></div><button class="btn primary" onclick="checkOps()">SIGUIENTE →</button></main>'}function row(k){let o=O[k];return'<div class="check"><input id="op_'+k+'" type="checkbox" onchange="tog(\''+k+'\',this.checked)"><span style="flex:1"><b>'+o.n+'</b><br><span class="small">'+o.r+' · máximo '+o.m+'</span></span><input id="qty_'+k+'" class="qty" type="number" min="1" max="'+o.m+'" value="1" disabled onchange="qtyChanged(\''+k+'\',this.value)"></div>'}function tog(k,on){if(on){sel[k]={qty:1,weapons:[]};let q=document.getElementById('qty_'+k);if(q){q.disabled=false;q.value=1}}else{delete sel[k];let q=document.getElementById('qty_'+k);if(q){q.disabled=true;q.value=1}}}function qtyChanged(k,v){if(!sel[k])return;let n=Math.max(1,Math.min(O[k].m,Number(v)||1));sel[k].qty=n;let q=document.getElementById('qty_'+k);if(q)q.value=n}function checkOps(){let a=ARMIES[army],l=a.leader.filter(k=>sel[k]).length,n=Object.entries(sel).filter(([k])=>O[k].r==='Operativo'&&!a.fixed?.includes(k)).reduce((x,[k,v])=>x+v.qty,0);if(l!==a.requiredLeaders)return alert('Elige '+a.requiredLeaders+' líder.');if(n!==a.requiredOps)return alert('Elige exactamente '+a.requiredOps+' operativos.');chooseWeapons()}
function chooseWeapons(){A.innerHTML=H()+'<main class="wrap"><h1>🔫 ARMAS</h1><p class="small">Se eligen una sola vez y permanecen durante toda la partida.</p>'+Object.entries(sel).map(([k,v])=>'<div class="card"><h3>'+O[k].n+' × '+v.qty+'</h3>'+O[k].w.map(w=>'<label class="check"><input type="checkbox" onchange="wep(\''+k+'\',\''+w.replace(/'/g,"\\'")+'\')">'+w+'</label>').join('')+'</div>').join('')+'<button class="btn primary" onclick="chooseMap()">SIGUIENTE →</button></main>'}function wep(k,w){let a=sel[k].weapons,i=a.indexOf(w);i<0?a.push(w):a.splice(i,1)}function chooseMap(){A.innerHTML=H()+'<main class="wrap"><h1>🗺️ ELEGIR MAPA</h1><p class="small">Selecciona el mapa que aparecerá como fondo del Battle Board y también en el PDF.</p><div class="grid mapgrid">'+Object.entries(MAPS).map(([id,m])=>'<button class="card btn mapcard '+(id===mapChoice?'selected':'')+'" onclick="selectMap(\''+id+'\')"><div class="mapthumb '+id+'"></div><h3>'+m.name+'</h3><p>'+m.desc+'</p></button>').join('')+'</div><button class="btn primary" onclick="chooseOp()">SIGUIENTE →</button></main>'}function selectMap(id){mapChoice=id;chooseMap()}function chooseOp(){A.innerHTML=H()+'<main class="wrap"><h1>🎯 OPERACIÓN CRÍTICA</h1><div class="grid">'+OPS.map((x,i)=>'<button class="card btn" onclick="newGame('+i+')">'+x+'</button>').join('')+'</div></main>'}
function newGame(i){meta={id:null,name:'',team:ARMIES[army].name,army:army,map:MAPS[mapChoice].name,mapId:mapChoice,operation:OPS[i],createdAt:new Date().toISOString(),operatives:cp(sel)};st={};objs=[];phase='despliegue';board()}
function state(){return st[phase]||(st[phase]={objects:cp(objs),notes:'',strategy:[],firefight:[],factionEquipment:[],universalEquipment:[],image:''})}function saveState(){let s=state();s.objects=cp(objs);s.notes=document.getElementById('notes')?.value||s.notes;let c=document.getElementById('cv');if(c)s.image=c.toDataURL('image/png')}
function board(){A.innerHTML=H()+'<main class="wrap"><div class="phasebar">'+PH.map(p=>'<button class="btn '+(p===phase?'selected':'')+'" onclick="goPhase(\''+p+'\')">'+PN[p]+(st[p]?' ✓':'')+'</button>').join('')+'</div><div class="tools"><button class="btn selected" data-tool="select">✋ Arrastrar</button><button class="btn" data-tool="pen">✎ Lápiz</button><button class="btn" data-tool="line">╱ Línea</button><button class="btn" data-tool="arrow">➜ Flecha</button><button class="btn" data-tool="rect">□ Área</button><button class="btn" data-tool="circle">○ Círculo</button><button class="btn" data-tool="text">T Texto</button><button class="btn" onclick="token()">🔵 Ficha</button><button class="btn" onclick="emoji()">🧩 Emoji</button><button class="btn" data-tool="temp">📏 Regla</button><button class="btn" data-tool="ruler">📐 Medidor</button><button class="btn" onclick="styleIt()">🎨 Estilo</button><button class="btn" onclick="undo()">↶</button><button class="btn" onclick="redo()">↷</button><button class="btn primary" onclick="savePhase()">📸 Guardar fase</button><button class="btn primary" onclick="saveMatrix()">💾 Guardar matriz</button><button class="btn" onclick="saved()">📂 Matrices guardadas</button></div><div class="board"><canvas id="cv"></canvas></div><div class="card"><b>📝 NOTAS · '+PN[phase]+'</b><textarea id="notes"></textarea><div class="danger">🗑 ZONA DE ELIMINACIÓN</div></div><div class="panel"><b>👥 Operativos seleccionados</b>'+Object.entries(meta.operatives).map(([k,v])=>'<div class="check"><b>'+O[k].n+' × '+v.qty+'</b> '+v.weapons.map(w=>'<span class="pill">'+esc(w)+'</span>').join(' ')+'</div>').join('')+'</div>'+checks('🎯 Ardides estratégicos','strategy',ARMY_RULES[army]?.strategy||STR)+checks('🔫 Ardides de tiroteo','firefight',ARMY_RULES[army]?.firefight||FIR)+checks('🛡️ Equipamiento de facción','factionEquipment',ARMY_RULES[army]?.factionEquipment||FEQ)+checks('🎒 Equipamiento universal','universalEquipment',UEQ)+'</main>';document.getElementById('notes').value=st[phase]?.notes||'';bindChecks();canvasBind()}
function checks(t,k,a){return'<div class="panel"><h3>'+t+'</h3>'+a.map((x,i)=>'<label class="check"><input type="checkbox" data-k="'+k+'" data-i="'+i+'">'+x+'</label>').join('')+'</div>'}function bindChecks(){document.querySelectorAll('[data-k]').forEach(e=>{e.checked=(st[phase]?.[e.dataset.k]||[]).includes(+e.dataset.i);e.onchange=()=>{let s=state();s[e.dataset.k]=[...document.querySelectorAll('[data-k="'+e.dataset.k+'"]:checked')].map(x=>+x.dataset.i)}})}
function goPhase(p){saveState();if(st[p])objs=cp(st[p].objects||[]);else{let i=PH.indexOf(p),prev=st[PH[Math.max(0,i-1)]];objs=cp(prev?.objects||objs)}phase=p;board()}function savePhase(){saveState();st[phase].saved=true;board()}
function saveMatrix(){saveState();let n=prompt('Nombre de la matriz',ARMIES[army].name+' · '+new Date().toLocaleDateString('es-ES'));if(!n)return;meta.name=n;meta.phases=cp(st);meta.id=meta.id||'m'+Date.now();let a=JSON.parse(localStorage.getItem('ktMatrices')||'[]').filter(x=>x.id!==meta.id);a.push(cp(meta));localStorage.setItem('ktMatrices',JSON.stringify(a));alert('Matriz guardada.')}
function deleteMatrix(id){let a=JSON.parse(localStorage.getItem('ktMatrices')||'[]'),m=a.find(x=>x.id===id);if(!m)return;if(!confirm('¿Borrar definitivamente la matriz «'+(m.name||'Sin nombre')+'»? Esta acción no se puede deshacer.'))return;a=a.filter(x=>x.id!==id);localStorage.setItem('ktMatrices',JSON.stringify(a));saved()}function deleteAllMatrices(){let a=JSON.parse(localStorage.getItem('ktMatrices')||'[]');if(!a.length)return;if(!confirm('¿Borrar TODAS las matrices guardadas? Esta acción no se puede deshacer.'))return;localStorage.removeItem('ktMatrices');saved()}function saved(){let a=JSON.parse(localStorage.getItem('ktMatrices')||'[]');A.innerHTML=H()+'<main class="wrap"><h1>📂 MATRICES GUARDADAS</h1>'+(!a.length?'<p>No hay matrices guardadas.</p>':a.map(m=>'<div class="saved"><b>'+esc(m.name)+'</b><div class="small">'+esc(m.team)+' · '+esc(m.map)+' · '+esc(m.operation)+'</div><button class="btn primary" onclick="openM(\''+m.id+'\')">✏️ Abrir / editar</button> <button class="btn" onclick="pdf(\''+m.id+'\')">📄 Ver / imprimir PDF</button> <button class="btn dangerBtn" onclick="deleteMatrix(\''+m.id+'\')">🗑️ Borrar</button></div>').join(''))NaN}function openM(id){let m=JSON.parse(localStorage.getItem('ktMatrices')||'[]').find(x=>x.id===id);if(!m)return;meta=m;army=m.army||'aod';O=army==='pm'?PM_DATA:army==='bok'?BOK_DATA:army==='wk'?WK_DATA:army==='sanc'?SANC_DATA:AOD_DATA;sel=cp(m.operatives);mapChoice=m.mapId||'map1';st=cp(m.phases||{});phase='despliegue';objs=cp(st.despliegue?.objects||[]);board()}
function pdf(id){let m=JSON.parse(localStorage.getItem('ktMatrices')||'[]').find(x=>x.id===id);if(!m)return;let w=open('','_blank');if(!w)return alert('Permite ventanas emergentes.');let ops=Object.entries(m.operatives).map(([k,v])=>'<li>'+esc(O[k].n)+' × '+v.qty+' — '+v.weapons.map(esc).join(', ')+'</li>').join('');let pages=PH.map(p=>{let s=m.phases?.[p];if(!s)return '';return '<section><h1>'+PN[p]+'</h1>'+(s.image?'<img src="'+s.image+'">':'')+'<h3>Notas</h3><div>'+esc(s.notes||'')+'</div><h3>Ardides estratégicos</h3>'+pdfList(s.strategy,ARMY_RULES[m.army||'aod']?.strategy||STR)+'<h3>Ardides de tiroteo</h3>'+pdfList(s.firefight,ARMY_RULES[m.army||'aod']?.firefight||FIR)+'<h3>Equipamiento de facción</h3>'+pdfList(s.factionEquipment,ARMY_RULES[m.army||'aod']?.factionEquipment||FEQ)+'<h3>Equipamiento universal</h3>'+pdfList(s.universalEquipment,UEQ)+'</section>'}).join('');w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>KT Companion</title><style>@page{size:A4;margin:12mm}body{font:12px Arial;color:#111}section{page-break-after:always}img{max-width:100%;max-height:145mm}.box{border:1px solid #aaa;padding:10px}</style></head><body><section><h1>⚔ KT COMPANION</h1><div class="box"><b>'+esc(m.name)+'</b><br>Kill Team: '+esc(m.team)+'<br>Mapa: '+esc(m.map)+'<br>Operación crítica: '+esc(m.operation)+'<br>Creación: '+new Date(m.createdAt).toLocaleString('es-ES')+'</div><h2>👥 Operativos</h2><ul>'+ops+'</ul><h2>📖 Reglas de facción</h2><p>Angels of Death — regla de facción</p></section>'+pages+'</body></html>');w.document.close();setTimeout(()=>w.print(),500)}function pdfList(a,l){return a?.length?'<ul>'+a.map(i=>'<li>☑ '+esc(l[i])+'</li>').join('')+'</ul>':'<p>— Ninguno seleccionado —</p>'}
let canvas,ctx,history=[],future=[];function canvasBind(){canvas=document.getElementById('cv');let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx=canvas.getContext('2d');ctx.scale(d,d);draw();document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('selected',x===b))});canvas.onpointerdown=e=>{let p=pt(e);drag={s:p,o:tool==='select'?hit(p):null,last:p}};canvas.onpointermove=e=>{if(!drag)return;let p=pt(e);if(tool==='select'&&drag.o){drag.o.x=p.x;drag.o.y=p.y}else if(tool==='pen'){objs.push({t:'line',x1:drag.last.x,y1:drag.last.y,x2:p.x,y2:p.y,color,opa});drag.last=p}else if(['line','arrow','rect','circle','temp','ruler'].includes(tool))drag.e=p;draw()};canvas.onpointerup=e=>{if(!drag)return;let p=pt(e);if(['line','arrow','rect','circle','temp','ruler'].includes(tool))objs.push({t:tool,x1:drag.s.x,y1:drag.s.y,x2:p.x,y2:p.y,color,opa});if(tool==='text'){let t=prompt('Texto');if(t)objs.push({t:'text',x:p.x,y:p.y,text:t,color,opa})}history.push(cp(objs));future=[];drag=null;draw()}}
function pt(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function drawMapBackground(x,w,h){x.save();x.fillStyle='#77766e';x.fillRect(0,0,w,h);x.strokeStyle='rgba(0,0,0,.16)';for(let i=1;i<30;i++){x.beginPath();x.moveTo(i*w/30,0);x.lineTo(i*w/30,h);x.stroke()}for(let i=1;i<22;i++){x.beginPath();x.moveTo(0,i*h/22);x.lineTo(w,i*h/22);x.stroke()}let id=meta?.mapId||'map1';x.fillStyle='#454741';let blocks=id==='map2'?[[.05,.08,.18,.28],[.37,.08,.18,.14],[.68,.1,.22,.22],[.18,.58,.18,.24],[.58,.62,.28,.16]]:id==='map3'?[[.08,.12,.14,.18],[.34,.08,.28,.12],[.72,.16,.15,.28],[.18,.48,.24,.18],[.58,.55,.18,.25]]:[[.08,.1,.23,.15],[.52,.16,.16,.3],[.25,.64,.19,.16],[.72,.68,.15,.23]];blocks.forEach(a=>x.fillRect(a[0]*w,a[1]*h,a[2]*w,a[3]*h));x.restore()}function draw(){if(!ctx)return;let r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);drawMapBackground(ctx,r.width,r.height);objs.forEach(o=>{ctx.globalAlpha=o.opa??1;ctx.strokeStyle=o.color||color;ctx.fillStyle=o.color||color;ctx.lineWidth=window.lineWidth||3;if(['line','pen'].includes(o.t)){ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke()}else if(o.t==='rect')ctx.strokeRect(o.x1,o.y1,o.x2-o.x1,o.y2-o.y1);else if(o.t==='circle'){ctx.beginPath();ctx.arc(o.x1,o.y1,Math.hypot(o.x2-o.x1,o.y2-o.y1),0,Math.PI*2);ctx.stroke()}else if(o.t==='arrow'){ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke()}else if(o.t==='text'){ctx.font='16px Arial';ctx.fillText(o.text,o.x,o.y)}else if(o.t==='token'){ctx.beginPath();ctx.arc(o.x,o.y,o.size/2,0,Math.PI*2);ctx.stroke();ctx.font='9px Arial';ctx.textAlign='center';ctx.fillText(o.size+'mm',o.x,o.y+3)}else if(o.t==='icon'){ctx.font=o.size+'px Arial';ctx.textAlign='center';ctx.fillText(o.icon,o.x,o.y)}else if(['temp','ruler'].includes(o.t)){ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke();ctx.font='12px Arial';ctx.fillText((Math.hypot(o.x2-o.x1,o.y2-o.y1)/40).toFixed(2)+'"',o.x2+5,o.y2-5)}ctx.globalAlpha=1})}function closeToolMenu(){document.getElementById('toolmenu')?.remove()}function openToolMenu(title,body){closeToolMenu();let d=document.createElement('div');d.id='toolmenu';d.className='toolmenu';d.innerHTML='<div class="menu"><h2>'+title+'</h2>'+body+'<div class="toolrow"><button class="btn" onclick="closeToolMenu()">CERRAR</button></div></div>';document.body.appendChild(d);return d}function token(){openToolMenu('🔵 Elegir ficha','<p class="small">Selecciona el diámetro de la peana.</p><div class="choices">'+[25,28,32,40].map(n=>'<button class="btn choice" onclick="placeToken('+n+')">'+n+' mm</button>').join('')+'</div>')}function placeToken(n){objs.push({t:'token',x:120,y:100,size:n,color,opa});closeToolMenu();draw()}function emoji(){let es=['🪜','🧱','💣','🔥','☢️','⚡','🔫','✝️','🛡️','🎯','💨','☠️','🚪','📦','🧍','⬛'];openToolMenu('🧩 Elegir icono','<p class="small">Elige un icono para colocarlo en el tablero.</p><div class="choices">'+es.map(e=>'<button class="btn choice" style="font-size:26px" onclick="placeEmoji(\''+e+'\')">'+e+'</button>').join('')+'</div>')}function placeEmoji(e){objs.push({t:'icon',x:150,y:120,size:42,icon:e,color,opa});closeToolMenu();draw()}function styleIt(){openToolMenu('🎨 Estilo','<div class="toolrow"><label>Color</label><input id="menuColor" type="color" value="'+color+'"></div><div class="toolrow"><label>Opacidad</label><input id="menuAlpha" type="range" min="0" max="1" step="0.05" value="'+opa+'"><span>'+Math.round(opa*100)+'%</span></div><div class="toolrow"><label>Grosor</label><input id="menuWidth" type="range" min="1" max="10" step="1" value="'+(window.lineWidth||3)+'"></div><button class="btn primary" onclick="applyStyleMenu()">APLICAR</button>')}function applyStyleMenu(){color=document.getElementById('menuColor').value;opa=+document.getElementById('menuAlpha').value;window.lineWidth=+document.getElementById('menuWidth').value||3;closeToolMenu();draw()}function undo(){if(objs.length){future.push(objs.pop());draw()}}function redo(){if(future.length){objs.push(future.pop());draw()}}function hit(p){for(let i=objs.length-1;i>=0;i--){let o=objs[i];if(o.x!=null&&Math.hypot(p.x-o.x,p.y-o.y)<40)return o}return null}const PURGE_KEY='ktMatricesPurged_20260824_v1';if(!localStorage.getItem(PURGE_KEY)){localStorage.removeItem('ktMatrices');localStorage.setItem(PURGE_KEY,'1')};startScreen();
</script></body></html>
