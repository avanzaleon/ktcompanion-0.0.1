<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion — Mapa 1</title><style>html,body{margin:0;background:#080b0d;color:#eee;font-family:Arial,sans-serif}#wrap{max-width:1250px;margin:auto;padding:14px}.board{position:relative;width:100%;aspect-ratio:30/22;min-height:300px;border:3px solid #333;overflow:hidden;background:#111}.board img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}.overlay{position:absolute;inset:0;touch-action:none}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}button{background:#20262a;color:#fff;border:1px solid #555;border-radius:5px;padding:9px 12px}h1{font-size:18px}.note{font-size:13px;color:#bbb;margin:8px 0}.warning{display:none;background:#401515;border:1px solid #a33;padding:8px;margin-top:8px}</style></head><body><div id="wrap"><h1>KT Companion — Mapa 1 · prueba</h1><div class="bar"><button id="map1">🗺️ Mapa 1</button><button id="clear">🧹 Limpiar anotaciones</button></div><div class="note">Board de prueba con proporción real 30 × 22 pulgadas. La imagen mantiene sus proporciones y se adapta al área del tablero.</div><div class="board"><img id="map" alt="Mapa 1" crossorigin="anonymous"><canvas id="overlay" class="overlay"></canvas></div><div id="warning" class="warning">No se ha podido cargar la imagen de Cloudinary.</div></div><script>const MAP1='https://res.cloudinary.com/fe7sozkn/image/upload/v1787691808/7ad489f1-9127-4431-a2fe-4281b537241f.jpg';const board=document.querySelector('.board'),map=document.getElementById('map'),cv=document.getElementById('overlay'),ctx=cv.getContext('2d');let objs=[],drag=null;function size(){const r=board.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cv.style.width=r.width+'px';cv.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);draw()}function draw(){const r=board.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.strokeStyle='#ff6500';ctx.fillStyle='#ff6500';ctx.lineWidth=3;objs.forEach(o=>{if(o.t==='line'){ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke()}})}function p(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}cv.addEventListener('pointerdown',e=>{drag=p(e);cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointerup',e=>{if(!drag)return;const q=p(e);if(Math.hypot(q.x-drag.x,q.y-drag.y)>3)objs.push({t:'line',x1:drag.x,y1:drag.y,x2:q.x,y2:q.y});drag=null;draw()});document.getElementById('clear').onclick=()=>{objs=[];draw()};document.getElementById('map1').onclick=()=>{map.src=MAP1};map.onload=()=>{document.getElementById('warning').style.display='none';size()};map.onerror=()=>{document.getElementById('warning').style.display='block'};window.addEventListener('resize',size);map.src=MAP1;size();</script></body></html>
