<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion · PDF de matrices</title><style>body{margin:0;background:#0b0e10;color:#eee;font:14px Arial}.top{padding:16px 20px;background:#151a1d;font-weight:bold}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#151a1d;border:1px solid #394147;border-radius:8px;padding:14px;margin:10px 0}.btn{background:#252d31;color:#fff;border:1px solid #4b565d;border-radius:5px;padding:9px 12px;cursor:pointer}.primary{background:#d85b18;border-color:#f07a38}.phase{page-break-after:always;margin:0 auto 20px;max-width:1000px}.phase h2{margin:0 0 8px}.board{position:relative;width:100%;aspect-ratio:30/22;background:#88877e;border:3px solid #222;overflow:hidden}.board canvas{width:100%;height:100%;display:block}.notes{background:#eee;color:#111;padding:10px;min-height:45px;white-space:pre-wrap}.small{color:#aaa}.no{padding:30px;text-align:center}@media print{.screen{display:none}.printArea{display:block}.phase{break-after:page}.phase:last-child{break-after:auto}body{background:#fff;color:#111}.board{border-color:#111}.notes{background:#fff;border:1px solid #aaa}}@media screen{.printArea{display:none}}</style></head><body><div class="screen"><div class="top">⚔ KT COMPANION · GENERADOR DE PDF</div><div class="wrap"><h1>PDF de matrices</h1><p class="small">Selecciona una matriz para generar un documento con una página por cada fase guardada.</p><div id="list"></div></div></div><div class="printArea" id="printArea"></div><script>const phases=['despliegue','turno1','turno2','turno3','turno4'],labels={despliegue:'DESPLIEGUE',turno1:'TURNO 1',turno2:'TURNO 2',turno3:'TURNO 3',turno4:'TURNO 4'};let matrices=[];try{matrices=JSON.parse(localStorage.getItem('ktMatrices')||'[]')}catch(e){matrices=[]}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function drawPhase(canvas,objs){let d=2,w=900,h=660;canvas.width=w*d;canvas.height=h*d;let x=canvas.getContext('2d');x.setTransform(d,0,0,d,0,0);x.fillStyle='#88877e';x.fillRect(0,0,w,h);x.strokeStyle='rgba(0,0,0,.14)';for(let i=1;i<30;i++){x.beginPath();x.moveTo(i*w/30,0);x.lineTo(i*w/30,h);x.stroke()}for(let i=1;i<22;i++){x.beginPath();x.moveTo(0,i*h/22);x.lineTo(w,i*h/22);x.stroke()}x.fillStyle='#454741';[[.08,.1,.23,.15],[.52,.16,.16,.3],[.25,.64,.19,.16],[.72,.68,.15,.23]].forEach(a=>x.fillRect(a[0]*w,a[1]*h,a[2]*w,a[3]*h));(objs||[]).forEach(o=>{x.save();x.globalAlpha=o.a==null?1:o.a;x.strokeStyle=o.col||'#e76627';x.fillStyle=o.col||'#e76627';x.lineWidth=o.lw||3;x.lineCap='round';if(['line','arrow','ruler'].includes(o.t)){x.beginPath();x.moveTo(o.x1*w,o.y1*h);x.lineTo(o.x2*w,o.y2*h);x.stroke();if(o.t==='arrow'){let q=Math.atan2((o.y2-o.y1)*h,(o.x2-o.x1)*w);x.beginPath();x.moveTo(o.x2*w,o.y2*h);x.lineTo(o.x2*w-16*Math.cos(q-.5),o.y2*h-16*Math.sin(q-.5));x.lineTo(o.x2*w-16*Math.cos(q+.5),o.y2*h-16*Math.sin(q+.5));x.fill()}if(o.t==='ruler'){x.fillStyle='#111';x.font='bold 14px Arial';x.fillText((Math.round(Math.hypot((o.x2-o.x1)*30,(o.y2-o.y1)*22)*4)/4).toFixed(2)+'\"',((o.x1+o.x2)/2)*w,((o.y1+o.y2)/2)*h-7)}}else if(o.t==='pen'){x.beginPath();(o.p||[]).forEach((q,i)=>i?x.lineTo(q.x*w,q.y*h):x.moveTo(q.x*w,q.y*h));x.stroke()}else if(o.t==='rect')x.strokeRect(o.x*w,o.y*h,o.w*w,o.h*h);else if(o.t==='circle'){x.beginPath();x.ellipse(o.x*w,o.y*h,o.rx*w,o.ry*h,0,0,Math.PI*2);x.stroke()}else if(o.t==='token'){x.beginPath();x.arc(o.x*w,o.y*h,o.r,0,Math.PI*2);x.fill();x.strokeStyle='#fff';x.stroke();x.fillStyle='#fff';x.font='bold '+Math.max(10,o.r*.45)+'px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(o.mm,o.x*w,o.y*h)}else if(o.t==='icon'){x.font=o.size+'px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(o.i,o.x*w,o.y*h)}else if(o.t==='text'){x.font='bold '+o.size+'px Arial';x.fillText(o.s,o.x*w,o.y*h)}x.restore()})}function build(id){let m=matrices.find(q=>String(q.id)===String(id));if(!m){alert('No se ha encontrado la matriz.');return}let html='';phases.forEach(p=>{if(!m.phases||!m.phases[p])return;html+='<section class="phase"><h2>⚔ '+esc(m.name)+' · '+labels[p]+'</h2><div class="board"><canvas id="cv_'+p+'"></canvas></div><div class="notes"><b>Notas</b><br>'+esc(m.notes&&m.notes[p]||'')+'</div></section>'});document.getElementById('printArea').innerHTML=html||'<p>No hay fases guardadas.</p>';phases.forEach(p=>{if(m.phases&&m.phases[p])drawPhase(document.getElementById('cv_'+p),m.phases[p].objects)});setTimeout(()=>window.print(),400)}function render(){let el=document.getElementById('list');if(!matrices.length){el.innerHTML='<div class="card no">No hay matrices guardadas. Guarda una desde Battle Board primero.</div>';return}el.innerHTML=matrices.slice().reverse().map(m=>'<div class="card"><h3>'+esc(m.name)+'</h3><p class="small">'+Object.keys(m.phases||{}).length+' fase(s) guardada(s)</p><button class="btn primary" onclick="build(\''+String(m.id).replace(/'/g,'')+'\')">👁 Ver / imprimir PDF</button></div>').join('')}render()</script></body></html>
