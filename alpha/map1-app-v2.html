<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion — Mapa 1</title><style>html,body{margin:0;background:#080b0d;color:#eee;font-family:Arial,sans-serif}#loading{min-height:100vh;display:flex;align-items:center;justify-content:center;font-weight:bold}</style></head><body><div id="loading">Cargando KT Companion…</div><script>
const MAP1='https://res.cloudinary.com/fe7sozkn/image/upload/v1787691808/7ad489f1-9127-4431-a2fe-4281b537241f.jpg';
fetch('pilot-fixed.html?map1='+Date.now()).then(r=>r.text()).then(html=>{
const patch=`const KIMG=new Image();KIMG.crossOrigin='anonymous';KIMG.src='${MAP1}';function drawMapBackground(x,w,h){x.save();if(KIMG.complete&&KIMG.naturalWidth)x.drawImage(KIMG,0,0,w,h);else{x.fillStyle='#77766e';x.fillRect(0,0,w,h)}x.restore()}function draw(){if(!ctx)return;let r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);drawMapBackground(ctx,r.width,r.height);objs.forEach(o=>{ctx.globalAlpha=o.opa??1;ctx.strokeStyle=o.color||color;ctx.fillStyle=o.color||color;ctx.lineWidth=window.lineWidth||3;if(['line','pen'].includes(o.t)){ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke()}else if(o.t==='rect')ctx.strokeRect(o.x1,o.y1,o.x2-o.x1,o.y2-o.y1);else if(o.t==='circle'){ctx.beginPath();ctx.arc(o.x1,o.y1,Math.hypot(o.x2-o.x1,o.y2-o.y1),0,Math.PI*2);ctx.stroke()}else if(o.t==='arrow'){ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke()}else if(o.t==='text'){ctx.font='16px Arial';ctx.fillText(o.text,o.x,o.y)}else if(o.t==='token'){ctx.beginPath();ctx.arc(o.x,o.y,o.size/2,0,Math.PI*2);ctx.stroke();ctx.font='9px Arial';ctx.textAlign='center';ctx.fillText(o.size+'mm',o.x,o.y+3)}else if(o.t==='icon'){ctx.font=o.size+'px Arial';ctx.textAlign='center';ctx.fillText(o.icon,o.x,o.y)}else if(['temp','ruler'].includes(o.t)){ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke();ctx.font='12px Arial';ctx.fillText((Math.hypot(o.x2-o.x1,o.y2-o.y1)/40).toFixed(2)+'\\\"',o.x2+5,o.y2-5)}ctx.globalAlpha=1})}const oldSave=saveState;saveState=function(){oldSave();if(canvas&&KIMG.complete&&KIMG.naturalWidth){draw();state().image=canvas.toDataURL('image/jpeg',.92)}};KIMG.onload=()=>{if(canvas)draw()};`;
html=html.replace('</body>','<script>'+patch+'<'+'/script></body>');document.open();document.write(html);document.close();
}).catch(e=>document.getElementById('loading').textContent='Error: '+e.message);
</script></body></html>
