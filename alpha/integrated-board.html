<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion · Battle Board</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0e10;color:#eee;font-family:Arial,sans-serif;overflow:hidden}#bar{height:48px;box-sizing:border-box;padding:8px 12px;background:#151a1d;border-bottom:1px solid #333;display:flex;gap:8px;align-items:center}#bar b{margin-right:auto}button{background:#20272b;color:#eee;border:1px solid #465056;border-radius:6px;padding:8px 12px;cursor:pointer}.primary{background:#d85b18;border-color:#f07a38}#frame{display:block;width:100%;height:calc(100% - 48px);border:0}</style></head><body><div id="bar"><b>⚔ KT COMPANION · BATTLE BOARD</b><button onclick="back()">← Volver</button><button class="primary" onclick="pdfCurrent()">📄 PDF</button></div><iframe id="frame" src="fases.html?v=20260823-integrated"></iframe><script>
const frame=document.getElementById('frame');
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function win(){return frame.contentWindow}
function doc(){return frame.contentDocument}
function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function session(){try{return JSON.parse(localStorage.getItem('ktCompanionSession')||'null')}catch(e){return null}}
function matrix(id){try{return JSON.parse(localStorage.getItem('ktMatrices')||'[]').find(x=>String(x.id)===String(id))}catch(e){return null}}
function patch(){let w=win(),d=doc();if(!w||!d||!d.getElementById('c'))return;
 const originalSavePhase=d.getElementById('savePhase').onclick; d.getElementById('savePhase').onclick=function(){captureCurrent();return originalSavePhase?.call(this)};
 const originalSaveMatrix=d.getElementById('saveMatrix').onclick; d.getElementById('saveMatrix').onclick=function(){captureCurrent();return originalSaveMatrix?.call(this)};
 const originalOpen=d.getElementById('openMatrices').onclick; d.getElementById('openMatrices').onclick=function(){originalOpen?.call(this);setTimeout(injectPdfButtons,80)};
 const originalStyle=d.getElementById('style').onclick;
 d.querySelectorAll('#phases button').forEach(b=>b.addEventListener('click',()=>captureCurrent(),true));
 const mo=new MutationObserver(()=>injectPdfButtons());mo.observe(d.getElementById('modal'),{childList:true,subtree:true});
 injectPdfButtons();
}
function captureCurrent(){try{let w=win(),d=doc(),c=d.getElementById('c');let s=JSON.parse(localStorage.getItem('ktPhaseTest')||'{"phases":{},"notes":{}}');s.phases=s.phases||{};s.notes=s.notes||{};let p=w.phase||'despliegue';s.phases[p]=s.phases[p]||{objects:[],savedAt:new Date().toISOString()};s.phases[p].objects=JSON.parse(JSON.stringify(w.objs||[]));s.phases[p].notes=d.getElementById('notes')?.value||s.phases[p].notes||'';s.phases[p].image=c?.toDataURL('image/png')||'';localStorage.setItem('ktPhaseTest',JSON.stringify(s))}catch(e){console.warn(e)}}
function injectPdfButtons(){let d=doc();if(!d)return;d.querySelectorAll('[data-open]').forEach(b=>{if(b.parentElement.querySelector('.pdfInjected'))return;let x=document.createElement('button');x.className='btn pdfInjected';x.textContent='📄 PDF';x.style.marginLeft='6px';x.onclick=()=>pdfMatrix(b.dataset.open);b.parentElement.appendChild(x)})}
async function pdfCurrent(){let a=JSON.parse(localStorage.getItem('ktMatrices')||'[]');if(!a.length){alert('No hay matrices guardadas.');return}pdfMatrix(a[a.length-1].id)}
async function pdfMatrix(id){let m=matrix(id);if(!m){alert('No se encontró la matriz.');return}let w=win(),d=doc();try{if(typeof w.openMatrix==='function')w.openMatrix(Number(id));await wait(180)}catch(e){}
 const phases=['despliegue','turno1','turno2','turno3','turno4'], names={despliegue:'DESPLIEGUE',turno1:'TURNO 1',turno2:'TURNO 2',turno3:'TURNO 3',turno4:'TURNO 4'};let shots=[];
 for(const p of phases){let btn=[...d.querySelectorAll('#phases button')].find(x=>x.textContent.startsWith(names[p]));if(!btn)continue;btn.click();await wait(90);let c=d.getElementById('c');shots.push({p,image:c?c.toDataURL('image/png'):'' ,notes:d.getElementById('notes')?.value||''})}
 let sess=session(),ops=m.operatives||sess?.sel||{};let O=(w.O||{});let opHtml=Object.entries(ops).map(([k,v])=>{let o=O[k]||{};return '<li><b>'+esc(o.n||k)+'</b> × '+esc(v.qty||1)+(v.weapons?.length?' — '+v.weapons.map(esc).join(', '):'')+'</li>'}).join('');
 let phaseHtml=shots.map(s=>'<section><h1>'+names[s.p]+'</h1><img src="'+s.image+'"><h3>Notas</h3><div class="box">'+esc(s.notes||'')+'</div>'+lists(m.phases?.[s.p],w)+'</section>').join('');
 let html='<!doctype html><html><head><meta charset="utf-8"><title>KT Companion · '+esc(m.name)+'</title><style>@page{size:A4;margin:10mm}body{font:12px Arial;color:#111}section{page-break-after:always}h1{margin:0 0 8px}img{display:block;width:100%;max-height:145mm;object-fit:contain;border:1px solid #aaa}.box{border:1px solid #aaa;padding:8px;min-height:20px}.pill{display:inline-block;border:1px solid #999;border-radius:10px;padding:3px 6px;margin:2px}.check{font-weight:bold}.meta{line-height:1.7}</style></head><body><section><h1>⚔ KT COMPANION</h1><div class="meta"><b>Matriz:</b> '+esc(m.name)+'<br><b>Kill Team:</b> '+esc(m.team||sess?.meta?.team||'Angels of Death')+'<br><b>Mapa:</b> '+esc(m.map||sess?.meta?.map||'')+'<br><b>Operación:</b> '+esc(m.operation||sess?.meta?.operation||'')+'<br><b>Creada:</b> '+esc(m.createdAt||'')+'</div><h2>👥 Operativos seleccionados</h2><ul>'+opHtml+'</ul><h2>📖 Reglas de facción</h2><p>Angels of Death — información de referencia de facción.</p></section>'+phaseHtml+'</body></html>';
 let p=window.open('','_blank');if(!p){alert('Permite ventanas emergentes para generar el PDF.');return}p.document.write(html);p.document.close();setTimeout(()=>p.print(),500)}
function lists(s,w){let out='';const groups=[['Ardides estratégicos',['Adaptive Tactics','And They Shall Know No Fear','Combat Doctrine','Indomitus']],['Ardides de tiroteo',['Adjust Doctrine','Shock Assault','Transhuman Physiology','Wrath of Vengeance']],['Equipamiento de facción',['Chapter Reliquaries','Purity Seals','Tilting Shields','Auspex']],['Equipamiento universal',['Ammo Cache','Razor Wire','Comms Device','Mines','Light Barricade','Heavy Barricade','Ladders','Portable Barricade','Smoke Grenade','Stun Grenade','Frag Grenade','Krak Grenade','Breaching Charge']]];groups.forEach(([title,arr])=>{let key=title.includes('estratégicos')?'strategy':title.includes('tiroteo')?'firefight':title.includes('facción')?'factionEquipment':'universalEquipment';let a=s?.[key]||[];out+='<h3>'+title+'</h3>'+(a.length?'<ul>'+a.map(i=>'<li class="check">☑ '+esc(arr[i]??i)+'</li>').join('')+'</ul>':'<p>— Ninguno seleccionado —</p>')});return out}
function back(){location.href='index.html?v=20260823'}
frame.addEventListener('load',()=>{setTimeout(patch,80)});
</script></body></html>
