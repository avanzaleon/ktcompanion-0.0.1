<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion · Battle Board</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0e10;color:#eee;font-family:Arial,sans-serif;overflow:hidden}#bar{height:48px;box-sizing:border-box;padding:8px 12px;background:#151a1d;border-bottom:1px solid #333;display:flex;gap:8px;align-items:center}#bar b{margin-right:auto}button{background:#20272b;color:#eee;border:1px solid #465056;border-radius:6px;padding:8px 12px;cursor:pointer}.primary{background:#d85b18;border-color:#f07a38}#frame{display:block;width:100%;height:calc(100% - 48px);border:0}</style></head><body><div id="bar"><b>⚔ KT COMPANION · BATTLE BOARD</b><button onclick="back()">← Volver</button><button class="primary" onclick="pdf()">📄 PDF</button></div><iframe id="frame" src="fases.html?v=20260823-tools-only"></iframe><script>
const frame=document.getElementById('frame');const W=()=>frame.contentWindow,D=()=>frame.contentDocument;
function ev(s){try{return W().eval(s)}catch(e){console.error('Board:',e)}}
function bind(){const w=W(),d=D();if(!d||!d.getElementById('c'))return;
d.querySelectorAll('[data-tool]').forEach(b=>{b.onclick=()=>w.setTool(b.dataset.tool)});
const token=d.getElementById('token');if(token)token.onclick=()=>{let n=prompt('Tamaño de peana (mm):','28');if(![25,28,32,40].includes(Number(n)))n=28;ev('tokenSize='+Number(n)+';setTool("token");draw()')};
const icons=d.getElementById('icons');if(icons)icons.onclick=()=>{let i=prompt('Emoji:','🎯');if(!i)return;let n=prompt('Tamaño:','42');ev('icon='+JSON.stringify(i)+';iconSize='+Math.max(12,Number(n)||42)+';setTool("icon");draw()')};
const style=d.getElementById('style');if(style)style.onclick=()=>{let c=prompt('Color HEX:','#e76627');if(!/^#[0-9a-fA-F]{6}$/.test(c||''))c='#e76627';let a=prompt('Transparencia (0-100):','100');ev('color='+JSON.stringify(c)+';alpha='+Math.max(0,Math.min(100,Number(a)||100))/100+';draw()')};
const undo=d.getElementById('undo');if(undo)undo.onclick=()=>ev('if(hist.length){redoStack.push(cp(objs));objs=hist.pop();sel=null;draw()}');
const redo=d.getElementById('redo');if(redo)redo.onclick=()=>ev('if(redoStack.length){hist.push(cp(objs));objs=redoStack.pop();sel=null;draw()}');
const del=d.getElementById('del');if(del)del.onclick=()=>ev('if(sel){saveHist();objs.splice(objs.indexOf(sel),1);sel=null;draw()}');
const c=d.getElementById('c');if(c)c.style.touchAction='none';
}
frame.addEventListener('load',()=>setTimeout(bind,150));
function back(){location.href='index.html?v=20260823'}
function pdf(){const c=D()?.getElementById('c');if(!c)return;const p=window.open('','_blank');if(!p){alert('Permite ventanas emergentes para generar el PDF.');return}const s=D().getElementById('notes')?.value||'';p.document.write('<!doctype html><html><head><title>KT Companion</title><style>@page{size:A4;margin:10mm}img{width:100%;max-height:250mm;object-fit:contain}.notes{border:1px solid #aaa;padding:8px}</style></head><body><h1>⚔ KT Companion · Battle Board</h1><img src="'+c.toDataURL('image/png')+'"><h3>Notas</h3><div class="notes">'+String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div></body></html>');p.document.close();setTimeout(()=>p.print(),300)}
</script></body></html>
