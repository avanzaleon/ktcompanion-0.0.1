<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion · Battle Board</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0e10;color:#eee;font-family:Arial,sans-serif;overflow:hidden}#bar{height:48px;box-sizing:border-box;padding:8px 12px;background:#151a1d;border-bottom:1px solid #333;display:flex;gap:8px;align-items:center}#bar b{margin-right:auto}button{background:#20272b;color:#eee;border:1px solid #465056;border-radius:6px;padding:8px 12px;cursor:pointer}.primary{background:#d85b18;border-color:#f07a38}#frame{display:block;width:100%;height:calc(100% - 48px);border:0}</style></head><body><div id="bar"><b>⚔ KT COMPANION · BATTLE BOARD</b><button onclick="back()">← Volver</button><button class="primary" onclick="pdfCurrent()">📄 PDF</button></div><iframe id="frame" src="fases.html?v=20260823-boardpdf2"></iframe><script>
const frame=document.getElementById('frame');const wait=ms=>new Promise(r=>setTimeout(r,ms));const win=()=>frame.contentWindow;const doc=()=>frame.contentDocument;
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function session(){try{return JSON.parse(localStorage.getItem('ktCompanionSession')||'null')}catch(e){return null}}
function matrices(){try{return JSON.parse(localStorage.getItem('ktMatrices')||'[]')}catch(e){return []}}
function currentMatrix(id){return matrices().find(m=>String(m.id)===String(id))}
function installBoard(){const w=win(),d=doc(),old=d.getElementById('c');if(!old)return;const c=old.cloneNode(false);old.replaceWith(c);const ctx=c.getContext('2d');let objs=w.objs||[],sel=null,tool='select',down=false,start=null,last=null,preview=null,tokenSize=28,icon='🎯',iconSize=42,color='#e76627',alpha=1,hist=[],redo=[];w.objs=objs;w.tool='select';w.sel=null;w.hist=hist;w.redoStack=redo;
function size(){let r=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=Math.max(1,r.width*dpr);c.height=Math.max(1,r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function pt(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
function push(){hist.push(JSON.parse(JSON.stringify(objs)));if(hist.length>60)hist.shift();redo.length=0}
function mmRadius(mm){return Math.max(5,c.clientWidth*mm/(2*762))}
function dist(o){return(Math.hypot((o.x2-o.x1)*30,(o.y2-o.y1)*22)).toFixed(2)}
function box(o){let W=c.clientWidth,H=c.clientHeight;if(['line','arrow','ruler'].includes(o.t))return{x:Math.min(o.x1,o.x2)*W,y:Math.min(o.y1,o.y2)*H,w:Math.max(10,Math.abs(o.x2-o.x1)*W),h:Math.max(10,Math.abs(o.y2-o.y1)*H)};if(o.t==='token')return{x:o.x*W-o.r,y:o.y*H-o.r,w:o.r*2,h:o.r*2};if(o.t==='icon')return{x:o.x*W-o.size/2,y:o.y*H-o.size/2,w:o.size,h:o.size};if(o.t==='text')return{x:o.x*W,y:o.y*H-o.size,w:o.s.length*o.size*.6,h:o.size};if(o.t==='rect')return{x:o.x*W,y:o.y*H,w:o.w*W,h:o.h*H};if(o.t==='circle')return{x:(o.x-o.rx)*W,y:(o.y-o.ry)*H,w:o.rx*2*W,h:o.ry*2*H};if(o.t==='pen'&&o.p?.length){let xs=o.p.map(q=>q.x*W),ys=o.p.map(q=>q.y*H),x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(10,Math.max(...xs)-x),h:Math.max(10,Math.max(...ys)-y)}}return{x:0,y:0,w:0,h:0}}
function hit(p){let W=c.clientWidth,H=c.clientHeight;for(let i=objs.length-1;i>=0;i--){let b=box(objs[i]);if(p.x*W>=b.x-10&&p.x*W<=b.x+b.w+10&&p.y*H>=b.y-10&&p.y*H<=b.y+b.h+10)return objs[i]}return null}
function move(o,dx,dy){if(['line','arrow','ruler'].includes(o.t)){o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}else if(o.t==='pen')o.p.forEach(q=>{q.x+=dx;q.y+=dy});else{o.x+=dx;o.y+=dy}}
function paint(o){let W=c.clientWidth,H=c.clientHeight;ctx.save();ctx.globalAlpha=o.a==null?1:o.a;ctx.strokeStyle=o.col||color;ctx.fillStyle=o.col||color;ctx.lineWidth=o.lw||3;ctx.lineCap='round';if(['line','arrow','ruler'].includes(o.t)){ctx.beginPath();ctx.moveTo(o.x1*W,o.y1*H);ctx.lineTo(o.x2*W,o.y2*H);ctx.stroke();if(o.t==='arrow'){let q=Math.atan2((o.y2-o.y1)*H,(o.x2-o.x1)*W);ctx.beginPath();ctx.moveTo(o.x2*W,o.y2*H);ctx.lineTo(o.x2*W-16*Math.cos(q-.5),o.y2*H-16*Math.sin(q-.5));ctx.lineTo(o.x2*W-16*Math.cos(q+.5),o.y2*H-16*Math.sin(q+.5));ctx.fill()}if(o.t==='ruler'){ctx.fillStyle='#111';ctx.font='bold 14px Arial';ctx.fillText(dist(o)+'"',((o.x1+o.x2)/2)*W,((o.y1+o.y2)/2)*H-7)}}else if(o.t==='pen'){ctx.beginPath();(o.p||[]).forEach((q,i)=>i?ctx.lineTo(q.x*W,q.y*H):ctx.moveTo(q.x*W,q.y*H));ctx.stroke()}else if(o.t==='rect')ctx.strokeRect(o.x*W,o.y*H,o.w*W,o.h*H);else if(o.t==='circle'){ctx.beginPath();ctx.ellipse(o.x*W,o.y*H,o.rx*W,o.ry*H,0,0,Math.PI*2);ctx.stroke()}else if(o.t==='token'){ctx.beginPath();ctx.arc(o.x*W,o.y*H,o.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold '+Math.max(10,o.r*.42)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.mm,o.x*W,o.y*H)}else if(o.t==='icon'){ctx.font=o.size+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.i,o.x*W,o.y*H)}else if(o.t==='text'){ctx.font='bold '+o.size+'px Arial';ctx.fillText(o.s,o.x*W,o.y*H)}ctx.restore()}
function draw(){let W=c.clientWidth,H=c.clientHeight;ctx.clearRect(0,0,W,H);ctx.fillStyle='#88877e';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(0,0,0,.14)';for(let i=1;i<30;i++){ctx.beginPath();ctx.moveTo(i*W/30,0);ctx.lineTo(i*W/30,H);ctx.stroke()}for(let i=1;i<22;i++){ctx.beginPath();ctx.moveTo(0,i*H/22);ctx.lineTo(W,i*H/22);ctx.stroke()}ctx.fillStyle='#454741';[[.08,.1,.23,.15],[.52,.16,.16,.3],[.25,.64,.19,.16],[.72,.68,.15,.23]].forEach(a=>ctx.fillRect(a[0]*W,a[1]*H,a[2]*W,a[3]*H));objs.forEach(paint);if(preview&&start&&(tool==='temp'||tool==='ruler'))paint({t:'ruler',x1:start.x,y1:start.y,x2:preview.x,y2:preview.y,col:color,a:.65});if(sel){let b=box(sel);ctx.save();ctx.strokeStyle='#fff';ctx.setLineDash([5,4]);ctx.strokeRect(b.x-5,b.y-5,b.w+10,b.h+10);ctx.restore()}}
function set(t){tool=t;w.tool=t;d.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));let s=d.getElementById('status');if(s)s.textContent=t==='select'?'Arrastrar / seleccionar':t}
w.setTool=set;w.draw=draw;
function sync(){w.objs=objs;w.sel=sel;draw()}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);let p=pt(e);if(tool==='select'){sel=hit(p);w.sel=sel;if(sel){push();down=true;last=p}draw();return}if(tool==='text'){let s=prompt('Texto:');if(s){push();objs.push({t:'text',x:p.x,y:p.y,s,size:20,col:color,a:alpha});sync()}return}down=true;start=p;last=p;preview=p;if(tool==='pen'){push();objs.push({t:'pen',p:[p],col:color,a:alpha})}});
c.addEventListener('pointermove',e=>{if(!down)return;let p=pt(e);if(tool==='select'&&sel){move(sel,p.x-last.x,p.y-last.y);last=p;draw();return}if(tool==='pen'){objs[objs.length-1].p.push(p);draw();return}preview=p;draw()});
c.addEventListener('pointerup',e=>{if(!down)return;let p=pt(e);down=false;if(tool==='select'){draw();return}if(tool==='pen'){preview=null;sync();return}push();if(['line','arrow','ruler','temp'].includes(tool))objs.push({t:tool==='temp'?'ruler':tool,x1:start.x,y1:start.y,x2:p.x,y2:p.y,col:color,a:alpha});else if(tool==='rect')objs.push({t:'rect',x:start.x,y:start.y,w:p.x-start.x,h:p.y-start.y,col:color,a:alpha});else if(tool==='circle')objs.push({t:'circle',x:start.x,y:start.y,rx:Math.abs(p.x-start.x),ry:Math.abs(p.y-start.y),col:color,a:alpha});else if(tool==='token')objs.push({t:'token',x:p.x,y:p.y,r:mmRadius(tokenSize),mm:tokenSize,col:color,a:alpha});else if(tool==='icon')objs.push({t:'icon',x:p.x,y:p.y,size:iconSize,i:icon,col:color,a:alpha});preview=null;sync()});
const origLoad=w.loadPhase;if(typeof origLoad==='function')w.loadPhase=function(p){origLoad(p);setTimeout(()=>{objs=w.objs||[];sel=null;hist.length=0;redo.length=0;sync()},0)};
const origOpen=w.openMatrix;if(typeof origOpen==='function')w.openMatrix=function(id){origOpen(id);setTimeout(()=>{objs=w.objs||[];sel=null;sync()},0)};
d.getElementById('undo').onclick=()=>{if(hist.length){redo.push(JSON.parse(JSON.stringify(objs)));objs=hist.pop();w.objs=objs;sel=null;draw()}};d.getElementById('redo').onclick=()=>{if(redo.length){hist.push(JSON.parse(JSON.stringify(objs)));objs=redo.pop();w.objs=objs;sel=null;draw()}};d.getElementById('del').onclick=()=>{if(sel){push();objs.splice(objs.indexOf(sel),1);sel=null;sync()}};
window.addEventListener('resize',size);size();set('select');
}
function captureCurrent(){try{let w=win(),d=doc(),c=d.getElementById('c');let s=JSON.parse(localStorage.getItem('ktPhaseTest')||'{"phases":{},"notes":{}}');s.phases=s.phases||{};s.notes=s.notes||{};let p=w.phase||'despliegue';s.phases[p]=s.phases[p]||{objects:[],savedAt:new Date().toISOString()};s.phases[p].objects=JSON.parse(JSON.stringify(w.objs||[]));s.phases[p].notes=d.getElementById('notes')?.value||s.phases[p].notes||'';s.phases[p].image=c?.toDataURL('image/png')||'';localStorage.setItem('ktPhaseTest',JSON.stringify(s))}catch(e){console.warn(e)}}
function patch(){let d=doc();if(!d||!d.getElementById('c'))return;installBoard();const sp=d.getElementById('savePhase'),sm=d.getElementById('saveMatrix'),om=d.getElementById('openMatrices');if(sp)sp.addEventListener('click',captureCurrent,true);if(sm)sm.addEventListener('click',()=>setTimeout(mergeSessionIntoLastMatrix,80),true);if(om)om.addEventListener('click',()=>setTimeout(injectPdfButtons,100));new MutationObserver(()=>injectPdfButtons()).observe(d.getElementById('modal'),{childList:true,subtree:true});injectPdfButtons()}
function mergeSessionIntoLastMatrix(){try{let a=matrices(),s=session();if(!a.length||!s)return;let m=a[a.length-1];m.team=s.meta?.team||m.team;m.map=s.meta?.map||m.map;m.operation=s.meta?.operation||m.operation;m.sel=s.sel||{};m.session=s;localStorage.setItem('ktMatrices',JSON.stringify(a))}catch(e){console.warn(e)}}
function injectPdfButtons(){let d=doc();if(!d)return;d.querySelectorAll('[data-open]').forEach(b=>{if(b.parentElement.querySelector('.pdfInjected'))return;let x=d.createElement('button');x.className='btn pdfInjected';x.textContent='📄 PDF';x.style.marginLeft='6px';x.onclick=()=>pdfMatrix(b.dataset.open);b.parentElement.appendChild(x)})}
async function pdfCurrent(){let a=matrices();if(!a.length){alert('No hay matrices guardadas.');return}pdfMatrix(a[a.length-1].id)}
async function pdfMatrix(id){let m=currentMatrix(id);if(!m){alert('No se encontró la matriz.');return}let w=win(),d=doc();try{if(typeof w.openMatrix==='function')w.openMatrix(Number(id));await wait(220)}catch(e){}let phases=['despliegue','turno1','turno2','turno3','turno4'],names={despliegue:'DESPLIEGUE',turno1:'TURNO 1',turno2:'TURNO 2',turno3:'TURNO 3',turno4:'TURNO 4'},shots=[];for(const p of phases){let btn=[...d.querySelectorAll('#phases button')].find(x=>x.textContent.startsWith(names[p]));if(!btn)continue;btn.click();await wait(80);let c=d.getElementById('c');shots.push({p,image:c?.toDataURL('image/png')||m.phases?.[p]?.image||'',notes:d.getElementById('notes')?.value||m.phases?.[p]?.notes||''})}let sess=m.session||session()||{},ops=m.sel||sess.sel||{},O=w.O||{};let opHtml=Object.entries(ops).map(([k,v])=>{let o=O[k]||{};let qty=typeof v==='number'?v:(v?.qty??1),we=v?.weapons||[];return '<li><b>'+esc(o.n||v?.name||k)+'</b> × '+esc(qty)+(we.length?' — '+we.map(esc).join(', '):'')+'</li>'}).join('');let phaseHtml=shots.map(s=>'<section><h1>'+names[s.p]+'</h1><img src="'+s.image+'"><h3>Notas</h3><div class="box">'+esc(s.notes)+'</div></section>').join('');let html='<!doctype html><html><head><meta charset="utf-8"><title>KT Companion · '+esc(m.name)+'</title><style>@page{size:A4;margin:10mm}body{font:12px Arial;color:#111}section{page-break-after:always}h1{margin:0 0 8px}img{display:block;width:100%;max-height:145mm;object-fit:contain;border:1px solid #aaa}.box{border:1px solid #aaa;padding:8px;min-height:20px}.check{font-weight:bold}</style></head><body><section><h1>⚔ KT COMPANION</h1><p><b>Matriz:</b> '+esc(m.name)+'</p><p><b>Kill Team:</b> '+esc(m.team||sess.meta?.team||'Angels of Death')+'<br><b>Mapa:</b> '+esc(m.map||sess.meta?.map||'')+'<br><b>Operación:</b> '+esc(m.operation||sess.meta?.operation||'')+'</p><h2>👥 Operativos seleccionados</h2><ul>'+opHtml+'</ul>'+selectionLists(sess,m,w)+'</section>'+phaseHtml+'</body></html>';let p=window.open('','_blank');if(!p){alert('Permite ventanas emergentes para generar el PDF.');return}p.document.write(html);p.document.close();setTimeout(()=>p.print(),500)}
function selectionLists(s,m,w){let out='';const defs=[['⚔ Ardides de estrategia',s.strategy||m.strategy||[]],['🎯 Ardides de tiroteo',s.firefight||m.firefight||[]],['🛡 Equipamiento de facción',s.factionEquipment||m.factionEquipment||[]],['🎒 Equipamiento universal',s.universalEquipment||m.universalEquipment||[]]];for(const [t,a] of defs)out+='<h2>'+t+'</h2><ul>'+(a.length?a.map(i=>'<li class="check">☑ '+esc(typeof i==='string'?i:(i.name||i.label||i.title||JSON.stringify(i)))+'</li>').join(''):'<li>— Ninguno seleccionado —</li>')+'</ul>';return out}
function back(){location.href='index.html?v=20260823'}
frame.addEventListener('load',()=>setTimeout(patch,100));
</script></body></html>
