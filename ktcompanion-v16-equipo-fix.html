<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Companion · v16 + Equipo + Correcciones</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f14}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="ktcompanion-v16-equipo.html?v=fix1"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument,$=id=>d.getElementById(id);function weapon(v){return `<div class="weapon"><div><div class="wname">${v[0]}</div><div class="profile">${v[1]}</div></div><button onclick="this.classList.toggle('on')">Seleccionar</button></div>`}function copies(o,n,c){let x='<div class="weapons">';for(let k=1;k<=c;k++)x+=`<div class="copy"><b>${n}${c>1?' #'+k:''}</b><div class="section"><h3>🎯 Armas a distancia</h3>${o.r.map(weapon).join('')}</div><div class="section"><h3>⚔️ Armas CaC</h3>${o.m.map(weapon).join('')}</div></div>`;return x+'</div>'}w.renderOps=function(){const side=w.currentSide,army=$(side)?.value||'',box=$('ops'),status=$('sideStatus');let out='';Object.entries(w.OPS).forEach(([n,o])=>{const c=(w.counts[side]&&w.counts[side][n])||0;out+=`<div class="op ${c?'has':''}"><div class="ophead"><div class="opname">${n}<div class="role">${o.role}</div></div><div class="qty"><button onclick="changeQtyFix('${n}',-1)">−</button><b>${c}</b><button onclick="changeQtyFix('${n}',1)">+</button></div></div>${c?copies(o,n,c):''}</div>`});box.innerHTML=out;status.textContent=(side==='friend'?'Amigo: ':'Rival: ')+(army||'Ningún ejército');$('counter').textContent=`Líder: ${w.totalLeaders()}/1 · Operativos: ${w.totalOthers()}/5`};w.changeQtyFix=function(n,delta){const side=w.currentSide,c=w.counts[side][n]||0,o=w.OPS[n];if(delta>0){if(c>=o.max)return alert('Máximo alcanzado.');if(o.role==='Líder'&&w.totalLeaders()>=1)return alert('Solo 1 Líder.');if(o.role!=='Líder'&&w.totalOthers()>=5)return alert('Máximo 5 operativos.')}w.counts[side][n]=Math.max(0,c+delta);w.renderOps()};w.switchSide=function(side){w.currentSide=side;d.querySelectorAll('#sideTabs .side').forEach((b,i)=>b.classList.toggle('active',(i===0&&side==='friend')||(i===1&&side==='enemy')));w.renderOps()};w.switchTurn=function(t){w.snapshotTurns();w.currentTurn=t;w.renderTurnChoices();d.querySelectorAll('.turntab').forEach((b,i)=>b.classList.toggle('active',i+1===t))};w.switchTurnSide=function(side){w.snapshotTurns();w.currentTurnSide=side;d.querySelectorAll('#turnSideTabs .side').forEach((b,i)=>b.classList.toggle('active',(i===0&&side==='friend')||(i===1&&side==='enemy')));$('turnSideStatus').textContent=(side==='friend'?'Amigo: ':'Rival: ')+($(side)?.value||'Ningún ejército');w.renderChapter();w.renderTurnChoices()};w.updateTurnSideTabs=function(){$('rivalTab').disabled=false;$('turnRivalTab').disabled=false;$('turnSideStatus').textContent='Amigo: '+($('friend').value||'')};const oldNext=w.next;w.next=function(n){oldNext(n);if(n===4){w.currentTurn=1;w.currentTurnSide='friend';w.renderChapter();w.renderTurnChoices();d.querySelectorAll('.turntab').forEach((b,i)=>b.classList.toggle('active',i===0));w.updateTurnSideTabs()}};w.renderOps()});</script></body></html>
