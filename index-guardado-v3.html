<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f14"><title>KT Companion — Alpha Version</title><style>:root{--p:#151a20;--line:#303a45;--t:#edf2f6}*{box-sizing:border-box}html,body{margin:0;background:#0b0f14;color:var(--t);font:15px system-ui,sans-serif}body{overflow-x:hidden}.splash{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:#0b0f14;transition:opacity .7s}.splash.hide{opacity:0;pointer-events:none}.splash-inner{text-align:center}.splash-logo{position:relative;width:min(78vw,420px)}.splash-logo img{width:100%}.alpha-seal,.brand-seal{border-radius:50%;background:#7c211b;border:3px solid #c45546;color:#f4d1c8;font-weight:900;text-align:center;line-height:1.05;box-shadow:0 4px 12px #000}.alpha-seal{position:absolute;left:3%;top:2%;width:95px;height:95px;display:grid;place-items:center;transform:rotate(-9deg);font-size:12px}.splash-loading{height:4px;width:220px;margin:22px auto;background:#28313a;overflow:hidden}.splash-loading:after{content:"";display:block;width:40%;height:100%;background:#ff5a00;animation:load 1.5s infinite}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(550%)}}#brand{height:76px;display:flex;align-items:center;justify-content:center;background:#10151b;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:25}.brand-logo{position:relative;height:64px;display:flex;align-items:center}.brand-logo img{height:58px;max-width:270px}.brand-seal{position:absolute;left:-18px;top:2px;width:52px;height:52px;display:grid;place-items:center;font-size:7px;transform:rotate(-8deg)}#tools{position:sticky;top:76px;z-index:20;background:#10151b;border-bottom:1px solid var(--line);padding:8px;display:flex;gap:8px;flex-wrap:wrap}#tools button{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer}.primary,.navActive{background:#263b55!important;border-color:#6d9dcc!important}.status{font-size:12px;color:#9aa7b4;padding:0 4px;align-self:center}.saved{display:none;max-width:1050px;margin:auto;padding:14px}.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.mut{color:#9aa7b4}#game{display:block;width:100%;height:calc(100vh - 138px);min-height:850px;border:0}@media(max-width:600px){#brand{height:68px}.brand-logo img{height:50px;max-width:225px}.brand-seal{width:45px;height:45px;left:-12px}#tools{top:68px}#game{height:calc(100vh - 130px);min-height:1000px}}</style></head><body><div id="splash" class="splash"><div class="splash-inner"><div class="splash-logo"><img src="./icon-512.png?v=alpha8"><div class="alpha-seal">ALPHA<br>VERSION</div></div><div class="splash-loading"></div></div></div><header id="brand"><div class="brand-logo"><img src="./icon-512.png?v=alpha8"><div class="brand-seal">ALPHA<br>VERSION</div></div></header><nav id="tools"><button class="primary" id="btnMatrix">⚔️ Matriz</button><button id="btnShoot">🎯 Disparo</button><button id="btnFight">⚔️ Lucha</button><button id="btnSave">💾 Guardar matriz</button><button id="btnSaved">📚 Matrices guardadas</button><span id="status" class="status">Cargando…</span></nav><iframe id="game" src="./ktcompanion-v17-ejercitos2.html?v=stable20260818" title="KT Companion"></iframe><section id="saved" class="saved"><div class="card"><h2>📚 Matrices guardadas</h2><div class="mut">Matrices guardadas en este dispositivo.</div></div><div id="savedList"></div></section><script src="./kt-save-core-v2.js?v=clean2"></script><script src="./kt-weapons-save-fix.js?v=save3"></script><script src="./kt-tacops.js?v=3"></script><script src="./kt-tactical-field-v2.js?v=clean2"></script><script src="./kt-tactical-field-fix.js?v=2"></script><script src="./kt-tactical-field-restore-v1.js?v=1"></script><script src="./kt-tactical-field-layout-fix-v1.js?v=1"></script><script src="./kt-disparo-engine-v5.js?v=3"></script><script src="./kt-calculadoras-v1.js?v=9"></script><script src="./kt-disparo-ui-v3-patch.js?v=8"></script><script src="./kt-lucha-engine-v9.js?v=1"></script><script src="./kt-lucha-engine-v10.js?v=1"></script><script src="./kt-lucha-engine-v11.js?v=2"></script><script src="./kt-lucha-strategy-v1.js?v=1"></script><script src="./kt-pdf-generator-v2.js?v=3"></script><script>(function(){const frame=document.getElementById('game'),status=document.getElementById('status'),saved=document.getElementById('saved'),splash=document.getElementById('splash');let done=false;function hide(){if(done)return;done=true;setTimeout(()=>splash.classList.add('hide'),450)}function ready(){const d=frame.contentDocument,ok=!!d&&!!d.getElementById('friend')&&!!d.getElementById('maps');status.textContent=ok?'✓ Matriz + campo táctico listos':'Esperando matriz…';if(ok)hide();return ok}function closeCalc(){document.getElementById('ktCalcApp')?.remove();frame.style.display='block';document.getElementById('btnMatrix').classList.add('primary');document.getElementById('btnShoot').classList.remove('navActive');document.getElementById('btnFight').classList.remove('navActive')}function showCalc(which){saved.style.display='none';frame.style.display='none';document.getElementById('btnMatrix').classList.remove('primary');document.getElementById('btnShoot').classList.toggle('navActive',which==='shoot');document.getElementById('btnFight').classList.toggle('navActive',which==='fight');if(!document.getElementById('ktCalcApp'))window.ktOpenCalculator();setTimeout(()=>{document.getElementById(which==='fight'?'ktFightTab':'ktShootTab')?.click()},30)}frame.addEventListener('load',()=>setTimeout(ready,200));document.getElementById('btnMatrix').onclick=closeCalc;document.getElementById('btnShoot').onclick=()=>showCalc('shoot');document.getElementById('btnFight').onclick=()=>showCalc('fight');document.getElementById('btnSaved').onclick=()=>{closeCalc();window.showSaved?.()};document.getElementById('btnSave').onclick=()=>{closeCalc();if(!ready()){alert('La matriz todavía está cargando.');return}window.saveGame?.()};setTimeout(ready,700);setTimeout(()=>{if(!done)hide()},4500)})();</script></body></html>
