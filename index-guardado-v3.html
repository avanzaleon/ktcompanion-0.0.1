<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f14"><title>KT Companion — Alpha Version</title><style>:root{--p:#151a20;--line:#303a45;--t:#edf2f6;--orange:#ff5a00;--blue:#6d9dcc;--red:#a62d25}*{box-sizing:border-box}html,body{margin:0;background:#0b0f14;color:var(--t);font:15px system-ui,sans-serif}body{overflow-x:hidden}.splash{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,#1b222b 0,#0b0f14 55%,#05070a 100%);transition:opacity .8s ease,visibility .8s ease}.splash.hide{opacity:0;visibility:hidden;pointer-events:none}.splash-inner{text-align:center;width:min(88vw,520px);animation:splashIn .7s ease-out}.splash-logo{position:relative;display:inline-block;width:min(78vw,420px);filter:drop-shadow(0 12px 28px #000)}.splash-logo img{display:block;width:100%;height:auto}.alpha-seal{position:absolute;left:3%;top:2%;width:105px;height:105px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b84939,#731c18 68%,#45110f);border:4px solid #d36a57;box-shadow:0 4px 0 #3c0d0a,0 10px 24px #000;display:flex;align-items:center;justify-content:center;transform:rotate(-10deg);font-weight:900;font-size:14px;line-height:1.05;letter-spacing:1px;color:#f7d6cc;text-align:center;text-shadow:0 1px 2px #300;z-index:2}.splash-loading{margin:28px auto 10px;height:5px;width:220px;background:#27303a;border-radius:8px;overflow:hidden}.splash-loading:after{content:"";display:block;width:42%;height:100%;background:var(--orange);animation:load 1.8s ease-in-out infinite}.splash-caption{font-size:12px;letter-spacing:3px;color:#8e9aa6;text-transform:uppercase}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(540%)}}@keyframes splashIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}#brand{height:76px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#11171d,#0d1217);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:25;box-shadow:0 5px 18px #0008}.brand-logo{position:relative;height:64px;max-width:330px;display:flex;align-items:center;justify-content:center}.brand-logo img{height:58px;width:auto;max-width:270px;object-fit:contain;filter:drop-shadow(0 4px 9px #000)}.brand-seal{position:absolute;left:-20px;top:1px;width:54px;height:54px;border-radius:50%;background:#7c211b;border:2px solid #c45546;box-shadow:0 3px 8px #000;display:flex;align-items:center;justify-content:center;text-align:center;color:#f4d1c8;font-size:8px;font-weight:900;line-height:1.05;letter-spacing:.5px;transform:rotate(-8deg)}#tools{position:sticky;top:76px;z-index:20;background:#10151b;border-bottom:1px solid var(--line);padding:8px;display:flex;gap:8px;flex-wrap:wrap}#tools button{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer}.primary,.navActive{background:#263b55!important;border-color:#6d9dcc!important}.status{font-size:12px;color:#9aa7b4;padding:0 4px;align-self:center}.saved{display:none;max-width:1050px;margin:auto;padding:14px}.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.mut{color:#9aa7b4}#game{display:block;width:100%;height:calc(100vh - 138px);min-height:850px;border:0;background:#0b0f14}@media(max-width:600px){#brand{height:68px}.brand-logo{height:58px}.brand-logo img{height:50px;max-width:225px}.brand-seal{width:45px;height:45px;left:-12px;font-size:7px}#tools{top:68px}#game{height:calc(100vh - 130px);min-height:1000px}.splash-logo{width:min(88vw,420px)}.alpha-seal{width:86px;height:86px;font-size:12px}}</style></head><body><div id="splash" class="splash"><div class="splash-inner"><div class="splash-logo"><img src="./icon-512.png?v=alpha3" alt="KT Companion"><div class="alpha-seal">ALPHA<br>VERSION</div></div><div class="splash-loading"></div><div class="splash-caption">Cargando KT Companion</div></div></div><header id="brand"><div class="brand-logo"><img src="./icon-512.png?v=alpha3" alt="KT Companion Alpha Version"><div class="brand-seal">ALPHA<br>VERSION</div></div></header><nav id="tools"><button class="primary" id="btnMatrix">⚔️ Matriz</button><button id="btnShoot">🎯 Disparo</button><button id="btnFight">⚔️ Lucha</button><button id="btnSave">💾 Guardar matriz</button><button id="btnSaved">📚 Matrices guardadas</button><span id="status" class="status">Cargando…</span></nav><iframe id="game" src="./ktcompanion-v17-ejercitos2.html?v=stable20260818" title="KT Companion"></iframe><section id="saved" class="saved"><div class="card"><h2>📚 Matrices guardadas</h2><div class="mut">Matrices guardadas en este dispositivo.</div></div><div id="savedList"></div></section><script src="./kt-save-core-v2.js?v=1"></script><script src="./kt-save-pdf-v3.js?v=alpha4"></script><script src="./kt-weapons-save-fix.js?v=4"></script><script src="./kt-tacops.js?v=3"></script><script src="./kt-tactical-field-v2.js?v=4"></script><script src="./kt-tactical-field-fix.js?v=2"></script><script src="./kt-tactical-field-restore-v1.js?v=1"></script><script src="./kt-pdf-map-fix-v2.js?v=alpha4"></script><script src="./kt-disparo-engine-v5.js?v=3"></script><script src="./kt-calculadoras-v1.js?v=9"></script><script src="./kt-disparo-ui-v3-patch.js?v=8"></script><script src="./kt-lucha-engine-v9.js?v=1"></script><script src="./kt-lucha-engine-v10.js?v=1"></script><script src="./kt-lucha-engine-v11.js?v=2"></script><script src="./kt-lucha-strategy-v1.js?v=1"></script><script src="./kt-lucha-ui-v2.js?v=11"></script><script>(function(){const frame=document.getElementById('game'),status=document.getElementById('status'),saved=document.getElementById('saved'),splash=document.getElementById('splash');let splashDone=false;function hideSplash(){if(splashDone)return;splashDone=true;setTimeout(()=>splash.classList.add('hide'),650)}function ready(){const d=frame.contentDocument,ok=!!d&&!!d.getElementById('friend')&&!!d.getElementById('maps');status.textContent=ok?'✓ Matriz + campo táctico listos':'Esperando matriz…';if(ok)hideSplash();return ok}function closeCalc(){document.getElementById('ktCalcApp')?.remove();frame.style.display='block';document.getElementById('btnMatrix').classList.add('primary');document.getElementById('btnShoot').classList.remove('navActive');document.getElementById('btnFight').classList.remove('navActive')}function showCalc(which){saved.style.display='none';frame.style.display='none';document.getElementById('btnMatrix').classList.remove('primary');document.getElementById('btnShoot').classList.toggle('navActive',which==='shoot');document.getElementById('btnFight').classList.toggle('navActive',which==='fight');if(!document.getElementById('ktCalcApp'))window.ktOpenCalculator();setTimeout(()=>{if(which==='fight'){document.getElementById('ktFightTab')?.click()}else{document.getElementById('ktShootTab')?.click()}},30);window.scrollTo({top:0,behavior:'smooth'})}function back(){closeCalc();saved.style.display='none';window.scrollTo({top:0,behavior:'smooth'})}frame.addEventListener('load',()=>setTimeout(ready,200));document.getElementById('btnMatrix').onclick=back;document.getElementById('btnShoot').onclick=()=>showCalc('shoot');document.getElementById('btnFight').onclick=()=>showCalc('fight');document.getElementById('btnSaved').onclick=()=>{back();try{window.showSaved()}catch(e){alert('No se pudo abrir el registro.')}};document.getElementById('btnSave').onclick=()=>{back();if(!ready()){alert('La matriz todavía está cargando.');return}frame.contentWindow.__ktSyncWeapons?.();window.saveGame()};setTimeout(ready,500);setTimeout(ready,1500);setTimeout(()=>{if(!splashDone)hideSplash()},4500)})();</script></body></html>
