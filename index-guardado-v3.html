<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KT Companion</title><style>:root{--p:#151a20;--line:#303a45;--t:#edf2f6}*{box-sizing:border-box}html,body{margin:0;background:#0b0f14;color:var(--t);font:15px system-ui,sans-serif}#tools{position:sticky;top:0;z-index:20;background:#10151b;border-bottom:1px solid var(--line);padding:8px;display:flex;gap:8px;flex-wrap:wrap}#tools button{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer}.primary{background:#263b55!important;border-color:#6d9dcc!important}.status{font-size:12px;color:#9aa7b4;padding:0 4px;align-self:center}.saved{display:none;max-width:1050px;margin:auto;padding:14px}.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.mut{color:#9aa7b4}.saved-actions{display:flex;gap:8px;flex-wrap:wrap}.turn{border:1px solid var(--line);border-radius:10px;padding:9px;margin:8px 0;background:#11171d}.danger{border-color:#7d3d3d!important}#game{display:block;width:100%;height:calc(100vh - 62px);min-height:850px;border:0;background:#0b0f14}@media(max-width:600px){#game{min-height:1000px}}.navActive{background:#263b55!important;border-color:#6d9dcc!important}.calcInfo{display:none;max-width:900px;margin:20px auto;padding:18px}.calcInfo.active{display:block}.calcBox{background:#151a20;border:1px solid #303a45;border-radius:14px;padding:20px;text-align:center}.calcBox h2{margin-top:0}.calcBox button{font:inherit;color:#edf2f6;background:#263b55;border:1px solid #6d9dcc;border-radius:10px;padding:12px 18px;cursor:pointer}.calcBack{margin-top:12px;background:#151a20!important;border-color:#303a45!important}</style></head><body><nav id="tools"><button class="primary" id="btnMatrix">⚔️ Matriz</button><button id="btnShoot">🎯 Disparo</button><button id="btnFight">⚔️ Lucha</button><button id="btnSave">💾 Guardar matriz</button><button id="btnSaved">📚 Matrices guardadas</button><span id="status" class="status">Cargando…</span></nav><iframe id="game" src="./ktcompanion-v17-ejercitos2.html?v=stable20260818" title="KT Companion"></iframe><section id="calcShoot" class="calcInfo"><div class="calcBox"><h2>🎯 Calculadora de disparo</h2><p>Calculadora Kill Team 2024 de ktcalc.</p><button id="openShoot">Abrir calculadora de disparo</button><br><button class="calcBack" id="backShoot">← Volver a la matriz</button></div></section><section id="calcFight" class="calcInfo"><div class="calcBox"><h2>⚔️ Calculadora de lucha</h2><p>Calculadora Kill Team 2024 de ktcalc.</p><button id="openFight">Abrir calculadora de lucha</button><br><button class="calcBack" id="backFight">← Volver a la matriz</button></div></section><section id="saved" class="saved"><div class="card"><h2>📚 Matrices guardadas</h2><div class="mut">Matrices guardadas en este dispositivo.</div></div><div id="savedList"></div></section><script src="./kt-save-core-v2.js?v=1"></script><script src="./kt-save-pdf-v3.js?v=1"></script><script src="./kt-weapons-save-fix.js?v=4"></script><script src="./kt-tacops.js?v=3"></script><script src="./kt-tactical-field-v2.js?v=3"></script><script src="./kt-tactical-field-fix.js?v=1"></script><script src="./kt-pdf-map-fix-v2.js?v=2"></script><script>(function(){const frame=document.getElementById('game'),status=document.getElementById('status'),shoot=document.getElementById('calcShoot'),fight=document.getElementById('calcFight'),saved=document.getElementById('saved');function ready(){const d=frame.contentDocument,ok=!!d&&!!d.getElementById('friend')&&!!d.getElementById('maps');status.textContent=ok?'✓ Matriz + campo táctico listos':'Esperando matriz…';return ok}function hideCalc(){shoot.classList.remove('active');fight.classList.remove('active');frame.style.display='block';document.getElementById('btnMatrix').classList.add('primary');document.getElementById('btnShoot').classList.remove('navActive');document.getElementById('btnFight').classList.remove('navActive')}function backToGame(){hideCalc();saved.style.display='none';window.scrollTo({top:0,behavior:'smooth'})}function showCalc(which){saved.style.display='none';frame.style.display='none';shoot.classList.toggle('active',which==='shoot');fight.classList.toggle('active',which==='fight');document.getElementById('btnMatrix').classList.remove('primary');document.getElementById('btnShoot').classList.toggle('navActive',which==='shoot');document.getElementById('btnFight').classList.toggle('navActive',which==='fight');window.scrollTo({top:0,behavior:'smooth'})}window.backToGame=backToGame;frame.addEventListener('load',()=>setTimeout(ready,200));document.getElementById('btnSaved').onclick=()=>{backToGame();try{window.showSaved()}catch(e){console.error(e);alert('No se pudo abrir el registro.')}};document.getElementById('btnMatrix').onclick=backToGame;document.getElementById('btnShoot').onclick=()=>showCalc('shoot');document.getElementById('btnFight').onclick=()=>showCalc('fight');document.getElementById('openShoot').onclick=()=>window.open('https://ktcalc.com/?view=shoot','_blank','noopener,noreferrer');document.getElementById('openFight').onclick=()=>window.open('https://ktcalc.com/?view=fight','_blank','noopener,noreferrer');document.getElementById('backShoot').onclick=backToGame;document.getElementById('backFight').onclick=backToGame;document.getElementById('btnSave').onclick=()=>{backToGame();if(!ready()){alert('La matriz todavía está cargando.');return}frame.contentWindow.__ktSyncWeapons?.();window.saveGame()};setTimeout(ready,500);setTimeout(ready,1500)})();</script></body></html>
