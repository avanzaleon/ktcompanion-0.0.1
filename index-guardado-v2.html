<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151b"><title>KT Companion 2.0</title><style>body{margin:0;background:#0b0f14;color:#edf2f6;font:15px system-ui,sans-serif}#tools{position:sticky;top:0;z-index:999;background:#10151b;border-bottom:1px solid #303a45;padding:8px;display:flex;gap:8px;flex-wrap:wrap}#tools button{font:inherit;color:#edf2f6;background:#151a20;border:1px solid #303a45;border-radius:10px;padding:10px 13px}.primary{background:#263b55!important;border-color:#6d9dcc!important}#saved{display:none;padding:14px;max-width:1050px;margin:auto}.card{background:#151a20;border:1px solid #303a45;border-radius:14px;padding:14px;margin:10px 0}.mut{color:#9aa7b4}.danger{background:#3b2020!important;border-color:#633838!important}.turn{border:1px solid #303a45;border-radius:10px;padding:10px;margin:8px 0}</style></head><body><div id="tools"><button class="primary" onclick="backToGame()">⚔️ Matriz</button><button onclick="saveGame()">💾 Guardar matriz</button><button onclick="showSaved()">📚 Matrices guardadas</button></div><iframe id="game" src="./ktcompanion-v17-ejercitos2.html?v=20260818stable" style="display:block;width:100%;min-height:calc(100vh - 65px);height:calc(100vh - 65px);border:0"></iframe><main id="saved"><div class="card"><h2>📚 Matrices guardadas</h2><div class="mut">Matrices guardadas en este dispositivo.</div></div><div id="savedList"></div></main><script>const KEY='kt_companion_matrices_v5';const F=()=>document.getElementById('game');const D=()=>F().contentDocument;const W=()=>F().contentWindow;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function sideInfo(side){W().switchSide(side);const counts={};D().querySelectorAll('#ops .op.has').forEach(x=>{const n=x.querySelector('.opname')?.childNodes[0]?.textContent.trim(),q=+(x.querySelector('.qty b')?.textContent||0);if(n&&q)counts[n]=q});return counts}function weaponInfo(){return [...D().querySelectorAll('#ops .op.has .copy')].map(c=>{const n=c.querySelector('b')?.textContent.trim()||'';const ws=[...c.querySelectorAll('.weapon button.on')].map(b=>b.parentElement.querySelector('.wname')?.textContent.trim()).filter(Boolean);return ws.length?{name:n,weapons:ws}:null}).filter(Boolean)}function turnInfo(side){W().switchTurnSide(side);const out={};for(let t=1;t<=4;t++){W().switchTurn(t);out[t]={};['strategy','firefight','faction','universal'].forEach(id=>out[t][id]=[...D().querySelectorAll('#'+id+' input:checked')].map(x=>x.parentElement.querySelector('span')?.textContent.trim()).filter(Boolean))}return out}function chapterInfo(side){try{W().switchTurnSide(side);return [...D().querySelectorAll('#chapter input:checked')].map(x=>x.parentElement.querySelector('span')?.textContent.trim()).filter(Boolean)}catch(e){return[]}}function saveGame(){try{const d=D(),friend=d.getElementById('friend')?.value||'',enemy=d.getElementById('enemy')?.value||'',map=d.querySelector('.mapchoice.selected')?.textContent.trim()||'',operation=(d.querySelector('.opchoice.selected')?.textContent||'').replace(/^\d+\.\s*/,'');if(!friend||!map||!operation)return alert('Selecciona ejército amigo, mapa y operación antes de guardar.');const s={id:Date.now(),date:new Date().toLocaleString('es-ES'),friend,enemy,map,operation,counts:{friend:sideInfo('friend'),enemy:enemy?sideInfo('enemy'):{}},weapons:weaponInfo(),chapter:{friend:chapterInfo('friend'),enemy:enemy?chapterInfo('enemy'):[]},turns:{friend:turnInfo('friend'),enemy:enemy?turnInfo('enemy'):{}}};const a=JSON.parse(localStorage.getItem(KEY)||'[]');a.unshift(s);localStorage.setItem(KEY,JSON.stringify(a));alert('✅ Matriz guardada correctamente.');showSaved()}catch(e){alert('No se pudo guardar: '+e.message)}}function backToGame(){document.getElementById('saved').style.display='none';F().style.display='block'}function showSaved(){const a=JSON.parse(localStorage.getItem(KEY)||'[]');document.getElementById('savedList').innerHTML=a.length?a.map((s,i)=>`<article class="card"><button class="danger" onclick="del(${i})">🗑️ Borrar</button><h3>⚔️ ${esc(s.friend)}${s.enemy?' vs '+esc(s.enemy):''}</h3><div class="mut">🗺️ ${esc(s.map)} · 🎯 ${esc(s.operation)} · 🕒 ${esc(s.date)}</div><p>🟢 <b>Amigo:</b> ${esc(Object.entries(s.counts?.friend||{}).map(x=>x[0]+(x[1]>1?' ×'+x[1]:'' )).join(', ')||'Ninguno')}</p><p>🔴 <b>Rival:</b> ${esc(Object.entries(s.counts?.enemy||{}).map(x=>x[0]+(x[1]>1?' ×'+x[1]:'' )).join(', ')||'Ninguno')}</p><details><summary>🔫 Armas seleccionadas</summary><p>${s.weapons?.length?s.weapons.map(x=>`<b>${esc(x.name)}</b>: ${esc(x.weapons.join(', '))}`).join('<br>'):'—'}</p></details><details><summary>📓 Cuaderno de bitácora</summary>${[1,2,3,4].map(t=>{const f=s.turns?.friend?.[t]||{},r=s.turns?.enemy?.[t]||{};return `<div class="turn"><b>T${t}</b><br>🟢 Estrategia: ${esc((f.strategy||[]).join(', ')||'—')}<br>🟢 Tiroteo: ${esc((f.firefight||[]).join(', ')||'—')}<br>🟢 Equipo facción: ${esc((f.faction||[]).join(', ')||'—')}<br>🟢 Equipo universal: ${esc((f.universal||[]).join(', ')||'—')}<br>🔴 Estrategia: ${esc((r.strategy||[]).join(', ')||'—')}<br>🔴 Tiroteo: ${esc((r.firefight||[]).join(', ')||'—')}<br>🔴 Equipo facción: ${esc((r.faction||[]).join(', ')||'—')}<br>🔴 Equipo universal: ${esc((r.universal||[]).join(', ')||'—')}</div>`}).join('')}</details></article>`).join(''):'<div class="card">No hay matrices guardadas.</div>';F().style.display='none';document.getElementById('saved').style.display='block'}function del(i){const a=JSON.parse(localStorage.getItem(KEY)||'[]');a.splice(i,1);localStorage.setItem(KEY,JSON.stringify(a));showSaved()}</script></body></html>
