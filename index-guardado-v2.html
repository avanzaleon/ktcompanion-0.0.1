<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KT Companion 2.0</title><style>:root{--p:#151a20;--line:#303a45;--t:#edf2f6}*{box-sizing:border-box}html,body{margin:0;background:#0b0f14;color:var(--t);font:15px system-ui,sans-serif}#tools{position:sticky;top:0;z-index:20;background:#10151b;border-bottom:1px solid var(--line);padding:8px;display:flex;gap:8px;flex-wrap:wrap}#tools button{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer}.primary{background:#263b55!important;border-color:#6d9dcc!important}.status{font-size:12px;color:#9aa7b4;padding:0 4px;align-self:center}.saved{display:none;max-width:1050px;margin:auto;padding:14px}.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.mut{color:#9aa7b4}.saved-actions{display:flex;gap:8px;flex-wrap:wrap}.tacgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.tacbranch{border:1px solid var(--line);border-radius:10px;padding:10px;background:#151a20}.tactitle{font-weight:800;margin-bottom:6px;color:#9fc2e7}.tacchoice{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid #29323c}.tacchoice:last-child{border-bottom:0}.tacchoice input{accent-color:#79a9e8}.primaryops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tacsaved{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:10px 0;background:#11171d}#game{display:block;width:100%;height:calc(100vh - 62px);min-height:850px;border:0;background:#0b0f14}@media(max-width:600px){#game{min-height:1000px}.tacgrid,.primaryops{grid-template-columns:1fr}}
</style></head><body>
<nav id="tools"><button class="primary" id="btnMatrix">⚔️ Matriz</button><button id="btnSave">💾 Guardar matriz</button><button id="btnSaved">📚 Matrices guardadas</button><span id="status" class="status">Cargando…</span></nav>
<iframe id="game" src="./ktcompanion-v17-ejercitos2.html?v=stable20260818" title="KT Companion"></iframe>
<section id="saved" class="saved"><div class="card"><h2>📚 Matrices guardadas</h2><div class="mut">Matrices guardadas en este dispositivo.</div></div><div id="savedList"></div></section>
<script src="./kt-save-pdf.js?v=10"></script><script src="./kt-weapons-save-fix.js?v=4"></script><script src="./kt-tacops.js?v=3"></script><script src="./kt-tactical-field-v2.js?v=3"></script><script src="./kt-tactical-field-fix.js?v=1"></script><script src="./kt-pdf-map-fix-v2.js?v=1"></script>
<script>
(function(){const frame=document.getElementById('game'),status=document.getElementById('status');function installWeaponPersistence(){const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||w.__ktWeaponPatchInstalled)return;w.__ktWeaponPatchInstalled=true;const state={friend:{},enemy:{}};const side=()=>d.querySelector('#sideTabs .side.active')?.textContent.includes('RIVAL')?'enemy':'friend';const key=(s,c,n)=>s+'|'+c+'|'+n;const copyName=c=>(c.querySelector('b')?.textContent||'').trim();const weaponName=r=>(r.querySelector('.wname')?.textContent||'').trim();function sync(){const s=side();d.querySelectorAll('#ops .copy').forEach(c=>c.querySelectorAll('.weapon').forEach(r=>{const b=r.querySelector('button');if(b)state[s][key(s,copyName(c),weaponName(r))]=b.classList.contains('on')}))}function restore(){const s=side();d.querySelectorAll('#ops .copy').forEach(c=>c.querySelectorAll('.weapon').forEach(r=>{const b=r.querySelector('button'),k=key(s,copyName(c),weaponName(r));if(b)b.classList.toggle('on',state[s][k]===true)}))}d.addEventListener('click',e=>{const b=e.target?.closest?.('#ops .weapon button');if(!b)return;setTimeout(sync,0)},false);const rr=w.renderOps;if(typeof rr==='function')w.renderOps=function(){const r=rr.apply(this,arguments);setTimeout(restore,0);return r};const ss=w.switchSide;if(typeof ss==='function')w.switchSide=function(){const r=ss.apply(this,arguments);setTimeout(restore,0);return r};w.__ktWeaponState=state;w.__ktSyncWeapons=sync;w.__ktRestoreWeapons=restore;restore()}function ready(){const d=frame.contentDocument,ok=!!d&&!!d.getElementById('friend')&&!!d.getElementById('maps');if(ok){installWeaponPersistence();frame.contentWindow.ktTacReady?.()}status.textContent=ok?'✓ Matriz + campo táctico listos':'Esperando matriz…';return ok}frame.addEventListener('load',()=>setTimeout(ready,100));document.getElementById('btnSave').addEventListener('click',()=>{if(!ready()){alert('La matriz todavía está cargando. Espera un segundo e inténtalo de nuevo.');return}frame.contentWindow.__ktSyncWeapons?.();frame.contentWindow.ktTacReady?.();window.saveGame()});document.getElementById('btnSaved').addEventListener('click',()=>window.showSaved());document.getElementById('btnMatrix').addEventListener('click',()=>window.backToGame());setTimeout(ready,300);setTimeout(ready,1000)})();
</script></body></html>
