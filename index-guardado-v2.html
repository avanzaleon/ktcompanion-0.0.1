<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KT Companion 2.0</title><style>:root{--p:#151a20;--line:#303a45;--t:#edf2f6}*{box-sizing:border-box}html,body{margin:0;background:#0b0f14;color:var(--t);font:15px system-ui,sans-serif}#tools{position:sticky;top:0;z-index:20;background:#10151b;border-bottom:1px solid var(--line);padding:8px;display:flex;gap:8px;flex-wrap:wrap}#tools button{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer}.primary{background:#263b55!important;border-color:#6d9dcc!important}.status{font-size:12px;color:#9aa7b4;padding:0 4px;align-self:center}.saved{display:none;max-width:1050px;margin:auto;padding:14px}.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.mut{color:#9aa7b4}.saved-actions{display:flex;gap:8px;flex-wrap:wrap}.turn{border:1px solid var(--line);border-radius:10px;padding:9px;margin:8px 0;background:#11171d}.danger{border-color:#7d3d3d!important}#game{display:block;width:100%;height:calc(100vh - 62px);min-height:850px;border:0;background:#0b0f14}@media(max-width:600px){#game{min-height:1000px}}</style></head><body><nav id="tools"><button class="primary" id="btnMatrix">⚔️ Matriz</button><button id="btnSave">💾 Guardar matriz</button><button id="btnSaved">📚 Matrices guardadas</button><span id="status" class="status">Cargando…</span></nav><iframe id="game" src="./ktcompanion-v17-ejercitos2.html?v=stable20260818" title="KT Companion"></iframe><section id="saved" class="saved"><div class="card"><h2>📚 Matrices guardadas</h2><div class="mut">Matrices guardadas en este dispositivo.</div></div><div id="savedList"></div></section><script src="./kt-save-pdf.js?v=12"></script><script src="./kt-weapons-save-fix.js?v=4"></script><script src="./kt-tacops.js?v=3"></script><script src="./kt-tactical-field-v2.js?v=3"></script><script src="./kt-tactical-field-fix.js?v=1"></script><script src="./kt-pdf-map-fix-v2.js?v=2"></script><script>(function(){const frame=document.getElementById('game'),status=document.getElementById('status');function ready(){const d=frame.contentDocument,ok=!!d&&!!d.getElementById('friend')&&!!d.getElementById('maps');if(ok)frame.contentWindow.ktTacReady?.();status.textContent=ok?'✓ Matriz + campo táctico listos':'Esperando matriz…';return ok}function fallbackSaved(){const key='kt_companion_matrices_pdf2';let a=[];try{a=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}const box=document.getElementById('savedList');if(!a.length){box.innerHTML='<div class="card">No hay matrices guardadas en este dispositivo.</div>'}else{box.innerHTML=a.map((s,i)=>{const ops=x=>Object.entries(x||{}).map(([n,q])=>n+(q>1?' ×'+q:'')).join(', ')||'Ninguno';let turns='';for(let t=1;t<=4;t++){const f=s.turns?.friend?.[t]||{};turns+='<div class="turn"><b>T'+t+'</b><br>🟢 Estrategia: '+(f.strategy||[]).join(', ')+'<br>🟢 Tiroteo: '+(f.firefight||[]).join(', ')+'<br>🟢 Equipo facción: '+(f.faction||[]).join(', ')+'<br>🟢 Equipo universal: '+(f.universal||[]).join(', ')+'</div>'}return '<article class="card"><div class="saved-actions"><button onclick="window.exportPDF&&window.exportPDF('+i+')">📄 Exportar PDF</button><button class="danger" onclick="window.delSaved&&window.delSaved('+i+')">🗑️ Borrar</button></div><h3>⚔️ '+(s.friend||'')+(s.enemy?' vs '+s.enemy:'')+'</h3><div class="mut">🗺️ '+(s.map||'')+' · 🎯 '+(s.operation||'')+' · 🕒 '+(s.date||'')+'</div><p>🟢 <b>Operativos:</b> '+ops(s.counts?.friend)+'</p><p>🔴 <b>Rival:</b> '+ops(s.counts?.enemy)+'</p><details><summary>📓 Registro T1-T4</summary>'+turns+'</details></article>'}).join('')}document.getElementById('saved').style.display='block';frame.style.display='none';window.scrollTo(0,0)}function showSavedSafe(){try{if(typeof window.showSaved==='function')window.showSaved();else fallbackSaved()}catch(e){fallbackSaved()}}function back(){document.getElementById('saved').style.display='none';frame.style.display='block';window.scrollTo(0,0)}frame.addEventListener('load',()=>setTimeout(ready,100));document.getElementById('btnSaved').onclick=showSavedSafe;document.getElementById('btnMatrix').onclick=back;document.getElementById('btnSave').onclick=()=>{if(!ready()){alert('La matriz todavía está cargando.');return}frame.contentWindow.ktTacReady?.();if(typeof window.saveGame==='function')window.saveGame();else alert('El módulo de guardado todavía está cargando. Recarga la página.')};setTimeout(ready,300);setTimeout(ready,1000)})();</script></body></html>
